pre-commit:
  commands:
    notebooktester:
      priority: 1
      output: executing
      files: git ls-files
      glob: '*.ipynb'
      run: uv run notebooktester {staged_files} -t 240 -w 8 -pb
    clean-jupyter:
      priority: 2
      files: git ls-files
      glob: '*.ipynb'
      run: uv run jupyter nbconvert --clear-output --inplace {staged_files}
      stage_fixed: true
    format:
      priority: 2
      files: git ls-files
      glob: '*.{py,ipynb}'
      run: uv run ruff format {staged_files}
      stage_fixed: true
    ruff:
      priority: 2
      files: git ls-files
      glob: '*.py'
      run: uv run ruff check {staged_files} --fix
    typecheck:
      files: git ls-files
      glob: '*.py'
      # research scripts import undeclared packages; see [tool.ruff] in pyproject.toml
      exclude:
        - 'planning/research/**/*.py'
      run: uv run ty check {staged_files}
    lychee:
      run: lychee . --suggest --max-concurrency 32 --cache --exclude toptal --format detailed --max-cache-age 7d
