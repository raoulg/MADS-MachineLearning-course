pre-commit:
  commands:
    notebooktester:
      priority: 1
      output: executing
      files: git ls-files
      glob: '*.ipynb'
      exclude:
        - 'archive/**'
        - 'legacy/**'
      run: uv run notebooktester {staged_files} -t 240 -w 8 -pb
    clean-jupyter:
      priority: 2
      files: git ls-files
      glob: '*.ipynb'
      exclude:
        - 'archive/**'
        - 'legacy/**'
      run: uv run jupyter nbconvert --clear-output --inplace {staged_files}
      stage_fixed: true
    format:
      priority: 2
      files: git ls-files
      glob: '*.{py,ipynb}'
      exclude:
        - 'archive/**'
        - 'legacy/**'
      run: uv run ruff format {staged_files}
      stage_fixed: true
    ruff:
      priority: 2
      files: git ls-files
      glob: '*.py'
      exclude:
        - 'archive/**'
        - 'legacy/**'
      run: uv run ruff check {staged_files} --fix
    typecheck:
      files: git ls-files
      glob: '*.py'
      # research scripts and the reader's uv scripts import packages they declare inline,
      # not in the project; see [tool.ruff] in pyproject.toml
      exclude:
        - 'planning/research/**/*.py'
        - 'reader/**'
        - 'archive/**'
        - 'legacy/**'
      run: uv run ty check {staged_files}
    lychee:
      # The repository's own Pages links are checked against pages/, which Pages
      # publishes, so a page linked in the same commit that adds it passes.
      run: >-
        lychee . --suggest --max-concurrency 32 --cache --exclude toptal --format detailed --max-cache-age 7d
        --remap "^https://raoulg\.github\.io/MADS-MachineLearning-course/([^#]*)(#.*)?$ file://$(pwd)/pages/\$1"
