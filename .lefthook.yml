pre-commit:
  commands:
    notebooktester:
      priority: 1
      glob: '*.ipynb'
      run: uv run notebooktester notebooks -v -t 240 -w 8
    clean-jupyter:
      priority: 2
      files: git ls-files
      glob: '*.ipynb'
      run: uv run jupyter nbconvert --clear-output --inplace {staged_files}
      stage_fixed: true
    format:
      priority: 2
      files: git ls-files
      glob: '*.{py, ipynb}'
      run: uv run ruff format {staged_files}
      stage_fixed: true
    ruff:
      priority: 2
      files: git ls-files
      glob: '*.py'
      run: uv run ruff check {staged_files} --fix
    pyright:
      files: git ls-files
      glob: '*.py'
      run: uv run pyright {staged_files}
    lychee:
      run: lychee . --suggest --max-concurrency 32 --cache --exclude toptal --format detailed --max-cache-age 7d
