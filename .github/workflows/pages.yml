name: pages

# Publishes presentations/ to GitHub Pages:
# https://raoulg.github.io/MADS-MachineLearning-course/<file>.html

on:
  push:
    branches: [master]
    paths:
      - "presentations/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: presentations

      - id: deployment
        uses: actions/deploy-pages@v5
