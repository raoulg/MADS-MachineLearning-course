decisions:

  - id: D17
    to_be_added_to: masterplan.yml decisions
    answers: >
      "we already use imdb in lesson 1 as a demo, so maybe something more
      challenging?" (owner, 2026-08-01) — and independently, C1 + C2, which say
      the same thing from the data side.
    decision: >
      **L5 drops IMDB.** The lesson's text dataset becomes a long-document
      corpus, so that the chunk axis it teaches is real rather than staged, and
      so that L5 is not lesson 1 with a bigger head. IMDB survives in L5 only as
      a *string literal* — the `<br />`-infested review in
      `05_imdb_preprocessing` cell 9 is the best available motivation for a
      normaliser (goal 5.11) and costs no dataset dependency to keep.
    recommended_replacement: >
      **`coastalcph/lex_glue`, config `scotus`** — US Supreme Court opinions,
      13 issue areas, single-label. See datasets.SCOTUS for the measurements.
      The pick between `scotus` and `ecthr_a` is L5.Q1.
    made_by: owner decided the *direction* 2026-08-01; the concrete id is this
      plan's recommendation and needs the owner's confirmation (L5.Q1).
    consequences_accepted:
      - "a new cache must be built and published under pttrn-io before students
         can run the lesson (P0.3 machinery already exists — `make publish-all`
         via scripts/publish_cache.py)"
      - "05_imdb_preprocessing and 06_imdb_attention are replaced by one
         notebook, not renamed (C6)"
      - "the IMDB kill-list rows for L5 close by **deletion** rather than by
         swap, which is a cheaper outcome than the table anticipated"
      - "L5 stops sharing a dataset with L1, so the two lessons no longer
         accidentally answer the same question with the same numbers"

  - id: D18
    to_be_added_to: masterplan.yml decisions (or folded into P2.6's rewrite)
    answers: what L5's vector-level half is, given C1
    decision: >
      **P2.6 is rewritten from "chunking + aggregator ablation" to "the context
      window is a budget: measure what truncation costs you".** L1 owns
      chunking-as-mechanics (how a long text becomes `(C, D)`, why masked mean
      beats mean when most of C is padding). L5 owns chunking-as-a-decision:
      how much of the document you can afford to read, where in a document the
      signal lives, and whether a *learned* aggregator finds it.
      The ladder the new notebook walks, in cells:
        first chunk only  (= truncation, what a plain transformer does)
        -> mean over chunks        (designed, free)
        -> attention over chunks   (learned, ~150k parameters)
        -> TransformerBlock over chunks (learned, with position)
      Each rung is the same head on the same cache with one component swapped,
      which is `composition_over_configuration` demonstrated rather than
      asserted.
    why_this_is_not_a_repeat: >
      L1 compares two aggregators on data where 86% of items have one chunk.
      L5 compares four on data where **96% have more than one** and the median
      is 15 (measured, datasets.SCOTUS). Same components, different question,
      and the second question only becomes askable once the data is long.
    what_the_rungs_actually_measured: >
      rung 1 -> 2 is worth ~4 accuracy points and is stable across seeds; rungs
      3 and 4 are not worth anything at this budget (C9). The notebook is built
      around the first step, and the flat top of the curve is the honest part —
      see C9.what_it_means_for_the_lesson.

  - id: D23
    to_be_added_to: masterplan.yml decisions
    title: L5 gains a composition notebook — architecture as assembly, then ablation
    answers: >
      "instead of just swapping the old datasets, create new notebooks that
      more fully embrace the capabilities of vectormesh (eg with the MoE or
      pretrained models that vectorize the texts and combine that with regex);
      these options come up much nicer with the new datasets" (owner,
      2026-08-01).
    decision: >
      **L5 gets `06_composition.ipynb`, a second new notebook**, and L5
      therefore stays at 8 notebooks instead of shrinking to 7. It teaches the
      part of vectormesh nothing in the course currently touches: `Parallel`,
      `Concatenate2D`/`Concatenate3D`, `CollateParallel`, and the routing
      family `Gate -> Highway -> MoE`. The vehicle is two representations of
      the same opinion — a frozen granite embedding and a designed legal-regex
      stream — fused first per document, then per chunk.
    why_the_legal_corpus_is_what_makes_it_possible: >
      three things that IMDB could not give and SCOTUS does.
        - **the chunk axis is real** (18.3 chunks/document), so per-chunk fusion
          via `Concatenate3D` is a different operation from document-level
          fusion rather than the same one written twice;
        - **the designed features are readable domain concepts** —
          `due process`, `antitrust`, `cite:USC`, `amend:fourteenth` — so
          "designed vs learned" is legible instead of abstract, in a way
          `great|terrible|acting` on film reviews never quite was;
        - **13 imbalanced classes** make the routing question ("do experts
          specialise by issue area?") a question with a checkable answer.
    what_it_absorbs_rather_than_duplicates: >
      vectormesh's own notebooks 2 (`2_design`) and 3 (`3_moe`) teach exactly
      this material — **on the Dutch `aktes` cache, which the course cannot
      distribute** (masterplan meta). So the course has been unable to teach
      the library's central design lesson at all. SCOTUS is the distributable
      twin: same pipelines, same questions (does the regex branch contribute?
      does the router specialise or collapse to uniform? 4 experts x 64 vs 1 x
      256 at equal parameters?), on a cache students can download.
    it_is_built_around_a_negative_result: >
      measured before writing this: the fusion does not win, and neither does
      the MoE (C10). That is not a reason to drop the notebook — the components
      are the syllabus, and the ablation discipline is the skill. It *is* a
      reason to write the notebook as "compose, then ablate, and report what
      you find", rather than as a demonstration of a technique that works.
    cost: >
      L5 breaks even on cells instead of paying for itself (proposed_arc.net).
      The lever, if room is needed later, is L5.Q6.
    made_by: owner, 2026-08-01
    date: 2026-08-01

