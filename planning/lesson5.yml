# =============================================================================
# Lesson 5 (notebooks/5_attention) — refactor plan
#
# Parent: planning/masterplan.yml (phase_2 P2.2/P2.3/P2.6, D5/D7/D10)
# Kill list rows: planning/mads_datasets_killlist.md § "Lesson 5"
#
# L5 is the lesson that owns attention. It is also the lesson where the
# masterplan's phase_2 task (P2.6) turned out to describe something L1 has
# already built — so this plan spends its first half saying what L5 must NOT
# repeat, and its second half on the thing only L5 can do: what happens when a
# document does not fit in the encoder's context window.
# =============================================================================

meta:
  lesson: L5
  dir: notebooks/5_attention
  status: >
    PLAN — nothing implemented. Written 2026-08-01, after L1 and L2 shipped and
    L3 was planned. Every number marked `measured` was produced on this machine
    today (M-series, MPS, warm HF cache); everything else is a proposal. Two
    decisions belong to the owner and are flagged: the dataset pick (L5.Q1) and
    the gestures replacement — the latter **answered 2026-08-01, WISDM, D22**.
  created: 2026-08-01
  updated: 2026-08-01
  phase: 2 (datasets + the cache as the default entry point)
  goal: >
    L5 answers two questions. **How does a sequence reweigh itself?** —
    attention from scratch, which is the architecture family this lesson owns
    and hand-rolls (handroll_once_then_reuse). And the one that is genuinely
    new at the vector level: **what do you do with a document that does not fit
    in the context window?** There are three answers — truncate it, chunk it
    and aggregate, or pay for a long-context model — and the lesson makes the
    student measure the first two instead of being told which is better.
    That second question is where the designed/learned line reappears in this
    lesson: a mean over chunks is a designed aggregator, an AttentionAggregator
    is a learned one, and the comparison is three lines of code.
  sequencing_note: >
    Written before lesson4.yml, following the precedent set on 2026-07-31 when
    lesson3.yml jumped the queue. Nothing here touches L4. One dependency runs
    the other way: L5/03_Attention_gestures shares its dataset with L3/04, so
    the gestures swap is executed for **both** notebooks in a single pass (kill
    list § Ordering, item 6). Decided 2026-08-01 as WISDM (D22). L4/01 was
    originally in this group and has left it — lesson4.yml moved its search
    onto an image cache, so it has no GESTURES site.

# -----------------------------------------------------------------------------
# Corrections to the masterplan and to the kill list, found by reading the
# notebooks and measuring the data today. Per planning/README.md: when reality
# contradicts the plan, reality wins.
# -----------------------------------------------------------------------------
corrections:

  - id: C1
    severity: this one removes L5's assigned task, so read it first
    supersedes: masterplan P2.6 ("L5 — chunking as the answer to the context window")
    finding: >
      **P2.6 has already been built — in lesson 1.** `07_vectors.ipynb` (46
      cells, shipped 2026-07-31) does the entire thing: it reads `chunk_sizes`
      out of the cache metadata (cell 34), explains `tensordtype: 2` as "items
      no longer have the same shape" (33), collates with
      `FixedPadding(max_chunks=2)` (36), names `(B, C, D)` as one rung above
      the regex path (37), aggregates with `MaskedMeanAggregator` (38-40) with
      the line "aggregation is the only rank-reducing step in the whole
      pipeline", and ships **the aggregator ablation as exercise E1** (45).
    consequence: >
      Two things. (a) phase_2's exit criterion "one aggregator ablation exists
      as a graded exercise" is **already met**, by L1, and should be ticked
      there rather than waited on here. (b) If L5 executes P2.6 as written it
      re-teaches lesson 1 with a different dataset, which is the single worst
      outcome available to this refactor — it spends the room that make_room
      just paid for on a repeat.
    what_L5_gets_instead: see proposed_arc and C2. The chunk axis in L1 is
      decorative; in L5 it is the subject.

  - id: C2
    severity: the measurement that forces the dataset change
    finding: >
      **IMDB cannot teach chunking, because IMDB does not chunk.** Measured two
      ways today, agreeing:
        - the *published* cache
          (pttrn-io/imdb-granite-embedding-small-english-r2, train split), read
          straight out of `metadata["embed"]["chunk_sizes"]`:
            1 chunk 21.501 (86.0%) | 2 chunks 2.879 (11.5%) | 3 chunks 587 (2.3%)
            4 chunks 26 | 5 chunks 5 | 6 chunks 1 | 8 chunks 1
        - a fresh tokenisation of 2.000 shuffled train reviews with the same
          granite tokenizer: median **227** tokens, p90 584, p99 1.119, max
          1.374. At `max_length=512, stride=51`, **87.3%** of documents are a
          single chunk and the mean is 1.15 chunks/document.
    consequence: >
      For six documents in seven the `(B, C, D)` tensor is `(B, 1, D)` with the
      rest padding, so "which aggregator?" is a question about padding, not
      about content. L1's E1 (mean vs masked mean) is a *fair* exercise on this
      data precisely because it is a question about padding — that is why it
      belongs there. But mean-vs-attention has nothing to chew on: there is
      nothing to attend over.
    the_tempting_wrong_fix: >
      Shrinking the context window makes IMDB chunk on demand. Measured on the
      same 2.000 reviews: at `max_length=256` 41.6% of documents are
      multi-chunk (mean 1.65), and at `max_length=128` **88.5%** are (mean
      3.01). So one could hand the encoder a smaller window and manufacture a
      chunk axis.
      **Do not.** That is staging a scenario to keep a demo alive — the exact
      mistake D8 named — and it also costs a fresh cache (~2h/split on CPU) to
      produce data that is worse than what a real long-document corpus gives
      for free. The numbers are recorded here because they are the honest
      answer to "could we just...", not because they are a plan.

  - id: C3
    finding: >
      The published IMDB cache still carries the raw `text` column. Its
      `features` are `[text, label, regex_features, onehot, embed]` — i.e.
      L1/07's `VectorCache.create` was called without `remove_columns`, unlike
      L2's image caches where `remove_columns=["image"]` is what makes the
      artefact distributable.
    why_it_matters_here: >
      Harmless on disk (25k reviews is a few MB next to 158 MB of vectors) and
      genuinely useful in L5, because the long-document notebook wants to show
      a chunk *next to the text it came from*. But it means "a cache ships a
      pointer, not the payload" is not a rule the course actually follows, and
      L5 is where a student will notice, since it is the lesson that looks
      inside chunks. State the trade-off out loud: text is cheap and quotable,
      pixels are not, so the two caches make different calls on purpose.
    also: >
      the cache's `vectormesh_version` is recorded as **0.2.0** — it was built
      before the 0.4.x line. Nothing is wrong with it, but a cache records the
      library that made it, and that is worth one sentence in the metadata
      reading, because the student will otherwise assume it matches their venv.

  - id: C4
    finding: >
      `references/leerdoelen/les5.md` points at notebooks that do not exist.
      Its material table names `05_metrics.ipynb`, `04_imdb_attention.ipynb`
      and `03_imdb_preprocessing.ipynb`; the folder holds `07_metric.ipynb`,
      `06_imdb_attention.ipynb` and `05_imdb_preprocessing.ipynb`. So the file
      is already one renumber behind, *before* this plan renumbers anything.
    also: >
      goal **5.12** ("kan een datapreprocessor aanpassen voor een dataset")
      lists its material as "exercises, mads_datasets" — a package that is
      being deleted. The kill list already proposes the replacement
      ("implement your own `BaseVectorizer`"); this makes it a leerdoelen edit
      too, not only a notebook edit.
    consequence: P6.1 is not a tidy-up here, it is a prerequisite for the
      lesson's own table being true. Fix les5.md in the same pass as L5.

  - id: C5
    finding: >
      **The lesson teaches tokenization after it uses it.** `01_reweighing`
      cells 11-13 train a `WordLevel` tokenizer on three Dutch sentences and
      call `tokenizer.encode`, then embed the result — all before
      `04_tokenization` explains what a tokenizer, a vocabulary or an embedding
      lookup is. `04_tokenization` then re-introduces the same `Tokenizer` /
      `WordLevelTrainer` / `Whitespace` construction from scratch (cells 6-9).
    consequence: >
      the fix is a reorder, not a rewrite: tokenization becomes notebook 01 and
      reweighing 02. `01_reweighing`'s three tokenizer cells shrink to two lines
      that *use* what the student just built, and the Dutch "bank" example — a
      genuinely good polysemy demo, and the reason the notebook works — is
      untouched.

  - id: C6
    finding: >
      `05_imdb_preprocessing` and `06_imdb_attention` are 55 cells that share
      one idea and duplicate their code. Both build the same BPE tokenizer with
      the same `Sequence([NFD(), Replace("<br />", ""), StripAccents(),
      Lowercase()])` normaliser (05 cell 12, 06 cell 7), and both define the
      **same hand-written `Preprocessor` class** (05 cell 18, 06 cell 10) —
      copied, not imported. 05 ends by saying "all this code is wrapped into
      the DatasetFactoryProvider, which you can see in the next notebook",
      which is a pointer at the package being removed.
    consequence: >
      this is exactly the drift L2 solved with `cnn.py` (lesson2.yml C10): two
      copies that both run, so nothing fails when they diverge. The two
      notebooks collapse into one, and what is left of the preprocessing lesson
      (goal 5.11 — normalisers, lowercase, strip xml) lives in the tokenization
      notebook where it belongs.

  - id: C7
    finding: >
      Two of the eight notebooks are sections, not notebooks: `02_transformer`
      is **7 cells** (positional encoding + a `TransformerBlock` class + a shape
      test on random data, no dataset and no training), and
      `03_Attention_gestures` is **15**, of which the actual content is "train a
      GRU, then train an AttentionGRU, look at the difference".
      `03_Attention_gestures` also never plots anything — its conclusion is
      cell 14, a markdown paragraph describing what the author saw in *their*
      tensorboard ("in my tensorboard, I see: loss is better in both train and
      test").
    consequence: >
      the claim a student is asked to accept is unverified on their own screen,
      and it is the lesson's headline claim about attention. Cheap fix: log both
      runs to the same MLflow experiment (D10) and read the comparison off it,
      which is what L2/03_mlflow already established as the house style.

  - id: C9
    date: 2026-08-01
    severity: this is the finding the new notebook gets built around
    supersedes: >
      the implicit arc of D18's first draft — "truncate, then mean, then
      *get serious* with a learned aggregator".
    finding: >
      Measured on a 600-train / 300-test SCOTUS subset, granite chunk
      embeddings, identical head (`NeuralNet(384 -> 13)`), 8 epochs, batch 32,
      Adam 1e-3, **three seeds**. Majority class is 0.223 of train / 0.250 of
      test, so everything below is well clear of guessing.

        config                  accuracy (min-max)      f1_macro (min-max)   params    s/run
        truncate: first chunk   0.546 (0.533-0.563)   0.343 (0.321-0.358)   152.845    1.4
        mean, C=4               0.582 (0.577-0.587)   0.376 (0.372-0.381)   152.845    1.4
        mean, C=16              0.584 (0.580-0.590)   0.417 (0.396-0.450)   152.845    1.4
        mean, C=32              0.596 (0.567-0.617)   0.396 (0.383-0.416)   152.845    1.6
        masked mean, C=16       0.580 (0.560-0.590)   0.394 (0.365-0.436)   152.845    1.6
        attention, C=16         0.589 (0.570-0.607)   0.393 (0.383-0.413)   153.230    1.4
        rnn, C=16               0.566 (0.553-0.577)   0.358 (0.346-0.375)  1.039.885    2.0

      Three results, in decreasing order of how solid they are:
      1. **Truncation is the one thing that clearly costs you.** First-chunk-only
         is worse than every multi-chunk configuration, on both metrics, on
         every seed, with no overlap in the spreads. Reading past the first 512
         tokens is worth ~4 accuracy points and ~5-7 macro-F1 points.
      2. **The curve flattens almost immediately.** C=4 already captures nearly
         all of it; C=16 and C=32 add little, and their seed spreads overlap.
         The median opinion is 15 chunks long, so this says most of the signal
         is in the first ~2.000 tokens — not in the first 512, and not in the
         other 90% either.
      3. **The learned aggregators do not beat the mean at this budget.**
         Attention ties it (0.589 vs 0.584, spreads overlapping) for 385 extra
         parameters; the RNN aggregator is *worse* for 7x the parameters.
    this_is_the_house_result_by_now: >
      the same shape as L2 (a frozen encoder + linear head beats the CNN it is
      compared with) and L3's C7 (a linear layer beats a GRU at forecasting).
      Three lessons, three modalities, one rule: **the expensive component has
      to earn its place, and often it does not.** Do not go hunting for a
      configuration where attention finally wins — teach the result, and put the
      burden of proof where it belongs.
    what_it_means_for_the_lesson: >
      the notebook's spine becomes "how much of the document do you need to
      read?" rather than "which aggregator is best". Rung 1 -> 2 is the lesson;
      rungs 3 and 4 are the honest anticlimax that makes it a lesson instead of
      a sales pitch. E1 becomes the required ablation and E2 becomes the
      cost-benefit argument, not a search for a winner.
    the_honest_caveat: >
      600 train documents is 12% of the split, 8 epochs, one encoder, no
      tuning, and the 300-document test subset happens to be longer than the
      train subset (mean 28.4 chunks vs 19.2). Every number will move when the
      full cache exists. The *ranking* is what this probe is for, and the only
      gap wide enough to survive is truncation-vs-not.

  - id: C8
    finding: >
      `07_metric.ipynb` is a **vision** notebook sitting in the attention
      lesson. It loads FASHION, post-processes the label into "is it a four"
      to manufacture a 90/10 imbalance, trains `imagemodels.CNN` for 100 steps
      and computes a confusion matrix, precision-recall and ROC on that.
      The metrics content (goal 5.1) is good and stays; the scaffolding around
      it is a second dataset, a second modality and a second model, all present
      only to produce an imbalanced binary problem.
    consequence: >
      if L5 moves to a corpus that is *already* imbalanced and multi-class, the
      metrics notebook runs on the lesson's own data and its 30 cells of
      scaffolding disappear. That is where most of the room for the new
      notebook comes from — see make_room.

  - id: C10
    date: 2026-08-01
    severity: the measurement 06_composition is built around, and it says "no"
    answers: >
      the owner's proposal (2026-08-01) to build notebooks that "more fully
      embrace the capabilities of vectormesh — MoE, or pretrained models that
      vectorize the texts combined with regex".
    what_was_built_to_test_it: >
      a US-legal `ChunkedRegexVectorizer` (vectormesh ships only the *Dutch*
      `build_legal_reference_pattern`, for the aktes example), matching
      citations (`347 U.S. 483` -> `cite:US`), statutes (`28 U.S.C. §1291` ->
      `cite:USC`), amendments, procedural posture (certiorari, remanded,
      dissent) and doctrine (due process, antitrust, equal protection). Fitted
      on 600 SCOTUS opinions at `min_doc_frequency=5`: **58 features**, median
      13 per document, **zero documents with no match**.
    the_alignment_contract_holds: >
      built with the embedding cache's own `(model_tag, context_size, stride)`,
      the regex matrix is chunk-for-chunk aligned: **0 chunk-count mismatches**
      over 900 documents, `offsets_supported: true`. And the metadata *does*
      record `stride` (51), so the docs' instruction to read it from the cache
      is correct — no course-side arithmetic needed.
    first_pass_looked_like_a_win: >
      comparing pipelines as written in vectormesh docs 5.2 and 5.5, 8 epochs,
      600/300 documents, three seeds:
        embed only, wide head    0.584 acc  0.417 f1   152.845 params
        regex only               0.357      0.082        4.189
        doc fusion (cat2D)       0.577      0.384      197.867
        chunk fusion (cat3D)     0.609      0.386       29.197
        chunk fusion + MoE       0.597      0.398       79.759
      Read naively: chunk-level fusion wins on accuracy with a fifth of the
      parameters. **That reading is wrong**, and it is wrong in the way
      students are wrong.
    the_ablation_that_killed_it: >
      those pipelines differ in *two* ways at once — the fusion, and a
      `Projection` bottleneck to 64 dims before aggregation. Running the
      identical bottleneck shape with and without the regex stream:
        A. bottleneck, embed only    0.624 (0.613-0.633)  f1 0.390   25.485
        B. bottleneck, embed+regex   0.609 (0.597-0.627)  f1 0.386   29.197
        C. + MoE, embed only         0.584 (0.557-0.610)  f1 0.390   76.047
        D. + MoE, embed+regex        0.597 (0.593-0.600)  f1 0.398   79.759
        E. wide head, embed only     0.584 (0.580-0.590)  f1 0.417  152.845
      **The regex stream contributes nothing** (A beats B). **The MoE
      contributes nothing** (A beats C; D beats B by less than a seed spread).
      What actually produced the apparent win was the bottleneck — a *smaller*
      model, 25k parameters against 152k.
    and_the_two_metrics_disagree: >
      the bottleneck has the best accuracy (0.624) and a mediocre macro-F1
      (0.390); the wide head has the worst accuracy (0.584) and the best
      macro-F1 (0.417). Compressing to 64 dimensions helps the common classes
      and costs the rare ones. With a 3-example class in the training set
      (datasets.SCOTUS.classes), "which architecture is better" is not a
      question the data answers — it is a question about who the system is for.
    what_it_means_for_the_lesson: >
      **build 06_composition anyway, and build it around this.** The skill is
      composing and then *ablating*, not collecting components that win. Three
      things it now teaches that a successful fusion could not:
        1. the methodology — a comparison table that looks conclusive, then the
           one-variable ablation that overturns it. This is the most common
           mistake in student projects and it is here, self-inflicted, with the
           numbers to prove it.
        2. the fourth consecutive "the expensive component did not earn its
           place" (after L2's CNN, L3's GRU, L5's own aggregators, D18).
        3. two metrics that rank the same models differently, which hands
           07_metrics its motivating example from the notebook before it.
    the_honest_caveat: >
      600 training documents, 8 epochs, one feature design. The regex stream is
      weak *as designed here*: four of its top features (`cite:US`, `cite:SCT`,
      `cite:LED`, `cite:LED2D`) appear in over 83% of documents and one appears
      in 100%, so they carry no discriminative signal at all, and the doctrine
      vocabulary that would carry it is only ~24 terms. "Design better features
      and beat the embedding" is therefore a *real* open exercise, not a
      rhetorical one — E7.

