runtime_budget:
  status: >
    MEASURED 2026-08-01 on an M-series mac (MPS), warm HF cache, from a
    scratch script — **not** from notebooks, which do not exist yet. See
    scotus_probe below for the protocol.
  imdb_chunking: see C2 — the measurements that motivate the swap.
  scotus_probe:
    protocol: >
      600 train / 300 test SCOTUS documents, shuffled seed 42, embedded with
      `Vectorizer(granite-embedding-small-english-r2, max_length=512)` on MPS,
      then a `NeuralNet(384 -> 13)` head for 8 epochs at batch 32, Adam 1e-3,
      over three seeds. Full table in C9.
    encoding:
      train: 600 documents (~11.500 chunks) in **146s**
      test: 300 documents (~8.500 chunks) in **104s**
      throughput: ~**80 chunks/s** on MPS, i.e. ~4 documents/s
      note: >
        this is 2.6x the rate implied by L1's IMDB run (16 min for ~29k chunks,
        ~30 chunks/s). Long documents batch better — the chunks are full rather
        than mostly padding. Do not reuse L1's rate to size this job.
    cache_size:
      measured: 17 MB for 600 train documents, 13 MB for 300 test documents
      note: the test subset is denser because those documents are longer (28.4
        chunks/doc vs 19.2) — chunk count, not document count, sets the size
    head_training: 1.4-2.0s per configuration for 8 epochs on 600 documents
    regex_stream: >
      the second cache is nearly free next to the first: fitting 58 patterns
      over 600 opinions plus writing the chunk-aligned matrix took **7s for
      train and 5s for test** (CPU), against 142s and 106s for the embeddings.
      Worth saying out loud in 06_composition — a designed representation costs
      minutes of *your* time and seconds of compute; a learned one is the other
      way round.
    fusion_pipelines: 2.7-3.6s per configuration, 8 epochs, 600 documents —
      the MoE variants are the slowest, ~30% over the plain pipeline
    whole_notebook_estimate: >
      once the cache is downloaded, 05_long_documents is a couple of minutes:
      seven configurations at full scale is roughly 8x the subset numbers, so
      2-3 minutes of training plus the download. Well inside laptop_feasible.
  publish_estimate:
    status: extrapolated from the measured 80 chunks/s, not yet run
    train: 5.000 docs x 18.3 chunks = ~91.600 chunks -> **~19 min** on MPS, ~140 MB
    validation: 1.400 docs -> ~25.600 chunks -> ~5 min, ~40 MB
    test: 1.400 docs -> ~25.600 chunks -> ~5 min, ~40 MB
    total: ~30 minutes and ~220 MB for the whole published artefact
    why_this_number_matters: >
      it is the first time in the course that the encoding is the expensive
      part rather than the `VectorCache.create` fingerprint overhead
      (lesson2.yml C2, a flat ~21s per call — here it is 2% of the job).
      Thirty minutes on one machine, once, and every student downloads 220 MB
      instead: that is `embed_once_reuse_many` at a scale where the argument
      is self-evident rather than illustrative.

