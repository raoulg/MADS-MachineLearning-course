  - name: SCOTUS
    id: coastalcph/lex_glue, config `scotus`
    role: proposed replacement — the lesson's text corpus (L5.Q1)
    licence: CC-BY-4.0 on the card; the underlying texts are US Supreme Court
      opinions, i.e. public domain. Satisfies R7 for republishing a cache,
      with attribution to LexGLUE recorded in the dataset card.
    verified_today:
      loading: parquet-native, 0 scripts in the repo, 21 parquet files — loads
        on datasets 5.0 with a plain `load_dataset(id, "scotus")`, no
        `data_files` gymnastics (contrast L3's Monash, C1 there)
      splits: train 5.000 / validation 1.400 / test 1.400
      columns: [text, label]
      classes: >
        13, single-label, and **imbalanced at both ends**: the top three are
        1.043 / 1.011 / 811 of 5.000, and the bottom two are class 5 with **35**
        training examples and class 12 with **3**.
        The long tail is not a footnote, it is a design constraint for
        06_metrics — a macro-F1 that averages over a 3-example class is mostly
        noise, and *that is the lesson*: goal 5.1 becomes "which averaging tells
        you the truth about a system, and who does the other one hide?".
        Concretely: report macro and micro side by side, and either fold the
        two rarest classes into "other" **with the reason stated out loud**, or
        keep them and show the per-class support column next to the per-class
        F1. Do not quietly quote a macro number over 13 classes when one of them
        has three examples. See L5.Q5.
      token_length: median 6.496, p90 16.554, p99 37.203, max 41.574 (granite
        tokenizer, 300-doc sample)
      chunking: >
        at max_length=512, stride=51: mean **18.3 chunks/document**, median 15,
        p90 36, and **96%** of documents have more than one chunk.
        Compare IMDB's 1.15 / 13% (C2). This is the whole reason for the swap.
        Confirmed on the embedded probe subset: mean 19.2, median 15, p90 39,
        **max 237** — the tail is long, so `max_chunks` is a real decision and
        `FixedPadding(16)` already truncates 44% of documents.
      it_learns: >
        the thing worth checking before committing a lesson to a dataset.
        A frozen-embedding head reaches **0.58 accuracy / 0.42 macro-F1** on 13
        classes from 600 training documents, against a 0.22-0.25 majority-class
        baseline (C9). Not a solved task — LexGLUE's fine-tuned baselines are
        far higher — which is right for a lesson: there is headroom for the
        exercises to move.
    why_it_fits_L5:
      - >
        **the chunk axis is real.** `(B, C, D)` with C=16 is a tensor with
        content in every slot, so "which aggregator" is a question about the
        document rather than about padding.
      - >
        **truncation has a measurable price.** A 512-token window sees ~8% of a
        median opinion. "What does the first chunk cost you?" is E1, and the
        answer is not obvious in advance — legal opinions front-load their
        summary, which is an argument *for* truncation that the data can settle.
      - >
        **it is already imbalanced and multi-class**, so 06_metrics runs on it
        without manufacturing anything (C8).
      - >
        it echoes vectormesh's own `aktes` legal example (masterplan meta) at
        the one point where the course could not use it — that cache cannot be
        distributed, this one can.
    costs:
      encoding: >
        ~91.600 chunks for the train split. Measured throughput and the
        resulting publish estimate are in runtime_budget — this is a one-time
        GPU job, and it is exactly the `embed_once_reuse_many` story the course
        tells, run for real by the person who has the hardware.
      cache_size: ~140 MB for train at 384 float32 dims (91.6k x 384 x 4 B),
        ~40 MB each for validation and test. Comparable to the 158 MB IMDB
        cache already on the hub.
      download: one `snapshot_download`, per conventions §3
    alternative_measured:
      id: coastalcph/lex_glue, config `ecthr_a`
      what_it_is: >
        European Court of Human Rights cases, 9.000/1.000/1.000, **multi-label**
        over 10 articles + "no violation". Measured today: `text` arrives as a
        **list of paragraphs** (median 16 per case, p90 45, max 201), median
        1.321 tokens per case, 5.1 chunks/doc at 512, 83% multi-chunk.
        Heavily imbalanced (label 3 appears 4.704 times in 9.000) and **914
        cases carry no label at all**.
      for: >
        the document arrives *pre-chunked* by its own author, which is the
        honest version of chunking — paragraphs are semantic units, a
        512-token sliding window is not. Multi-label also makes 06_metrics much
        richer (per-label precision/recall, thresholds, micro vs macro), and it
        would reuse `BCEWithLogitsLoss` from L1/05_losses.
      against: >
        multi-label changes the head, the loss and every metric in the lesson
        at once, and the 914 empty-label cases are a trap that needs its own
        cell. It is the more interesting dataset and the more expensive lesson.
      verdict: L5.Q1 — recommendation is `scotus`, but this is a real choice
        and the owner should make it.
    also_screened:
      - "ccdv/arxiv-classification — 11 classes, long papers, parquet-native,
