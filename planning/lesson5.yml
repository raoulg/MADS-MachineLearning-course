  - id: L5.Q6
    blocking: no — but it is the answer if L5 is judged too big
    question: >
      D23 leaves L5 at 8 notebooks and break-even on cells. Does
      `03_transformer` (7 cells, no dataset, no training) stay a notebook, or
      fold into `05_long_documents`, where the block it builds is used two
      cells later?
    recommendation: >
      fold it, if room is needed. Build-it-then-use-it in one notebook is a
      better beat than build-it-now-use-it-two-notebooks-later, and it costs
