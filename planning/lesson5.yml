      note: >
        it chunks by itself — `tokenize()` passes `return_overflowing_tokens`
        and reconstructs per-document chunks via `overflow_to_sample_mapping`.
        Worth reading in the notebook (it is 20 lines) because the whole lesson
        rests on what that function does, and because `stride =
        max_length // 10` is a design decision the student can change.
    - component: VectorCache + snapshot_download
      where: 05_long_documents, 06_metrics
      note: conventions §3 — download first, build in a marked optional branch.
    - component: Collate + FixedPadding / DynamicPadding
      where: 05_long_documents
      note: >
        this is where L3.Q2's homeless variable-length lesson lands. Chunk
        counts vary from 1 to 40+ *intrinsically*, so `FixedPadding(max_chunks)`
        is a truncation decision with a measurable cost and `DynamicPadding` is
        the alternative — padding taught on data where the raggedness is real.
    - component: aggregation (Mean / MaskedMean / Attention / RNN)
      where: 05_long_documents
      note: the four rungs of D18's ladder, one `Serial` slot.
    - component: TransformerBlock
      where: 03_transformer builds it, 05 runs it over (B, C, D)
      note: >
        the payoff for C7 — 03 currently tests its block on `torch.randn(32,
        64, 128)` and stops. Running the student's own block over chunk vectors
        costs one cell and turns a construction exercise into a component.
    - component: ChunkedRegexVectorizer
      where: 06_composition
      note: >
        the designed stream, chunk-aligned to the embedding by construction.
        Built with the embedding cache's own `(model_tag, context_size,
        stride)` — all three are in the metadata, verified today, including
        `stride`. Fed by the course's own `legal_patterns.py` (L5.4b), because
        the shipped legal builder is Dutch.
    - component: CollateParallel
      where: 06_composition
      note: >
        yields `((X1, X2), y)` instead of `(X, y)` — the one place in the
        course where a batch is a tuple of streams. Both padders must use the
        same `max_chunks` or `Concatenate3D` aligns garbage silently.
    - component: Parallel / Concatenate2D / Concatenate3D
      where: 06_composition
      note: >
        fusion at two altitudes: after aggregation (each stream reduced to
        `(B, D)` first) and before it (per chunk, `(B, C, D1+D2)`). The second
        is only meaningful because C is real here — on IMDB the two would be
        the same operation written twice.
    - component: Gate / Highway / MoE
      where: 06_composition
      note: >
        one family at increasing resolution — per-dimension scale, two-way
        interpolation, N-way learned mixture — swapped into one `Serial` slot.
        vectormesh docs 5.3/5.4 frame it exactly this way and the course has
        never taught any of it.
    - component: metrics.F1Score / Accuracy
      where: 05, 06, 07
      note: >
        L3.Q4 (mltrainer vs vectormesh metrics — two implementations, two
        dependencies) applies here too. L1/07 uses vectormesh's `F1Score`;
        07_metric uses sklearn. That is defensible — sklearn owns the confusion
        matrix and the curves — but it should be a stated convention, not an
        accident. C10 makes it sharper: accuracy and macro-F1 rank the same
        models differently here, so the *default* metric decides conclusions.
  what_this_closes: >
    before D23, L5 touched `Vectorizer`, `VectorCache`, `Collate`, padding and
    the aggregators — the same components L1 and L2 already use. With
    06_composition, L5 becomes the only lesson that exercises the *composition*
    half of the library: `Parallel`, the connectors, the gating family and
    `CollateParallel`. Those are 4 of the 8 component modules and nothing in
    the course reaches them today.
  shapes_taught:
    - "document -> Vectorizer -> (C, D), C = number of chunks, D = 384"
    - "Collate + FixedPadding -> (B, C, D)"
    - "aggregator -> (B, D)   <- the only rank-reducing step"
    - "NeuralNet -> (B, K), K = 13"
    - >
      and the one that matters most, straight out of conventions §6: the
      TransformerBlock built in 03 for `(B, tokens, D)` runs unchanged on
      `(B, chunks, D)`. Formally identical, semantically a different model.
      This is the best example of the formal/semantic split the course has.
    - >
      06_composition adds the two-stream shapes: `((B, C, 384), (B, C, 58))` ->
      `Concatenate3D` -> `(B, C, 442)` -> `Projection` -> `(B, C, 64)`, and the
      document-level route where each branch is aggregated to `(B, D)` first
      and joined by `Concatenate2D`. Same two tensors, two different places to
      merge them — which is the whole design question in one line.

