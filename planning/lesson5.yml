# -----------------------------------------------------------------------------
exercises:
  - id: E1
    type: ablation (the required one)
    title: What does truncation cost?
    detail: >
      Retrain the same head at `max_chunks` ∈ {1, 2, 4, 8, 16, 32}. Predict
      first, from the `chunk_sizes` histogram and from what you know about how
      a court opinion is organised: does the signal sit in the first chunk, or
      is it spread? Then plot F1 against max_chunks *and* against
      seconds/epoch. The interesting outcome is not "more is better" — it is
      where the curve flattens, because that number is the answer to "how much
      of the document do I actually need to read?".
    what_the_probe_found: >
      the step from 1 to 4 chunks carries almost all of it (accuracy 0.546 ->
      0.582); 16 and 32 add little and their seed spreads overlap (C9). So the
      expected answer is "more than one chunk, but nowhere near all of them",
      which is a more useful thing to learn than either "truncation is fine" or
      "always read everything".
    why_it_is_not_L1_E1: >
      L1's E1 (mean vs masked mean) is a question about padding, on data where
      86% of items have one chunk. This is a question about content, on data
      where the median item has 15.

  - id: E2
    type: designed vs learned (principle designed_vs_learned)
    title: Does a learned aggregator find what a mean misses?
    detail: >
      Swap `MeanAggregator` -> `AttentionAggregator` -> `RNNAggregator` in the
      one `Serial` slot. Report score, parameters and seconds/epoch for each.
      The honest question to answer in writing: if attention wins by a point at
      ten times the cost, would you ship it? This is the L1 regex-vs-embedding
      table and the L3 linear-vs-GRU table, in the third modality.
    what_the_probe_found: >
      it does not (C9): attention ties the mean within seed noise and the RNN
      aggregator loses with 7x the parameters. Frame the exercise as
      "measure, then decide" and let the student find the tie — with the
      follow-up that matters: **under what conditions would you expect
      attention to win?** (a document where one chunk decides the label and the
      rest is boilerplate — which is a hypothesis they can test on the tail of
      the length distribution).

  - id: E3
    type: interpretation
    title: Where in the document is the signal?
    detail: >
      Pull the attention weights out of the trained `AttentionAggregator` and
      plot them against chunk index, averaged over the test set — the same
      seaborn heatmap 02_reweighing draws on an *untrained* model, now trained
      and over documents instead of words. Cell 38 of the current
      01_reweighing promises exactly this and never delivers it (C7); this is
      where the promise is paid.
    caveat: >
      the aggregator this reads weights from does not beat a plain mean (C9),
      and that makes the exercise *better*, not worse: a model that performs
      like an average is a model whose attention is probably close to uniform.
      Ask the student to check that before interpreting anything — reading
      attention weights as an explanation when the model is not using them is
      one of the more common mistakes in the field.

  - id: E4
    type: shape contract (inherited from L3.Q2)
    title: Fixed or dynamic padding?
    detail: >
      Replace `FixedPadding(max_chunks=16)` with `DynamicPadding()` and watch
      the batch shape change between batches. Which documents are affected, how
      much padding does each strategy waste, and what does `max_chunks` throw
      away? This is the variable-length lesson L3 can no longer teach honestly
      (its replacement datasets are all fixed-length), landing where the
      raggedness is intrinsic rather than an artefact of segmentation.

  - id: E5
    type: carried over
    title: the EEG exercise (07_exercise)
    detail: >
      keep the windowed / padded / batched ladder — it is a good exercise and
      it now points at L3/01_windowing for the mechanics. The third bullet
      becomes "write a `BaseVectorizer` for this signal and cache it", which is
      also the smallest possible rehearsal of the phase_5 capstone (P5.3).

  - id: E6
    where: 06_composition.ipynb
    type: routing / conditional computation
    title: Does the router actually specialise?
    detail: >
      Train the `MoE` and then *look at it*: plot the router's softmax weights
      per document, grouped by issue area. Does expert 0 own criminal
      procedure and expert 1 economic activity, or is every document a near
      uniform blend? Then the parameter-matched question that settles whether
      the structure earned anything: **2 experts of width 64 against 1 expert
      of width 128** — same budget, different shape.
    inherited_from: >
      vectormesh docs 5.4 and its notebook 3 ask exactly these; the course can
      finally set them, because SCOTUS is distributable and `aktes` is not.
    expected: >
      measured at this budget, the MoE does not beat the plain pipeline (C10),
      so a collapsed-to-uniform router is the likely finding — which is the
      *answer*, not a failed exercise. A student who can say "the router did
      not differentiate, so this is an expensive ensemble average" has learned
      the thing.

  - id: E7
    where: 06_composition.ipynb
    type: designed vs learned (principle designed_vs_learned)
    title: Beat the embedding with features you wrote yourself
    detail: >
      The shipped `legal_patterns.py` loses to the embedding (C10), and its
      weakness is diagnosable: four of its top features appear in over 83% of
      documents, and its doctrine vocabulary is ~24 terms. Raise
      `min_doc_frequency`, drop the universal citations, add the vocabulary of
      an issue area you care about — and see how close a *readable* 58-dimension
      representation can get to 384 opaque ones.
      Report both the score and what you can say about the model afterwards:
      the regex model can be *read*, and that is a property no accuracy column
      shows.
    why_it_is_a_real_exercise: >
      it is open. The plan does not know the answer, and says so — the measured
      baseline is 0.357 accuracy against the embedding's 0.584, on features
      designed in one afternoon by someone who is not a lawyer.

