    question: Which corpus replaces IMDB — `scotus` or `ecthr_a`?
    recommendation: >
      **scotus.** Single-label 13-class keeps the head, the loss and the
      metrics unchanged from the rest of the course, and 18.3 chunks/document
      is the strongest chunk axis measured. `ecthr_a` is the more interesting
      dataset — paragraphs are *authored* chunks rather than sliding windows,
      and multi-label would make 06_metrics genuinely rich — but it changes the
      head, the loss and every metric at once, and its 914 unlabelled cases
      need their own cell.
    measurements: see datasets.SCOTUS and datasets.SCOTUS.alternative_measured

  - id: L5.Q2
    blocking: no
    question: >
      Does 06_metrics really leave Fashion-MNIST behind, or is a vision example
      worth keeping in the metrics notebook for contrast?
    recommendation: >
      leave it. The metrics content is modality-independent, the confusion
      matrix reads better with 13 real classes than with a manufactured binary,
      and it removes a mads_datasets site by deletion. If a second modality is
      wanted, L2's flowers head is one cache away and costs nothing.

  - id: L5.Q3
    blocking: L5.3
    question: >
      What `max_length` does the published cache use? 512 gives 18.3
      chunks/document; 256 would roughly double that (finer chunks, more to
      aggregate, twice the storage and twice the encoding time).
    recommendation: >
      512 — it is the encoder's own window, it keeps the cache at ~140 MB, and
      "the chunk is as big as the model can read" is one less arbitrary number
      to explain. Revisit only if E1's curve turns out to be flat, which would
      mean the chunks are too coarse to differentiate.

