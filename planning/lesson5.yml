  - id: L5.Q7
    blocking: L5.4c, mildly
    question: >
      Does 06_composition publish its regex cache to the hub alongside the
      embedding one, or build it in the notebook?
    recommendation: >
      **build it in the notebook.** Measured at 7s for 600 documents (CPU), so
      even the full 5.000-document split is well under a minute — this is the
      one vectorizer in the course cheap enough to run live. That is itself the
      lesson: you publish what is expensive, you rebuild what is cheap, and the
      student now has one example of each in the same notebook.
    caveat: >
      it does mean the notebook depends on `legal_patterns.py` being importable
      and on the embedding cache's metadata being readable — which is the
      alignment contract, i.e. the thing the notebook is about anyway.
