  status: draft — awaiting approval
  created: 2026-07-30
  phase: 1
  goal: >
    L1 runs with no mads_datasets, teaches the tensor ladder as shared
    notation, and ends with one vector-level notebook where the student trains
    a head on a downloaded cache. The hand-rolled dense-net story stays exactly
    where it is.

