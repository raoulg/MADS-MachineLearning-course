exercises:
  keep:
    - 06_exercises: the hypertuning-by-hand exercise on fashion (goals 1.13-1.15)
  add:
    - id: E1
      where: 06_vectors.ipynb
      task: >
        Ablate the aggregator: MeanAggregator vs MaskedMeanAggregator on the
        chunked granite cache, with FixedPadding(max_chunks=2). Predict which
        wins *before* running, then explain the result from the padding.
      why: >
        first ablation of the course, and the answer is derivable from theory
        (zero-padding drags a plain mean toward the origin), so it teaches that
        ablations can be reasoned about, not only measured.
    - id: E2
      where: 06_vectors.ipynb
      task: >
        Shrink the training set to 200 rows and re-run both representations.
        Does the 43-dim hand-written vector close the gap on the 384-dim
        embedding? Where would you expect the crossover?
      why: >
        directly plants the designed-vs-learned question (goal 1.17) that the
        rest of the course keeps returning to, and it is cheap to run.
    - id: E3
      where: 06_vectors.ipynb
      task: >
        Read the metadata.json of a cache you did not build and state, before
        running any code, what shape a batch from its DataLoader will have and
        which components you will need between it and the loss.
      why: goal 1.18, and it is a candidate exam question (masterplan P6.3).

