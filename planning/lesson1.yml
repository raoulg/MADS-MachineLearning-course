corrections:

  - id: C1
    supersedes: masterplan dataset_migration.drop_in_available.FLOWERS
    status: resolved by masterplan D4
    finding: >
      The course's FLOWERS is **not** Oxford Flowers 102. mads_datasets pulls
      `flower_photos.tgz` from storage.googleapis.com — the TensorFlow
      5-class set (daisy, dandelion, roses, sunflowers, tulips). So
      `nkirschi/oxford-flowers` (102 classes) is a different, harder dataset,
      not a drop-in id swap.
    resolution: >
      SUPERSEDED BY D8, twice over. First draft kept flower_photos.tgz so the
      directory walker would keep working; second draft had the notebook write
      a folder tree so the walker would have something to walk. Both were
      staging a scenario to keep outdated code alive.

      D8, final: **no folder structure at all.** The hub standardised on
      parquet-backed, memory-mapped datasets (verified: dog-food,
      rock-paper-scissors, EuroSAT, oxford-flowers, cats_vs_dogs, Cat_and_Dog
      are all parquet with zero loose image files; frgfm/imagenette is a script
      pointing at the original fast.ai tgz). The course follows practice. Use a
      plain HF dataset, cut the walker, and teach the iterator mechanics that
      are still true.

  - id: C2
    supersedes: itself — the earlier "keep the from-scratch build" reading
    status: REVISED under D8
    finding: >
      03_dataloader builds a whole stack against a directory of image files:
      `walk_dir`, `iter_valid_paths`, `load_image`, `BaseDataset`,
      `batch_processor`, then `BaseDatastreamer` as the library version. I
      argued for preserving that because `load_dataset` "deletes the premise"
      that images do not fit in RAM.
    why_that_was_wrong: >
      the premise is not deleted, it is *answered*. Arrow memory-maps the file,
      so the data is not in RAM whether or not you write an iterator — that is
      a better version of the same lesson, and it is what actually happens now.
      Preserving the walker would have meant teaching a solution to a problem
      the tooling already solved, which fails the north_star principle.
    consequence: >
      Cut the image-folder machinery (roughly cells 3-38). Rebuild the notebook
      around a simple HF dataset and the iterator mechanics that still matter:
      `yield`, a shuffled index list, and the pointer that walks it and wraps —
      the pattern 02_datagenerators already builds. Then show DataLoader as
      that, with workers. It becomes an iterator lesson, which is what it
      always really was.

  - id: C3
    supersedes: masterplan P1.1 ("split the mid-refactor 05_classfication")
    finding: >
      There is nothing to extract. `05_image_classfication.ipynb` (70 cells)
      already contains the complete hand-rolled fashion-MNIST story: dataset →
      DataLoader → dense net → optimizer → trainer → save/load → predict.
      `05_classfication.ipynb` was evidently a copy of it that got rewritten
      into the IMDB/vectormesh notebook; its FASHION import was the leftover,
      and it is already gone.
    consequence: >
      P1.1 is a **renumber plus a cleanup**, not a split. The vector-level
      notebook already exists; it needs a name, a cache-download path, and
      about a third of its cells tightened. See task L1.5.

