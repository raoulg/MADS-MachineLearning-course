# Surfaced while reading L1, but neither is an L1 notebook task.
# -----------------------------------------------------------------------------
spun_out:
  - id: P0.6
    title: mltrainer rebuilds its dataloader iterator every step
    where: masterplan phases.phase_0.P0.6
    why_it_matters_for_L1: >
      L1 is where the course switches to DataLoaders, so it is where this starts
      biting. `evalbatches` re-`iter`s a shuffle=False loader per step, i.e. it
      validates on the first batch `valid_steps` times. Any F1 or accuracy
      printed by a DataLoader-based notebook — including the current
      05_classfication run — describes one batch. Fix before measuring anything
      in L1.7.
  - id: B1
    title: tomlserializer records arguments, not component class names
    where: masterplan backlog.B1
    priority: lowest — nice to have, nothing depends on it
    note: >
      the unused import is already out of 05_classfication. Whether the package
      survives at all is not an L1 question and should not hold up phase_1.
