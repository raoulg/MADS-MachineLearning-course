# -----------------------------------------------------------------------------
# The work, in dependency order.
# -----------------------------------------------------------------------------
tasks:

  - id: L1.1
    title: Introduce the tensor ladder in 01_tensors.ipynb
    effort: S
    detail: >
      after §1.7 (broadcasting), add a short section that names the four rungs
      and points at references/tensor-ladder.md (masterplan P0.2). One
      deliberate shape error to read: call a Linear on a (B, C, D) tensor when
      (B, D) was meant, show that pytorch accepts it silently, then show the
      jaxtyping/beartype version rejecting it. That contrast is the point —
      pytorch's silence is why the contracts exist.
    depends_on: [P0.2]
    goals: [1.1, 1.16]

  - id: L1.2
    title: Rebuild 03_dataloader as an iterator lesson on an HF dataset
    effort: M
    detail: >
      This absorbs the old L1.2 and L1.3 — with the walker cut, they are one
      job. Replaces the notebook's spine; see new_shape.
    cut:
      - cells 6-8   flowersfactory, download_data, subfolder
      - cells 10-12 walk_dir and its generator demo
      - cells 13-15 PIL open/show
      - cells 16-20 iter_valid_paths, FileTypes, class_names
      - cells 21-28 load_image, resize, %timeit, imshow
      - cells 32-38 MyDataSet / BaseDataset over a path list, factory wrap-up
    keep:
      - cells 0-1  the framing, and the pointer back to 02_datagenerators
      - >
        cells 3-5  the RAM arithmetic — it is pure numpy size calculation with
        no data, and it sets up the better modern answer
      - cells 44-47 batch_processor -> this *is* a collate_fn
    new_shape:
      - "load_dataset(...) — one cell, same as every other notebook"
      - >
        the RAM question, answered honestly: Arrow memory-maps the file, so the
        dataset is not in RAM and never was. Show it — `len()` on a dataset far
        bigger than memory, then read one row.
      - >
        now build an iterator over it by hand, which is still worth knowing:
        `yield`, `torch.randperm` for the shuffled index list, and the pointer
        that walks the index and wraps at the end (the double-index pattern
        from 02_datagenerators, now over real data instead of `torch.rand`).
      - "batch_processor, kept — and named as what it is: a collate_fn"
      - >
        then DataLoader: the same thing with workers, plus the D7 defaults.
        And `streaming=True` for the case where the data really is remote and
        unbounded — goal 1.5, current implementation.
    touches: notebooks/1_pytorch_intro/03_dataloader.ipynb
    killlist_rows: 4 (cells 2, 7, 17, 48)
    goals: [1.5, 1.12]
    depends_on: [P0.6]
    note: >
      this is a large cut — roughly 30 of 52 cells. It is the make_room payment
      for everything L1 gains, and it is the single clearest instance of the
      north_star principle applied to the course's own material.
    touches: notebooks/1_pytorch_intro/03_dataloader.ipynb
    killlist_rows: 3 (cells 2, 7, 17)

  - id: L1.3
    title: Check 02_datagenerators still earns its place
    effort: S
    detail: >
      With 03_dataloader rebuilt around the same generator pattern
      (`yield`, shuffled index, wrapping pointer) on real data,
      02_datagenerators may now be redundant — it teaches exactly that, on
      `torch.rand`. Two options: fold it into 03 as the warm-up section it
      already is, or keep it as the synthetic-first version and have 03 cite it
      instead of repeating it.
    recommendation: >
      keep it, and make 03 explicitly the sequel — "same pattern, real data".
      The synthetic version is where the fibonacci/infinite-generator intuition
      lands without any dataset noise. But say the connection out loud; right
      now cell 1 of 03 mentions it in passing.
    warning: >
      any %timeit comparison in this notebook or 05_image_classfication is not
      measuring what it looks like until P0.6 lands. mltrainer calls
      `next(iter(loader))` per step, so a DataLoader gets a fresh iterator (and
      with num_workers>0, a fresh worker pool) every batch. Do not publish a
      loader timing number before the fix.

  - id: L1.4
    title: fashion_mnist from the hub in 05_image_classfication
    effort: S
    detail: >
      cell 2 → `load_dataset("zalando-datasets/fashion_mnist")`; add an
      explicit PIL→tensor + normalise step (see datasets.gotcha). Cell 19's
      streamer comparison ("check out which one is faster") becomes DataLoader
      vs HF streaming, so the %timeit cells 17 and 21 keep their point. Drop
      the unused TOMLSerializer import from cell 2 (mltrainer imports it
      itself when ReportTypes.TOML is set).
    touches: notebooks/1_pytorch_intro/05_image_classfication.ipynb
    killlist_rows: 2 (cells 2, 19)

  - id: L1.5
    title: 05_classfication.ipynb → 06_vectors.ipynb, cleaned up
    effort: M
    detail: >
      Renumber (see naming below) and tighten. Per C3 there is no split to do;
      the notebook already tells one coherent story — the same 25k reviews
      represented two ways. Make that story explicit and cut the noise.
    changes:
      - >
        open with the metadata, not the model: load the published cache with
        snapshot_download (masterplan P0.3) and read `traincache.metadata`
        before any pipeline is built. Building the cache from scratch moves
        into a clearly-marked optional branch, so a student without a GPU is
        never blocked.
      - >
        fix the cache-loading cell (currently cell 24):
        `next(artefacts.glob(...))` raises StopIteration on an empty glob,
        which the `except VectorMeshError` does not catch — so the
        CREATED=False fallback never fires for anyone who has no cache, i.e.
        every student on first run.
      - >
        deduplicate: `from pathlib import Path` is imported in cells 2, 9 and
        19; `sample = traincache.select(range(100))` + iter loop appears twice
        (cells 11 and 13); `traincache.metadata` is printed twice.
      - >
        name the rungs at each step — (43,) vs (C, 384), why one needs a padder
        and an aggregator and the other does not. This is the notebook that
        earns goals 1.16-1.18.
      - >
        end on the comparison, not on `trainer.loop()`: 43 hand-written binary
        features vs a 384-dim pretrained embedding on the same task. State the
        parameter counts and the wall-clock of each *and* of the one-time
        embedding pass.
    touches: notebooks/1_pytorch_intro/05_classfication.ipynb
    depends_on: [P0.3]
    goals: [1.16, 1.17, 1.18]

  - id: L1.6
    title: Fix the dependency advice in 06_exercises
    effort: S
    detail: >
      cell 1's import swaps out mechanically, but the markdown in cell 0 is the
      place where students are told what to depend on in their own repos. It
      currently says `mads_datasets` + `mltrainer`. It should say `datasets`,
      `vectormesh` and `mltrainer`, and the "study this package's source" hint
      should point at vectormesh's BaseVectorizer/VectorCache — shape
      contracts and an artefact format are a better read than a factory
      pattern, and it is code we still ship.
    touches: notebooks/1_pytorch_intro/06_exercises.ipynb
    killlist_rows: 2 (cells 0, 1)

  - id: L1.7
    title: Run everything, then tick the kill list
    effort: S
    detail: >
      notebooktester is already a dev dependency. Per masterplan D2 a swap only
      counts once the notebook has been executed top to bottom and the output
      inspected — record measured runtimes here (see runtime_budget).
    depends_on: [L1.1, L1.2, L1.3, L1.4, L1.5, L1.6]

