# Lesson 2 (notebooks/2_convolutions) — refactor plan
#
# Parent: planning/masterplan.yml (phase_1 P1.2, phase_2 P2.4, decisions D8/D9)
# Kill list rows: planning/mads_datasets_killlist.md § "Lesson 2"
#
# This plan implements D9: transfer learning moves UP into L2, and L2 becomes
# the lesson about representations. It therefore also *removes* material from
# L4, which lesson4.yml must pick up.
# =============================================================================

meta:
  lesson: L2
  dir: notebooks/2_convolutions
  status: >
    IMPLEMENTED and VERIFIED 2026-07-31. All three notebooks run top to bottom
    against the *published* vectormesh 0.4.0 + mltrainer 0.3.4 — no editable
    installs, no PYTHONPATH shims. L2.1 (losses -> L1) is now DONE, which
    triggered the renumber both lessons were waiting on. The one remaining
    carve-out is L2.5: L2 only *adds* the frozen-encoder story, it has not yet
    *removed* anything from L4. See corrections C1-C10 and runtime_budget.
  created: 2026-07-30
  updated: 2026-07-31
  phase: 1 (dataset swap) + 2 (the frozen-encoder notebook)
  goal: >
    L2 answers one question: **where does a good representation of an image
    come from?** Three answers in order — you design it (convolutions, by
    hand), you learn it (train the CNN), or you take one that already exists
    (a frozen pretrained encoder). The third is the north star of the course,
    and it lands hardest here because the student has just built the first two.

# -----------------------------------------------------------------------------
# Corrections found while building L2. Per the working agreement in
# planning/README.md, the notebook wins and the plan gets updated.
# -----------------------------------------------------------------------------
corrections:

  - id: C1
    supersedes: 'depends_on.vectormesh_version: ">=0.2.0 ... no new library features needed"'
    finding: >
      Wrong, and it blocks L2 the same way mltrainer 0.3.2 blocks L1. The
      **published** vectormesh is 0.2.0 and exports only BaseVectorizer,
      LabelEncoder, RegexVectorizer, VectorCache, Vectorizer. `ImageVectorizer`,
      `DatasetSchema` and `GaussianNoise` exist only in the *working tree* at
      /Users/rgrouls/code/courses/vectormesh, which is version 0.3.0 and
      unpublished. The plan read the working tree and assumed it was the release.
    consequence: >
      02_pretrained.ipynb could not run for a student until the library shipped.
      Verified initially with `PYTHONPATH=../vectormesh/src`, deliberately *not*
      by installing it editable into the shared venv, because another thread was
      running L1 notebooks in that same venv at the time.
    resolved: >
      2026-07-31 — vectormesh **0.4.0** published (the version that carries
      ImageVectorizer is 0.4.0, not the 0.3.0 the working tree was numbered).
      pyproject now pins `vectormesh>=0.4.0`, and both notebooks were re-run
      against the real resolved environment with no shims.
    lesson: >
      "the library already has it" needs checking against the installed
      distribution, not against a sibling checkout.

  - id: C2
    finding: >
      `VectorCache.create` carries a **fixed ~21 second overhead per call**,
      independent of dataset size. `_vectorize` passes `datasets.map` a lambda
      that closes over the vectorizer, so `datasets` pickle-hashes the entire
      torch model to compute a cache fingerprint.
    measured: >
      mobilenet_v2 over fashion_mnist, batch 32, M-series:
        n=250  21.5s (12 img/s) | n=500  21.2s (24 img/s)
        n=1000 21.7s (46 img/s) | n=2000 22.7s (88 img/s)
      i.e. flat. With `new_fingerprint=...` passed through to bypass the hashing:
        n=500 0.5s (940 img/s) | n=2000 2.1s (945 img/s)
      So the true encoder rate is ~940 img/s on small greyscale and ~250 img/s
      on full-size photographs; the 21s is pure hashing.
    consequence: >
      it made the first sizing pass look 40x more expensive than reality and
      would have produced a misleading cost table in the notebook. Fix is a few
      lines in vectormesh (`_vectorize` should pass a deterministic
      `new_fingerprint` built from model_name + column + kwargs). Not done here
      — separate repo, and a wrong fingerprint silently serves stale caches, so
      it wants its own change with a regression test.
    workaround_in_the_notebook: >
      02_pretrained measures and reports the *rate* separately from the cache
      wall-clock, and extrapolates from the rate. That is better teaching anyway.

  - id: C3
    finding: >
      `.map()` over a dataset that still holds an image column rewrites every
      image to disk. Applying `OneHot` before caching (as vectormesh's own
      4_image_vectorizer notebook does) hung for >12 minutes on 4000 flower
      photographs and never reached the encoder.
    resolution: >
      Follow the L1 pattern instead: build the cache first with
      `remove_columns=[input_col]`, then `cache.map(onehot)` on the result,
      where a row is a vector and an int. The pixel path computes its one-hot
      in the `collate_fn` instead of on disk. Cheap operations on small data.

  - id: C4
    supersedes: datasets.nkirschi/oxford-flowers ("102 classes, harder")
    finding: >
      True but incomplete in two ways that bite. The split is **7169 train /
      1020 test** (not the canonical 1020/1020/6149), and the train split is
      **sorted by label**. `select(range(4000))` without a preceding
      `.shuffle()` silently yields ~57 of the 102 classes.
    consequence: the shuffle is now in the notebook and called out in the text.

  - id: C5
    supersedes: proposed_arc.notebooks
    finding: >
      Built first in an interim numbering, because 01_losses had not yet left for
      L1 (L2.Q3 was open and L1 was being edited by another thread). Once Q3 was
      answered on 2026-07-31 the planned arc was reached exactly, by shifting
      everything down one.
    final_arc:
      - "01_convolutions.ipynb — was 02_convolutions; dataset swapped (L2.2)"
      - "02_pretrained.ipynb   — NEW (L2.3)"
      - "03_mlflow.ipynb       — was the old 03_mlflow, rewritten (L2.4)"
      - "03_mlflow.py          — script variant, migrated off mads_datasets"
      - "04_exercises.md       — renamed only"
      - "cnn.py                — the CNN from 01_convolutions, imported by 02+03"
    l1_arc_after_the_move:
      - "05_losses.ipynb       — moved in from L2, placed before classification"
      - "06_classification.ipynb / 07_vectors.ipynb / 08_extra_autograd.ipynb / 09_exercises.ipynb"
    note: >
      ordering was always the binding constraint, not the numbers: 02_pretrained
      has to come before the tracking notebook, because the tracking notebook's
      whole point is tracking *that* comparison. Putting losses at 05 (before
      classification rather than after) also repays the "just take my word for
      it that CrossEntropyLoss is a good pick" line in two notebooks.

  - id: C6
    supersedes: L2.2 ("DataLoader with the D7 defaults, num_workers=2,
      persistent_workers=True")
    finding: >
      That contradicts conventions.md §4, which is later and more specific:
      **num_workers=0 in notebooks**, and num_workers=2 + persistent_workers
      only in scripts. The measured spread is 0.13 ms/batch, and workers compete
      with training compute on a 4-core student VM.
    resolution: >
      notebooks use num_workers=0; `03_mlflow.py` uses 2 + persistent_workers
      and carries the `if __name__ == "__main__"` spawn-guard comment, which is
      exactly the split conventions.md asks for.

  - id: C9
    finding: >
      `03_mlflow` cannot make its point on fashion. Measured: on 28x28 greyscale
      the CNN and the head cost **3.0s per trial each** — there is no crossover
      to find, because training a small CNN on tiny images is already cheap. The
      first build of the notebook printed "no crossover" as its headline result.
    resolution: >
      03_mlflow runs on **flowers**, where the CNN is ~27x slower per run than
      the head, and the crossover is a real, small number. The notebook says why
      it switched, which is itself the lesson: *the economics only exist where
      the compute exists*, and demonstrating a trade-off on data where it does
      not apply teaches the opposite of what you intended.
    knock_on: >
      03_mlflow now also depends on the *flowers* cache from 02_pretrained
      rather than the fashion one. Same `get_cache` fallback, so it rebuilds if
      03 was skipped.

  - id: C10
    finding: >
      02_pretrained and 03_mlflow both need the from-scratch CNN, and pasting it
      into both would guarantee they drift apart the first time either is edited
      — silently, since both would still run and both would still produce a
      comparison.
    resolution: >
      one definition in `notebooks/2_convolutions/cnn.py`, imported by both.
      02_pretrained displays the source with `CNN??` so the model is still
      visible where it is being explained. The module docstring says why it
      exists, which makes "do not copy a model between notebooks" a thing the
      lesson demonstrates rather than asserts.

  - id: C8
    finding: >
      `CNNblocks` only builds with `kernel_size=3`. `ConvBlock` hardcodes
      `padding=1`, which preserves the map size for kernel 3 and nothing else,
      while `CNNblocks` computes its flatten size from the pooling alone:
      `matrix_size = (H // pool**num_maxpools) * (W // pool**num_maxpools)`.
      Verified over a grid at 28x28: every `kernel_size=3` combination builds,
      every `kernel_size=5` one fails with a shape error or an exhausted map.
    the_worse_half: >
      the **old** `03_mlflow.ipynb` declared `kernel_size` and `num_layers` in
      its hyperopt `search_space` — and its objective then hardcoded
      `kernel_size=3, num_layers=4` and ignored both sampled values. So the
      search reported three dimensions and explored one. That is a nastier bug
      than a crash, because nothing fails: you get a plausible-looking study
      whose search space is fiction.
    resolution: >
      `03_mlflow.ipynb` searches only over parameters that build (`hidden`,
      `num_layers`), passes every sampled value through to the model, and the
      markdown teaches the trap explicitly — a search space is part of the
      model's contract.

  - id: C7
    finding: >
      `mltrainer.imagemodels.CNNblocks` trains very poorly on a 102-class task:
      it sat at exactly chance (0.0098) for 10 epochs on flowers with the loss
      frozen at ~4.47, at both hidden=32 (134k params) and hidden=128 (5.5M).
      An overfit diagnostic confirmed it: on **128 images over 30 epochs** it
      only got train loss 4.63 -> 4.05, i.e. it cannot memorise a tiny set.
      `mltrainer.imagemodels.CNN` is no use either — its `nn.Linear(128, 64)` is
      hardcoded for 28x28 input.
    resolution: >
      02_pretrained defines the CNN from 01_convolutions inline instead. Same
      probe: 4.61 -> 2.97, i.e. it actually learns. It is also the better
      pedagogical choice (D9: the point is that the student built the thing
      being compared against), and its `_conv_test`/`AvgPool2d` trick is what
      lets one class take both 28x28x1 and 64x64x3 unchanged — a debt collected
      from the previous notebook.
    spun_out: >
      whether CNNblocks is worth keeping in mltrainer at all is a separate
      question. It is still used by 03_mlflow's search, where it is fine (10
      easy classes at 28x28), but "our own library ships a model that cannot
      overfit 128 images" deserves a look before L4 leans on it.

# -----------------------------------------------------------------------------
# The proposed shape. See restructure_rationale for why.
# -----------------------------------------------------------------------------
proposed_arc:
  notebooks:
    - "01_convolutions.ipynb   — what a convolution is; build a CNN by hand"
    - "02_pretrained.ipynb     — the same task with a frozen encoder + cached vectors  [NEW]"
    - "03_mlflow.ipynb         — track the comparison; search a little"
  moved_out:
    - "01_losses.ipynb -> lesson 1 (see restructure_rationale.losses)"
  moved_in:
    - "the frozen-features half of L4/03 + L4/04 (D9)"

restructure_rationale:

  losses: >
    `01_losses.ipynb` should move to L1. This is not a new opinion — it fixes an
    existing inconsistency: `references/leerdoelen/les1.md` already maps goal
    1.9 ("what is a loss function?") to `2_convolutions/01_losses.ipynb`. The
    notebook is being taught against lesson 1's goals from lesson 2's folder.
    It is also entirely self-contained: 40 cells of pure tensor arithmetic
    (MSE, NLL, CrossEntropy, BCE, BCEWithLogits) with no dataset at all, so it
    moves without touching a single line. Moving it pays for what L2 gains
    under make_room.

  transfer_learning_moves_up: >
    D9. The strongest argument is ordering: `01_convolutions` ends with the
    student having hand-built a CNN and trained it on fashion. That is the
    single best moment in the whole course to show a frozen ResNet doing better
    in a fraction of the time, because the contrast is *theirs* — they built the
    thing being compared against. Putting that lesson two modules later, in L4,
    wastes the setup.

  what_L4_loses: >
    L4/03_minimal_transfer_learning and L4/04_transfer_learning_with_resnet.
    Note these already overlap heavily — L4/03 teaches *both* modes in one
    notebook (cells 20-21 fine-tune every parameter; cells 25-27 freeze all and
    train only `fc`), and L4/04 is the frozen case again on flowers, with a
    hand-written `AugmentPreprocessor`. Roughly 74 cells with one idea between
    them. L2 takes the frozen-features half; the fine-tune-vs-frozen *cost*
    comparison stays in L4, where it becomes a budget question. lesson4.yml
    must confirm this before L2 is executed.

# -----------------------------------------------------------------------------
current_state:
  - notebook: 01_losses.ipynb
    cells: 40
    content: >
      regression losses from first principles (residual -> abs -> squared ->
      MSELoss), then classification (softmax, log-softmax, NLLLoss, the
      hand-written loop that reproduces it, CrossEntropyLoss), then multilabel
      (sigmoid, BCELoss, hand-written, BCEWithLogitsLoss)
    mads_datasets: none
    data: none — synthetic tensors throughout
    change: move to L1 unchanged

  - notebook: 01_convolutions.ipynb
    cells: 38
    content: >
      FASHION streamers (2-5); Conv2d with padding/stride variations and their
      output shapes (8-13); nn.Sequential stack (15); the deliberate
      too-small-input RuntimeError (17); Flatten and AvgPool2d (19-21); a
      configurable CNN class + torchinfo summary at two input sizes (24-26);
      Trainer + 3 epochs (28-36)
    mads_datasets: cell 2 (FASHION factory + streamers; FLOWERS commented out)
    change: dataset swap; keep everything else. This is the hand-rolled half of
