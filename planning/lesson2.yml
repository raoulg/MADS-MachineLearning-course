# -----------------------------------------------------------------------------
datasets:
  - old: mads_datasets FASHION
    new: zalando-datasets/fashion_mnist
    used_in: [01_convolutions.ipynb, 03_mlflow.ipynb]
    verified: parquet-native, passes the selection_checklist
    gotcha: >
      the hub gives PIL images; the notebooks assume `(B, 1, 28, 28)` float
      tensors. The transform is explicit now — which is *useful* here, because
      cell 26's `summary(model, input_size=(32, 1, 28, 28))` and cell 25's
      `(32, 3, 224, 224)` are already teaching students to reason about input
      shape.
  - new: nkirschi/oxford-flowers
    used_in: [02_pretrained.ipynb]
    verified: parquet-native; already proven in vectormesh's image notebook
    why: >
      the frozen-encoder comparison needs a task where a pretrained encoder can
      actually show its worth. Fashion-MNIST is 28x28 greyscale — ImageNet
      features are a poor fit and the hand-rolled CNN is already near-ceiling,
      so the comparison would be flat or misleading. 102-class flowers is the
      opposite: hard, fine-grained, natural photographs, and a small CNN from
      scratch does badly on it. That contrast is the lesson.
    note: >
      this means 02_pretrained runs a *different* dataset than 01_convolutions.
      That is a deliberate second lesson — "the same head on a harder problem"
      — but it must be said out loud, and the notebook should also run the
      frozen encoder on fashion so the comparison has one honest apples-to-apples
      row. Predict-then-check: students should guess which gap is bigger.

# -----------------------------------------------------------------------------
vectormesh_usage:
  notebooks_touched: [02_pretrained.ipynb]
  components:
    - ImageVectorizer (mobilenet_v2 -> dinov2_small as the swap exercise)
    - DatasetSchema.infer (so switching datasets changes one string)
    - VectorCache.create(remove_columns=["image"]) / .load / .metadata
    - Collate(padder=torch.stack), OneHot
    - Serial, NeuralNet, GaussianNoise
    - metrics.Accuracy
  shapes_taught:
    - "image (H, W, 3) -> ImageVectorizer -> (D,) per item"
    - "Collate(padder=torch.stack) -> (B, D)"
    - "NeuralNet head -> (B, K)"
    - >
      the point to name explicitly: there is no chunk axis and no aggregator
      here. An image is one vector, so the ladder is one rung shorter than the
      text path in L1. Same Collate, same head. Goal 2.x-c.
  reuses_from_L1: Collate, OneHot, Serial, NeuralNet, the metadata-first habit

