  - file: 03_decomposition_and_nbeats.ipynb
    title: "Putting the decomposition inside the architecture"
    status: done
    moved_from: notebooks/2_timeseries/05_nbeats.ipynb   # was notebook 5, now notebook 3
    content: >
      A series with something for a Fourier basis to find (`solar_10_minutes`, FFT plot
      with a 24h marker), "a basis is a fixed set of shapes, the network picks the mix",
      the N-BEATS block and stack, baselines first, "ask the model what it thinks the
      series is made of" (interpretable stack), and the sunspot "no daily cycle" contrast.
    dataset_change: >
      D20, 2026-08-05 (main_principles.md §3.10). `pedestrian_counts` -> `solar_10_minutes`
      throughout §3.1-3.5; `W,H` rescaled 168,24 -> 288,144 (two days history, one day
      horizon, at 10-minute resolution); `PERIOD` 24 -> 144; `HARMONICS` 6 -> 10. Direct
      user challenge: the old dataset left this notebook without a single case where
      N-BEATS's decomposition won on accuracy anywhere in the graded sequence (linear beat
      it on both `pedestrian_counts` and `sunspot`). Five Monash candidates were measured
      looking for a genuine, ample-data win (not a scarcity artefact) — `solar_10_minutes`
      is the one that produced one: **N-BEATS generic beats linear, 0.2177 vs 0.2523,
      7x the seed noise, at 103,700 training windows** (2.5x the linear model's own
      41,616 parameters). Confirmed at 8/12/20 epochs x 5 seeds, gap holds 0.030-0.035
      throughout (D19 discipline) — table in §3.4. §3.6's sunspot contrast, re-run at the
      new, larger window, found its own nominal N-BEATS edge (0.3225 vs 0.3270) is *not*
      a real result (gap smaller than N-BEATS's own std) — a sharper, re-measured version
      of the earlier "linear wins outright" finding, not a reversal of it.
    extension_built: >
      §3.7 "A cycle that is not a season: sunspots" — resolved the open_question below in
      favour of a full section, not an exercise, once the multi-scale framing (Schwabe +
      Gleissberg, see main_principles.md §3.8) gave it a real result to report rather than
      just a contrast. Fits the whole 203-year series directly (theta as a free
      `nn.Parameter`, no MLP — one series has nothing to generalise a theta-producing
      network across), citing MADS-DAV's `03.2-statistics-of-time.ipynb`, which hands the
      topic forward explicitly. Measured: trend+Schwabe(11yr) R²=0.467; +Gleissberg(87yr)
      R²=0.510; capacity-matched control (more harmonics, same period, same param count)
      R²=0.467 — confirms the gain is the new period, not more parameters. Suess/de Vries
      (~210yr) named as unresolvable at 0.97 repeats in the data. Unaffected by the D20
      dataset swap — this section fits sunspot directly and never used `pedestrian_counts`.
    verified: true
    run: jupyter nbconvert --execute (full) + notebooktester -f (test) — both green,
      2026-08-05, after the D20 dataset swap.

  - file: 04_probabilistic.ipynb
    title: "The line is not the answer"
    status: done
    moved_from: notebooks/2_timeseries/03_probabilistic.ipynb   # was notebook 3, now notebook 4
    content: >
      Existing content, dataset swapped, headings renumbered 3.x -> 4.x. Keeps: the width
      is real and not the model's fault, CRPS as one number that scores a distribution,
      the free baseline named again, a Gaussian head trained with NLL, calibration checked
      (not assumed), a quantile head dropping the Gaussian assumption, the linear-model
      control, and the Autoformer/PatchTST comparison.
    dataset_change: >
      D15 / main_principles.md §3.8. ETTh1 -> australian_electricity_demand throughout.
      New loader `australian_electricity.py`: unlike `ett.py`'s month-scale rolling-eval
      boundaries, this dataset's train/val/test rows differ by only 60 steps, so it splits
      by calendar time instead (last year test, year before val, ~11.2yr train) — documented
      in the module why `ett.py`'s trick does not transfer. W,H rescaled to DAY=48 (four
      days history, one day horizon, same physical span as the hourly W=96,H=24
      elsewhere). Autoformer's decomposition kernel and PatchTST's patch geometry rescaled
      to match (patch count held at 11, same as the W=96 case).
    resolved: >
      Every number re-measured, not carried over. (The first pass through this notebook,
      dated below, was accidentally still measuring `EPOCHS=1` — a leftover fast-iteration
      override sat right after the `param(8, test=1)` call and unconditionally clobbered
      it, so every "full" run had silently trained for one epoch instead of eight. Fixed
      2026-08-05; the numbers here are the corrected, fully-trained ones.) Two findings
      changed shape from the ETTh1 version rather than just changing value: the free
      baseline (`naive + residuals`) is now clearly LAST (CRPS 0.44 vs 0.16-0.21 trained),
      not "competitive, not last" as on ETTh1 — written up as a second, dataset-dependent
      finding, not patched to match the old claim. GRU+gaussian calibration is close on
      4/6 levels; the two off (50%, 90%) are under-covered, not over-covered, and 80%
      itself — the level the table scores by — comes out fine (78.5%). A third finding
      only showed up once training actually ran the documented epoch count: `patchtst` is
      the outright best CRPS (0.1552) and MAE (0.2180), not `linear + quantiles` — the
      under-trained run had linear on top (0.2062 CRPS) because eight epochs of an
      attention model hadn't had time to separate from one. `linear + quantiles` is still
      the worst-calibrated model by far (|80-cov|=0.261).
    run: jupyter nbconvert --execute (full) + notebooktester -f (test) — both green, 2026-08-05
      (re-run after the EPOCHS=1 fix; see `resolved` above).

  - file: 05_gates_highways_moe.ipynb
    title: "Gate, highway, or route: one idea from three papers"
    status: done
    split_from: notebooks/2_timeseries/04_composition.ipynb section 4.6 "The routing family"
    content: >
      Not a literal extraction of §4.6 (that section was tightly coupled to
      `04_composition`'s `ChunkFusion`/patch-feature machinery and its specific "loses on
      four patches" result) — a self-contained rebuild on `australian_electricity_demand`
      (retargeted from ETTh1 by D18), so results are directly comparable to
      `04_probabilistic`'s table. Cites the GRU/LSTM gate (Cho et al. 2014; Hochreiter &
      Schmidhuber 1997), Highway Networks (Srivastava, Greff & Schmidhuber 2015), and
      dense/sparse mixture-of-experts (Jacobs & Jordan 1991; Shazeer et al. 2017) as one
      idea at increasing resolution.
    framing: >
      D16. Explicit in the notebook: general-purpose composition primitive, not a
      time-series trick — introduced here because the lesson has a running example ready,
      the way L1 introduced ray.tune where a two-second run made it obviously worth it.
      Callback to L1's fusion notebook (D10/§3.4c): "another way two streams can combine
      besides concatenation."
    measured: >
      D19-corrected numbers (5 seeds, settled at `EPOCHS=90` after checking 30/60/90 —
      main_principles.md §3.9): `deeper` (0.15879 MAE, 19,632 params) and `gate` (0.16026,
      19,632 params — its exact capacity-matched control) sit inside each other's seed
      spread; `plain` is worst of the original five (0.17381, 15,472 params); `highway`
      (0.16155, 28,080 params, 1.8x `plain`) and dense `moe` (0.16475, 32,372 params, 2.1x
      `plain`) cost more and score worse. Same null-result shape as `04_composition`'s own
      routing experiment (now `09_composition_extra`) and `06_search`'s — reached from a
      third, different window, not a dataset-specific fluke.
    sparse_moe_addition: >
      2026-08-05, then corrected the same day after direct user pushback (see `redo_2`
      below). `vectormesh` 0.7.0 added `SparseMoE` (top-k routing via real gather/scatter —
      sort routing assignments by expert id, run each expert only on its own contiguous
      slice, scatter weighted outputs back; an expert with zero routed examples this batch
      does zero work, confirmed by a test asserting it gets no gradient). `sparse_moe (N=4,
      k=1)` and `sparse_moe (N=64, k=1)` were added as two more trained-and-scored rows in
      §5.3/5.4's main table (5 seeds, the same settled `EPOCHS=90`, not just a separate
      speed demo), and §5.2 gained a train/val MAE-vs-epoch plot (seed=0) for `gate` and
      `deeper` ahead of the existing multi-seed epoch-count table.
    redo_2: >
      Direct user challenge, 2026-08-05, to the first version of this addition: (1) "how do
      you test all architectures, and then fiddle in SparseMoE just to test the speed —
      wasn't this about seeing if sparse actually gives better performance?" and (2) "why
      not visualise train/val learning curves like any human would, instead of a table of
      epoch-count checkpoints?" Both were real gaps in the first pass, fixed rather than
      argued with:
        1. `sparse_moe (N=4, k=1)` (matched capacity to dense `moe`) and `sparse_moe
           (N=64, k=1)` (16x more capacity, same active compute) are now trained and
           scored in the same 5-seed table as every other mechanism. Result: `sparse_moe
           (N=4)` scores 0.16960 vs dense `moe`'s 0.16475 — inside both models' seed noise
           (std 0.0113/0.0101), so routing does not beat blending at matched capacity here.
           `sparse_moe (N=64)` scores 0.17038 — statistically indistinguishable from the
           4-expert version, and the worst trained model apart from `plain`. Sixteen times
           the experts bought nothing on this task.
        2. Checked *why*, rather than stopping at the null result: for one seed (seed=0,
           90 epochs), the trained `sparse_moe (N=64)` router used only **15 of its 64
           experts** on the 361 validation windows — the top expert alone took 42% of
           them, the top five took 90%. Router collapse: nothing in `SparseMoE` or this
           notebook's training loop penalises an unbalanced router, so a handful of experts
           win early and the rest starve. Production Switch/Mixtral implementations add an
           auxiliary load-balancing loss for exactly this reason; this `SparseMoE` doesn't
           — named honestly in-notebook (§5.4) as the likely cause, with a new exercise
           (E6) asking students to add one and re-check.
        3. §5.2 now opens with an actual train/val MAE-vs-epoch plot (seed=0, `gate` vs
           `deeper`) before the multi-seed epoch-count table — both curves flatten by ~epoch
           20-30 with a stable ~0.025 train/val gap (no runaway overfitting), but the val
           curve visibly bounces epoch-to-epoch by more than the gap between the two
           models, which is the visual version of why the seed-and-epoch-count table right
           after it exists at all.
        4. §5.5 (the timing sweep) is reframed as answering a second, separate question
           ("is it cheap to scale") rather than standing in for the accuracy question —
           it still shows the same shape of result (`SparseMoE` 1.9x slower from N=4 to
           N=256 vs dense `MoE`'s 17.1x, crossover by N=64), now explicitly alongside, not
           instead of, the real accuracy answer in §5.4.
    verified: true
    run: jupyter nbconvert --execute (full) + notebooktester -f (test) — both green,
      2026-08-05 (re-run twice: once for the initial SparseMoE speed-only addition, once
      more for `redo_2`'s accuracy test + learning-curve rebuild). Whole-folder
      `notebooktester notebooks/2_timeseries/ -t 300 -pb -f` re-checked after each: 9
      passed both times.

  - file: 06_search.ipynb
    title: "Searching architectures, twice"
    status: done
    content: >
      D17. Mirrors L1 notebook 04's shape: one param_space dict, ray.tune + HyperOptSearch
      (TPE), read the result the same way — which axis actually moved the metric. Search
      space: mechanism (plain/gate/highway/moe/sparse_moe), hidden width, n_experts,
      expert_hidden, lr, on solar_10_minutes (W=288,H=144, matching notebook 03 post-D20)
      rather than notebook 05's window, so the router has a real daily cycle — and 20
      pooled solar sites — to work with. Logs one mlflow summary row per search, matching
      L1 notebook 04 §4.2's convention.
    dataset_change: >
      D20, 2026-08-05 (main_principles.md §3.10). `pedestrian_counts` -> `solar_10_minutes`
      (same swap as notebook 03, keeping D18's three-dataset count). `W,H` 168,24 ->
      288,144. `load_pedestrian_windows` -> `load_solar_windows`, now built on the shared
      `solar_10_minutes.py` loader rather than an inlined, notebook-local one.
    resolved: >
      Re-run on the new dataset/window, 30 trials over the 5-mechanism, 5-axis space:
      **`gate` wins clearly** (hidden=128, mae=0.2079) against `plain`'s own best trial
      (hidden=128, mae=0.2214) — a 0.0135 gap, over 6x the 5-seed baseline's own std
      (0.0021), and well outside the 2-std band the earlier `pedestrian_counts` run
      (0.0028 gap, *inside* that band) could not clear. Every routing mechanism's best
      trial beat `plain`'s best trial here (`highway` 0.2102, `moe` 0.2095, `sparse_moe`
      0.2099) — the first series in this lesson where that has happened for more than one
      mechanism at once. Read as: a real, checked routing advantage on this series, a
      different and more decisive answer from `05`'s electricity window and this
      notebook's own first pedestrian_counts run — not a contradiction, a third
      independent data point showing the answer is series-dependent, as §6.2 always said
      it might be.
    sparse_moe_search_addition: >
      2026-08-05, direct user request: "how many experts, and what is the ideal hidden
      size for the experts... even if it doesn't improve, I think it is a nice thing to
      have set up... make clear what the tradeoffs are (parameters trained vs used)...
      the intuition should be about the need for specialisation." `sparse_moe` (k=1)
      joined the mechanism choices; `n_experts` widened to {2,4,6,8,10,16}; a new
      `expert_hidden` axis ({16,32,64}) makes each expert a genuine bottleneck 2-layer
      network (`Linear -> GELU -> Linear`) with its own width, independent of the block's
      hidden dim, letting the search trade *many small* experts against *few large* ones
      — the "N=10, but smaller" question directly. `param_counts()` reports (total,
      active) parameters per trial; `trainable()`'s `tune.report` carries both through to
      the results dataframe. N_TRIALS bumped 24 -> 30 for the larger space. Re-measured on
      `solar_10_minutes` post-D20: best trial `n_experts=2, expert_hidden=64`, mae=0.2099
      — statistically tied with dense `moe`'s best (0.2095) — at 44,626 trained parameters
