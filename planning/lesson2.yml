open_questions:
  - id: L2.Q1
    status: ANSWERED by building it
    question: >
      Does 02_pretrained use oxford-flowers (a hard task where the encoder
      shines) or fashion (apples-to-apples with the hand-rolled CNN)?
    answer: >
      Both, as recommended — and the two turned out to carry *different*
      lessons, which justifies the cost of running both.
        - fashion is the honest control and the honest limit: 0.773 vs 0.866,
          a few points. ImageNet features are a poor fit for 28x28 greyscale
          icons, and the notebook says so rather than hiding it.
        - flowers is the headline: 0.166 vs 0.905 for the same budget.
      **But 03_mlflow needed flowers specifically**, and that was not
      anticipated: on fashion the CNN and the head cost the same per trial, so
      the search economics have nothing to show (C9). "Which dataset" turned
      out to be a question about where the compute is, not only about where the
      accuracy gap is.
  - id: L2.Q2
    status: ANSWERED — masterplan D10
    question: three tracking mechanisms is two too many
    answer: >
      consolidate on MLflow. `mltrainer.ReportTypes` already has `MLFLOW` and
      Trainer already logs loss, metrics and learning rate to it, so this is a
      settings change per notebook, not a build. TensorBoard stays available as
      the zero-setup local option but stops being taught. aimlflow is a viewer
      layered on the same store — additive, reversible, try it after MLflow is
      the single store.
    remaining_for_conventions_md: >
      where the store lives for students (currently `sqlite:///mlflow.db` in
      the working dir) and whether runs are meant to be shareable.
  - id: L2.Q3
    status: ANSWERED 2026-07-31 — it moves.
    question: >
      Does 01_losses actually move, or does L1 just reference it in place?
    answer: >
      Moved to `notebooks/1_pytorch_intro/05_losses.ipynb`, before
      06_classification. Goal 2.1 is deleted from les2.md and its row folded
      into les1.md goal 1.9, which already pointed at this notebook across the
      lesson boundary — that inconsistency is what motivated D9 in the first
      place. Both lessons renumbered to stay contiguous (C5).
