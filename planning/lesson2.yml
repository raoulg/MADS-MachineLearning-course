lesson: 2
title: "Time series: a different kind of data"
status: done   # redo built and RUN 2026-08-05 -- see `redo` below. All nine notebooks
               # (01-09) executed via `jupyter nbconvert --execute` (full param() values)
               # and pass `uv run notebooktester notebooks/2_timeseries/ -t 300 -pb -f`
               # (test mode) as a whole-folder run: 9 passed, 0 failed, ~40s.
depends_on: [lesson1]

redo: >
  This replaces the round-2 lesson2.yml ("produce a cache and track experiments"), which
  was cut outright — see main_principles.md D9 (superseded) and the `cuts` register. Ray
  and mlflow both landed inside L1 itself (notebook 01 §1.5, notebook 04) before that
  lesson was ever built, so it was redundant on arrival. `notebooks/2_convolutions/`
  (02_pretrained.ipynb, 04_exercises.md, and their support files) moved to
  `notebooks/legacy/`.

  L2 is redefined as time series, absorbing the round-1 `3_recurrent_networks` rebuild
  (folder renamed `notebooks/2_timeseries/` 2026-08-05, D14). That content is real, was
  measured, and has been run — it is not what "hallucinated planning" referred to. What
  this redo changes is the *order* (decomposition/N-BEATS moves in front of probabilistic,
  matching the buildup below), *one dataset* (D15), and *splits one section into its own
  notebook* (D16), and *adds one notebook* (D17, ray search) that did not exist before.

premise: >
  L1's idea — freeze a pretrained encoder, train a cheap head on the vectors — does not
  apply here. main_principles.md §1.2: there is no general-purpose vectorizer for an
  arbitrary time series worth freezing, confirmed by measurement (a linear model beat
  N-BEATS on both pedestrian_counts and ETTh1, notebook 02). Windowing and end-to-end
  training are the correct default, and L2's job is to make students feel *why*, not just
  state it.

  What time series does have, instead of a frozen representation, is **structure you can
  name before you fit anything**: a trend, a repeating daily or weekly shape, a level of
  spread around the point forecast that no amount of extra depth will remove. The buildup
  follows that structure outward:

  1. **A different kind of data** (01, 02) — no cache to download, and a cheap baseline
     that is hard to beat, exactly like L1's own "baseline wins" lesson, in a different
     modality.
  2. **Decomposition, and N-BEATS putting it inside the architecture** (03) — trend and
     seasonality are not just an EDA step, they can be the model's own basis functions.
  3. **Probabilistic forecasting** (04) — the point forecast was never the whole answer;
     score and calibrate the distribution around it.
  4. **Gates, highways, and mixtures of experts** (05) — a general composition primitive
     inspired by GRU/LSTM/Highway/MoE, deliberately not time-series-specific, introduced
     here because this lesson has a running example ready to carry it.
  5. **Search** (06) — the same ray.tune TPE search L1 taught, run a second time in a
     different modality, over architecture axes students now understand well enough to
     have opinions about before the search confirms or corrects them.

  L1 asked "which representation, and which head." L2 has no representation to pick — so
  it asks "which decomposition, which uncertainty, which routing," and ends the same way
  L1 did: search it, don't guess it.

learning_goals:
  - State why there is no general-purpose frozen encoder for an arbitrary time series, and
    what would have to be true of a series for one to exist (forward-reference notebook 08).
  - Window a raw series without leaking test information into the training statistics
    (split first, normalise on train stats only).
  - Read a naive/seasonal-naive baseline as the number every later model must beat, and
    explain why MASE, not raw MAE, is the metric that makes that comparison honest.
  - Decompose a series into trend and seasonal components, and explain what N-BEATS's basis
    stacks are actually fitting.
  - Tell a fixed-period season from a quasi-periodic cycle, and say what happens to a
    fixed-period basis fitted to the wrong kind.
  - Score a probabilistic forecast with CRPS, and distinguish "wide" from "calibrated."
  - Explain the gate/highway/MoE family as one idea (a learned "keep, replace, or route")
    traced to its sources, and compose one with vectormesh Serial/Parallel.
  - Run a ray.tune TPE search over an architecture space in a second modality, and read the
    result the way L1 taught — which axis moved the metric, and by how much.

datasets:
  # D18, 2026-08-05: consolidated from five datasets (ETTh1, pedestrian_counts, sunspot,
  # australian_electricity_demand, traffic_hourly) to three, on direct user feedback that
  # five across nine notebooks was real sprawl and ETTh1's six-covariate domain added
  # confusion an unfamiliar dataset didn't need to. ETTh1 dropped from the graded sequence
  # entirely; kept only in 09_composition_extra (optional appendix), documented below.
  spine:
    name: sunspot (daily)
    source: Monash-University/monash_tsf, config sunspot; loaded via sunspot_daily.py
    used_in: [01_windowing, 02_basemodels, 03_decomposition_and_nbeats (§3.6 contrast),
              08_foundation_models]
    continuity: >
      Students have already met sunspots, in MADS-DAV (03.2-statistics-of-time.ipynb):
      statsmodels seasonal_decompose fails on it there, and DAV's own closing notes hand
      the topic forward explicitly ("In the course on Machine Learning we will go much
      deeper into this topic").
    why: >
      Replaces ETTh1 as the windowing/baseline spine. Same pedagogical role — a series
      where the "obvious" season is not the strong baseline — without ETTh1's unfamiliar
      six-covariate electricity-transformer domain. Verified, not assumed:
        - Real gaps only pre-1849 (3240 of the first ~11,300 days). `sunspot_daily.py`
          starts at 1848-12-22: 62,617 consecutive daily points, no missing days.
        - A genuine ~27-day quasi-period (solar synodic rotation), distinct from any
          calendar season: ACF has a local maximum at lag 26-28 days (0.77, above its
          lag-14 and lag-60 neighbours, 0.68 and 0.70); the spectrum's short-period peaks
          cluster at 26.8-28.2 days. Day-to-day persistence is still far stronger
          (acf(1d)=0.96) — naive beats seasonal-naive(27d), the same shape of result
          ETTh1 gave, now on a series with no covariates to explain away.
        - The single largest peak in the *entire* daily-resolution spectrum (measured
          over the 151-year training span) sits at ~11 years (3951 days) — the Schwabe
          cycle is visible even at daily resolution, ~160x the power of the 27-day
          rotation peak. An 81-day window cannot reach it; that gap is what
          `03_decomposition_and_nbeats` §3.7's yearly zoom-out exists to close.
  decomposition_demo:
    name: pedestrian_counts
    source: Monash-University/monash_tsf, config pedestrian_counts
    used_in: [03_decomposition_and_nbeats (primary demo), 06_search]
    why: >
      Hourly Melbourne footfall, 66 series, clean 12h/24h spectral peaks — spectral
      top-5/total = 0.81, the highest of every series checked (main_principles.md §3.8).
      The daily cycle a fixed-period seasonal basis is built for; the contrast case for
      sunspot's absence of one.
  probabilistic_and_gating:
    name: australian_electricity_demand
    source: Monash-University/monash_tsf, config australian_electricity_demand
    used_in: [04_probabilistic, 05_gates_highways_moe]
    why: >
      D15. Not because ETTh1 measured noisier — it didn't — but because ETTh1's
      difficulty was regime drift between train/val/test spans, a confound that made a
      first calibration lesson harder to read, not easier. 3x tighter CoV than ETTh1
      (0.20 vs 0.62), a clean half-hourly daily+weekly pattern, 5 long series (13+ years
      each), real Monash/CC-BY-4.0 benchmark, not a dataset built to look clean. Reused
      in 05 (D16's gating notebook) for continuity and because it gives the mechanism a
      real chance: real daily+weekly structure to route on, unlike a flat window.
  contamination_check:
    name: sunspot (verified in Salesforce/lotsa_data)
    why: >
      `08_foundation_models`'s whole point is "check the pretraining corpus before
      believing a zero-shot number" — this only works if the series is plausibly
      contaminated. Verified by listing `Salesforce/lotsa_data`'s files: a
      `sunspot_with_missing` config exists there, confirming the same risk ETTh1 carried
      transfers to sunspot. If it had NOT been there, the notebook would need a different
      structure (an honest, uncontaminated benchmark) — checked before writing, not
      assumed to transfer.
  deferred_exception:
    name: ETTh1
    source: ETDataset/ett (ett.py, kept for its window_index utility import elsewhere)
    role: >
      Kept ONLY in `09_composition_extra` (optional appendix, not in the graded 01-08
      sequence), because that notebook's `ts_features.py` dependency hardcodes spectral
      band boundaries (`p<6h`...`p>=36h`) and ACF lags to an hourly cadence — retargeting
      it means redesigning the feature set for daily resolution, not swapping a loader.
      Tracked as follow-up work (see notebook 09's own banner), not rushed to hit the
      three-dataset target at the cost of an unverified rewrite.

notebooks:

  - file: 01_windowing.ipynb
    title: "The same operation, on a real series"
    status: keep_as_is
    content: >
      Existing, real, run content — no change proposed. Establishes: the row is the
      series, why a naive train/test split of *rows* is not a split at all for one long
      series, split-then-window, normalise on train statistics only, and how much overlap
      between windows is defensible. ETTh1.
    reused_from: notebooks/2_timeseries/01_windowing.ipynb   # unchanged

  - file: 02_basemodels.ipynb
    title: "Does the expensive model earn its keep?"
    status: keep_as_is
    content: >
      Existing, real, measured content. Naive / seasonal-naive baselines, why MASE is the
      metric that makes "which naive" a real question, then linear / conv / recurrent
      models measured against them with a cost column. ETTh1. This is where "the baseline
      wins" — L1's own central finding — recurs in a second modality, before the lesson
      gets to anything clever. Positioned right after windowing and before decomposition
      deliberately: N-BEATS in notebook 03 has to beat *this* number, not be presented in a
      vacuum.
    reused_from: notebooks/2_timeseries/02_basemodels.ipynb   # unchanged
    note: >
      Placement relative to notebook 03 is this redo's call, not something the user
      specified directly — flagged so it can be pushed back on. The alternative (put
      decomposition/N-BEATS immediately after windowing, before any baseline table) loses
      the "beat a stated number" framing but gets to the decomposition idea one notebook
      sooner.

  - file: 03_decomposition_and_nbeats.ipynb
    title: "Putting the decomposition inside the architecture"
    status: done
    moved_from: notebooks/2_timeseries/05_nbeats.ipynb   # was notebook 5, now notebook 3
    content: >
      Existing content, reordered earlier, headings renumbered 5.x -> 3.x. Keeps: a series
      with something for a Fourier basis to find (pedestrian_counts, FFT plot with 12h/24h
      markers), "a basis is a fixed set of shapes, the network picks the mix", the N-BEATS
      block and stack, baselines first (naive/linear beat N-BEATS — main_principles.md
      §1.2), "ask the model what it thinks the series is made of" (interpretable stack),
      and the ETTh1 "no daily cycle" contrast.
    extension_built: >
      §3.7 "A cycle that is not a season: sunspots" — resolved the open_question below in
      favour of a full section, not an exercise, once the multi-scale framing (Schwabe +
      Gleissberg, see main_principles.md §3.8) gave it a real result to report rather than
      just a contrast. Fits the whole 203-year series directly (theta as a free
      `nn.Parameter`, no MLP — one series has nothing to generalise a theta-producing
      network across), citing MADS-DAV's `03.2-statistics-of-time.ipynb`, which hands the
      topic forward explicitly. Measured: trend+Schwabe(11yr) R²=0.467; +Gleissberg(87yr)
      R²=0.510; capacity-matched control (more harmonics, same period, same param count)
      R²=0.467 — confirms the gain is the new period, not more parameters. Suess/de Vries
      (~210yr) named as unresolvable at 0.97 repeats in the data.
    verified: true
    run: jupyter nbconvert --execute (full) + notebooktester -f (test) — both green, 2026-08-05
      (re-run after fixing an `EPOCHS=1` override that had been silently clobbering
      `param(12, test=1)` since this notebook's first commit — see the `resolved` note on
      `04_probabilistic.ipynb` below for the shared root cause. The sunspot §3.7 numbers
      above are unaffected — that section fits `theta` directly and never used `EPOCHS`
      — but the pedestrian/ETTh1 N-BEATS-vs-linear table in §3.4/3.6 was under-trained
      and has been re-measured; the ranking (linear wins on pedestrian, N-BEATS wins on
      ETTh1) held, only the specific MAE values moved).

  - file: 04_probabilistic.ipynb
    title: "The line is not the answer"
    status: done
    moved_from: notebooks/2_timeseries/03_probabilistic.ipynb   # was notebook 3, now notebook 4
    content: >
      Existing content, dataset swapped, headings renumbered 3.x -> 4.x. Keeps: the width
      is real and not the model's fault, CRPS as one number that scores a distribution,
      the free baseline named again, a Gaussian head trained with NLL, calibration checked
      (not assumed), a quantile head dropping the Gaussian assumption, the linear-model
      control, and the Autoformer/PatchTST comparison.
    dataset_change: >
      D15 / main_principles.md §3.8. ETTh1 -> australian_electricity_demand throughout.
      New loader `australian_electricity.py`: unlike `ett.py`'s month-scale rolling-eval
      boundaries, this dataset's train/val/test rows differ by only 60 steps, so it splits
      by calendar time instead (last year test, year before val, ~11.2yr train) — documented
      in the module why `ett.py`'s trick does not transfer. W,H rescaled to DAY=48 (four
      days history, one day horizon, same physical span as the hourly W=96,H=24
      elsewhere). Autoformer's decomposition kernel and PatchTST's patch geometry rescaled
      to match (patch count held at 11, same as the W=96 case).
    resolved: >
      Every number re-measured, not carried over. (The first pass through this notebook,
      dated below, was accidentally still measuring `EPOCHS=1` — a leftover fast-iteration
      override sat right after the `param(8, test=1)` call and unconditionally clobbered
      it, so every "full" run had silently trained for one epoch instead of eight. Fixed
      2026-08-05; the numbers here are the corrected, fully-trained ones.) Two findings
      changed shape from the ETTh1 version rather than just changing value: the free
      baseline (`naive + residuals`) is now clearly LAST (CRPS 0.44 vs 0.16-0.21 trained),
      not "competitive, not last" as on ETTh1 — written up as a second, dataset-dependent
      finding, not patched to match the old claim. GRU+gaussian calibration is close on
      4/6 levels; the two off (50%, 90%) are under-covered, not over-covered, and 80%
      itself — the level the table scores by — comes out fine (78.5%). A third finding
      only showed up once training actually ran the documented epoch count: `patchtst` is
      the outright best CRPS (0.1552) and MAE (0.2180), not `linear + quantiles` — the
      under-trained run had linear on top (0.2062 CRPS) because eight epochs of an
      attention model hadn't had time to separate from one. `linear + quantiles` is still
      the worst-calibrated model by far (|80-cov|=0.261).
    run: jupyter nbconvert --execute (full) + notebooktester -f (test) — both green, 2026-08-05
      (re-run after the EPOCHS=1 fix; see `resolved` above).

  - file: 05_gates_highways_moe.ipynb
    title: "Gate, highway, or route: one idea from three papers"
    status: done
    split_from: notebooks/2_timeseries/04_composition.ipynb section 4.6 "The routing family"
    content: >
      Not a literal extraction of §4.6 (that section was tightly coupled to
      `04_composition`'s `ChunkFusion`/patch-feature machinery and its specific "loses on
      four patches" result) — a self-contained rebuild on `australian_electricity_demand`
      (retargeted from ETTh1 by D18), so results are directly comparable to
      `04_probabilistic`'s table. Cites the GRU/LSTM gate (Cho et al. 2014; Hochreiter &
      Schmidhuber 1997), Highway Networks (Srivastava, Greff & Schmidhuber 2015), and
      dense/sparse mixture-of-experts (Jacobs & Jordan 1991; Shazeer et al. 2017) as one
      idea at increasing resolution.
    framing: >
      D16. Explicit in the notebook: general-purpose composition primitive, not a
      time-series trick — introduced here because the lesson has a running example ready,
      the way L1 introduced ray.tune where a two-second run made it obviously worth it.
      Callback to L1's fusion notebook (D10/§3.4c): "another way two streams can combine
      besides concatenation."
    measured: >
      D19-corrected numbers (5 seeds, settled at `EPOCHS=90` after checking 30/60/90 —
      main_principles.md §3.9): `deeper` (0.15879 MAE, 19,632 params) and `gate` (0.16026,
      19,632 params — its exact capacity-matched control) sit inside each other's seed
      spread; `plain` is worst (0.17381, 15,472 params); `highway` (0.16155, 28,080
      params, 1.8x `plain`) and dense `moe` (0.16475, 32,372 params, 2.1x `plain`) cost
      more and score worse. Same null-result shape as `04_composition`'s own routing
      experiment (now `09_composition_extra`) and `06_search`'s — reached from a third,
      different window, not a dataset-specific fluke.
    sparse_moe_addition: >
      2026-08-05. §5.1's dense-MoE caveat ("this notebook doesn't test the sparse routing
      that makes production MoE fast") resolved into a real result, not left standing.
      `vectormesh` 0.7.0 added `SparseMoE` (top-k routing via real gather/scatter — sort
      routing assignments by expert id, run each expert only on its own contiguous slice,
      scatter weighted outputs back; an expert with zero routed examples this batch does
      zero work, confirmed by a test asserting it gets no gradient). New §5.5 times
      `SparseMoE` (k=1) against dense `MoE` on a fixed batch of this notebook's own
      windows, N=4 to N=256 experts: parameter count grows 64x, `SparseMoE`'s forward time
      grows only 2.0x (0.129 -> 0.262 ms) while dense `MoE` grows 15.2x (0.117 -> 1.783
      ms) — dense is briefly faster at N=4 (routing overhead exceeds the saving when
      there's nothing to route around), crosses over by N=16, and is 6.8x slower than
      sparse by N=256. Does not retest whether routing was worth its parameters on this
      task (§5.4 already answered a related question for the dense version) — only that
      the capacity/compute decoupling production MoE papers claim is real and measured
      here, not asserted.
    verified: true
    run: jupyter nbconvert --execute (full) + notebooktester -f (test) — both green,
      2026-08-05 (re-run for the SparseMoE addition; whole-folder
      `notebooktester notebooks/2_timeseries/ -t 300 -pb -f` also re-checked: 9 passed).

  - file: 06_search.ipynb
    title: "Searching architectures, twice"
    status: done
    content: >
      D17. Mirrors L1 notebook 04's shape: one param_space dict, ray.tune + HyperOptSearch
      (TPE), read the result the same way — which axis actually moved the metric. Search
      space: mechanism (plain/gate/highway/moe, from notebook 05), hidden width, n_experts
      (moe only), lr, on pedestrian_counts (W=168,H=24, matching notebook 03) rather than
      notebook 05's ETTh1 window, so the router has a real daily cycle to work with. Logs
      one mlflow summary row per search, matching L1 notebook 04 §4.2's convention.
    resolved: >
      Dataset question (below) resolved by running the search itself rather than a
      pre-check: pedestrian_counts, measured. 24 trials, 105s. Best trial is `plain`
      (0.2624 MAE, hidden=128), beating the hidden=64 baseline (0.2805 +/- 0.0021) by more
      than 2 std — but still no gate; `gate`'s best (0.2635) is close but does not win.
      Third measured case of the same finding, after `04_composition`'s four-patch window
      and `05_gates_highways_moe`'s ETTh1 window: a real cycle to route on still did not
      make gating earn its parameters here. Written up honestly rather than left as a
      dangling implication from the notebook's own framing.
    params:
      - N_TRIALS = param(24, test=2)
      - EPOCHS = param(15, test=1)
    run: jupyter nbconvert --execute (full, 24 real trials) + notebooktester -f (test) — both green, 2026-08-05.

  - file: 07_exercise.ipynb
    title: "Your own series, your own negative result"
    status: done
    moved_from: notebooks/2_timeseries/06_exercise.ipynb
    found_stale: >
      06_exercise.ipynb was NOT round-1 time series content — it was leftover
      gesture-classification RNN exercise material (`mads_datasets`, `rnn_models.BaseRNN`,
      MNIST comparisons), never actually rebuilt despite the old lesson3.yml's
      `status: mostly_done` claiming otherwise. This is the one place in the redo where
      "hallucinated planning" (the user's original framing) turned out to be real: not
      opus-authored prose, but a status field asserting a rebuild that never happened.
      Replaced outright rather than "retargeted."
    content: >
      Establish a baseline (02's habit) on a series of the student's choice from the
      Monash archive, decompose it, try N-BEATS, judge whether probabilistic forecasting
      is worth it, try one gated architecture against its capacity-matched control. Same
      "must contain a negative result" deliverable requirement as L1 notebook 05. Worked
      end to end on `traffic_hourly` (deliberately the noisiest series characterised in
      main_principles.md §3.8, spectral top-5/total 0.38) as a running template: seasonal
      naive MASE 0.978, linear only marginally ahead at 0.935.
    verified: true
    run: jupyter nbconvert --execute (full) + notebooktester -f (test) — both green, 2026-08-05.

  - file: 08_foundation_models.ipynb
    title: "Foundation models, and how to decide whether to believe one"
    status: done
    moved_from: notebooks/2_timeseries/07_foundation_models.ipynb   # was notebook 7, now notebook 8
    content: >
      Existing, real, measured content — no change beyond renumbering 6.x -> 8.x headers
      (no stale cross-references found). Baselines at a longer window, TimesFM zero-shot,
      the contamination check that has to come before the celebration, a result
      contamination cannot explain away, and the closing rule (does the encoder compress
