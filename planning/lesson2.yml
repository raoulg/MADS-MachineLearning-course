runtime_budget:
  status: >
    MEASURED 2026-07-31, M-series mac (MPS), warm HF cache, notebooktester -f.
    **4 passed, 0 failed.**
  measured:
    01_losses: 2.4s
    01_convolutions: 25.7s   # 938 steps/epoch x 3 epochs, accuracy 0.885
    02_pretrained: 105.7s    # with the four caches already on disk
    03_mlflow: 53.3s         # with the flowers cache already on disk
    whole_lesson: 3m07s (187s summed)
  first_run_is_slower: >
    02_pretrained builds four caches on a cold artefacts/ dir — about 2 minutes,
    of which ~84s is the C2 hashing overhead rather than encoding. 03_mlflow
    then reuses the flowers cache, or spends ~52s building it.
  encoder_throughput:
    mobilenet_v2_mps_fashion_28x28: 940 img/s
    mobilenet_v2_mps_flowers_full_size: 250 img/s
    mobilenet_v2_cpu_flowers_full_size: 46 img/s
    dinov2_small_cpu_flowers_full_size: 74 img/s
    note: >
      dinov2-small is *faster on CPU* than mobilenet_v2 despite being 6x bigger
      (22M vs 3.5M parameters). Worth putting in front of students in E1 —
      "bigger" and "slower" are not the same axis, and the ranking is not the
      one they will predict.
    caveat: >
      these are the *encoder* rates. `VectorCache.create` adds a flat ~21s per
      call on top (C2), which at these sample sizes dominates the wall-clock.
  the_comparison_that_the_lesson_rests_on:
    setup: 4000 train / 1000 test per dataset, 10 epochs, identical trainer
    fashion_10_classes:
      cnn:  {accuracy: 0.773, params: 330762, train_time: 5s}
      head: {accuracy: 0.866, params: 1652490, train_time: 3s}
    flowers_102_classes:
      cnn:  {accuracy: 0.166, params: 344934, train_time: 80s}
      head: {accuracy: 0.905, params: 1770342, train_time: 3s}
    two_things_worth_noticing: >
      (1) the head has *more* trainable parameters than the CNN and still trains
      27x faster on flowers — parameter count is where the memory is, the
      convolutions are where the compute is. The notebook makes this an explicit
      teaching point, because "parameters" is the number students reach for when
      they mean "cost".
      (2) the flowers CNN is **not stuck** — loss falls 4.46 -> 2.95 monotonically
      and accuracy is still climbing at epoch 10. The honest claim is about
      *budget*, not capability: for the same budget the frozen encoder is
      finished and the from-scratch model has barely started. Exercise E2b asks
      the student to find out what a fair fight would cost.
  the_crossover_03_mlflow_measures:
    setup: flowers, 4000 train / 1000 test, 5 epochs, identical trainer
    cnn:  {accuracy: 0.076, seconds_per_run: 38.7}
    head: {accuracy: 0.887, seconds_per_run: 0.9}
    one_time_encoding: 51.7s
    crossover: 1.4 trials
    projected:
      n_1:   {cnn: 39s,   head: 53s}
      n_5:   {cnn: 194s,  head: 56s}
      n_20:  {cnn: 775s,  head: 69s}
      n_100: {cnn: 3875s, head: 138s}
    why_this_is_the_whole_argument: >
      caching pays for itself after **two** trials, and by a hundred it is 28x
      cheaper. That is the number D9 wanted L4 to inherit: hypertuning only
      becomes teachable once a trial costs a second. The notebook has the
      student do this arithmetic rather than being told it.

