lesson: 7
title: "Graphs"
status: needs_review      # untouched by round 1 apart from two notebooks
round: 3

premise: >
  The second lesson in the course where vectorization does not apply (main_principles.md
  §1.2): the signal is the structure, and there is no per-node encoder to freeze. Like L3,
  its round-2 job is to mark the boundary of the L1 idea rather than to adopt it.

current_notebooks:
  - 01_intro.ipynb                 # untouched since before round 1
  - 02_clusters_in_graphs.ipynb    # touched in round 1
  - 03_gnn.ipynb                   # touched in round 1

round3_changes:
  - id: L7.1
    change: "Review 01_intro against the rest of the course; it is the oldest notebook in the repo."
  - id: L7.2
    change: >
      State the boundary explicitly, as L3 does: a node embedding IS a vector, so students
      will ask why there is no cache. The answer -- that node embeddings are learned
      jointly with the task and depend on the graph, so they cannot be frozen and shipped
      the way an image encoder can -- is worth a paragraph rather than a silence.
  - id: L7.3
    change: "Check torch-geometric still installs cleanly on py3.13 / ARM before committing to keeping this lesson as-is."

open_questions:
  - >
    Is L7 still earning its place? It is the least connected lesson in the course and
    carries a heavyweight dependency (torch-geometric). Not a decision for this round, but
    it should be made deliberately rather than by inertia.
