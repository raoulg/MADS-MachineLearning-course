  - id: L6.Q1
    question: >
      How does a LOCAL checkpoint get into a VectorCache? The owner's Utrecht
      model is a MoCo ResNet pretrained on 1M aerial images — a state dict with
      no hub id, which `PatchImageVectorizer` cannot wrap.
    proposal: >
      a sibling `ModulePatchVectorizer(module=..., transform=..., label=...)`
      that fingerprints by **sha256 of the state dict** rather than by name.
      This also closes an acknowledged blind spot in
      `BaseVectorizer.fingerprint_fields`: "a locally mutated or fine-tuned
      model reusing the same tag is not distinguishable here."
    sub_questions:
      - "should the hash cover buffers as well as parameters? (BatchNorm stats differ after fine-tuning — probably yes)"
      - "should `transform` be in the fingerprint? (resize/normalisation change the vectors — probably yes)"
    status: awaiting owner

