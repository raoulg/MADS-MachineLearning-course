vectormesh_usage:
  version_check: ">=0.4.4 — all three additions below shipped in it"
  added_by_this_lesson:
    - "`PatchImageVectorizer` — (C, D) per image instead of (D). L6.D4."
    - "`Siamese` — in `components/pipelines.py`, directly under `Parallel`."
    - "`RepresentationStd` — in `components/metrics.py`, deliberately NOT a `Metric` subclass."
  design_notes:
    - >
      `Siamese` is `Parallel` with the branches' weights coupled and a gradient
      gate on one side. Placing it in the same file, under `Parallel`, is the
      explanation.
    - >
      the EMA update lives inside `forward()`, not in the training loop, because
      `mltrainer.Trainer.trainbatches` has **no per-step hook**. Verified: SSL
      drops into the existing Trainer with zero library changes, because
      `_to_device` already handles tuple inputs and metrics are called as
      `m(y, yhat)`.
    - >
      `RepresentationStd` overrides `__call__` because `Metric` assumes a
      `(y, yhat)` pair of tensors and moves both to a device, while this is a
      property of a representation alone.
  known_gap:
    - >
      `PatchImageVectorizer` wraps a model **by hub name only**. A local
      checkpoint (the owner's Utrecht MoCo, the torchgeo weights) has no hub id,
      so 02's ResNet comparison takes a manual path. See L6.Q1.
  shapes_taught:
    - "(B, C, D) where C is image patches — the same rung L5 taught with text chunks"
    - "aggregate C -> classification; keep C -> segmentation"

