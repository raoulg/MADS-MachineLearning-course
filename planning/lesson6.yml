  - id: L6.Q3
    question: >
      Is the Utrecht MoCo model actually suitable for the tree-finding task, given C8?
    what_is_known: >
      C8 predicts a frozen MoCo ResNet will localise ~25 points worse than a
      generic ImageNet one. But that is a *frozen probe* result, and MoCo's
      strong dense-task results were all fine-tuned.
    cheap_next_step: >
      run the Utrecht checkpoint through 02's per-patch comparison — a ~3 minute
      experiment that says whether the freeze-and-probe workflow is viable for
      it at all. If not, the next pretraining run wants a patch-level objective
      (DenseCL, PixPro, I-JEPA).
    status: awaiting the model

