  start_with: >
    P0.6 (the mltrainer iterator fix) — it lives in another repo, it blocks the
    num_workers default and every timing claim in L1/L2, and until it lands
    each notebook touched will print validation metrics computed on a single
    batch. It is a small change and it makes everything measured afterwards
    trustworthy.
  track_of_record: >
    the per-lesson plans carry corrections back into this file (lesson1.yml
    already contributed C1-C3, which became D4/D8 and rewrote P1.1/P1.4).
    Keep that habit while building: when a notebook contradicts a plan, the
    notebook wins and the plan gets updated.
  per_lesson_plan_template:
    sections:
      - current_state: notebook-by-notebook, cell ranges that move or die
      - learning_goals_delta: which les{n}.md goals change
      - datasets: old id -> new id, verified how
      - vectormesh_usage: which components, which cache, which shapes
      - new_cells: what gets written, in order
      - exercises: including at least one ablation
      - runtime_budget: measured, on CPU
      - depends_on: phase tasks and vectormesh versions
