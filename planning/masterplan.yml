risks:
  - id: R1
    risk: Encoder downloads and cache builds are too slow/large on student
      laptops or on the SURF/Azure VMs.
    mitigation: P0.3 — distribute caches; every notebook has a "load the
      published cache" path and a clearly-marked "build it yourself" path.
    severity: high
  - id: R2
    risk: The course loses the "understand it from scratch" character and
      becomes API-calling.
    mitigation: principle handroll_once_then_reuse is non-negotiable; each
      lesson keeps its hand-rolled implementation and the frozen-vector version
      is framed as the *economic* alternative, with the ablation as the point.
    severity: high
  - id: R3
    risk: HF community datasets disappear, get renamed, or turn out to be
      mislabelled mirrors.
    mitigation: pin revisions in load_dataset; prefer org-owned ids
      (zalando-datasets, Monash-University); consider self-publishing (Q1).
    severity: medium
  - id: R4
    risk: Scope explosion — phases 3-5 are a new course, not a refactor.
    mitigation: phases 1-2 must be shippable for the next cohort on their own;
      3-5 are explicitly flagged as optional extensions until Q6 is answered.
    severity: medium
  - id: R5
    risk: vectormesh API churn breaks notebooks mid-cohort.
    mitigation: pin vectormesh version in pyproject.toml per cohort; land
      phase_4 extensions before the lessons that use them.
    severity: medium
  - id: R6
    risk: Cache-based lessons hide preprocessing bugs (a student never sees the
      raw data, so a broken vectorizer looks like a hard task).
    mitigation: every cache-consuming notebook starts by reading metadata and
      sanity-checking a few rows against their raw source.
    severity: low
  - id: R7
    risk: >
      Publishing a cache re-publishes the underlying data. Embeddings are a
      derived work, so a "research use only" source stays research use only,
      and dropping the raw column does not launder the terms.
    mitigation: >
      licence_audit before any upload; licence + source revision recorded in
      every dataset card (checklist in docs/publishing-caches-to-huggingface.md);
      private repo or no repo when redistribution is unclear.
    severity: medium
  - id: R9
    risk: >
      `datasets` 5.0 dropped script-based loading — there is no
      `trust_remote_code` parameter any more. The older scientific datasets are
      exactly the ones still shipping a loader script, so `load_dataset(id)`
      fails on precisely the candidates we need for the gaps. Verified:
      Monash-University/monash_tsf (monash_tsf.py) and monster-monash/PAMAP2
      (PAMAP2.py + .npy) are both script-based. All phase_1 datasets
      (fashion_mnist, oxford-flowers, imdb) are parquet-native and fine.
    mitigation: >
      make it a selection criterion, not a surprise. Before any dataset enters a
      plan, run `HfApi().list_repo_files(id, repo_type="dataset")` and check for
      a `.py`. If there is one, either use the `refs/convert/parquet` branch
      (verified working for monash_tsf), download the raw files directly
      (PAMAP2's .npy needs only hf_hub_download + np.load), or re-publish a
      parquet copy under our own account where the licence allows.
    severity: medium
  - id: R8
    risk: >
      Half-migrated state. D2 deliberately leaves mads_datasets in place while
      lessons migrate one at a time, so for a while some notebooks use it and
      some do not — confusing for students mid-cohort.
    mitigation: >
      the kill list (P0.5) is the single source of truth; do not start a cohort
      with a lesson in a mixed state — migrate a whole lesson or none of it.
    severity: medium
  - id: R10
    risk: >
      **Framework API churn breaks a lesson silently between cohorts.** Found
      2026-08-01: `ray.train.report` started raising inside Tune functions, so
      L4 and `hypertune.py` stopped working (P0.7) with no code change on our
      side. `datasets` 5.0 dropping script-based loading (R9) is the same story
      in another library. The failure mode is what makes it a risk rather than
      a chore: ray reported "worker crashed unexpectedly (SIGSEGV)" and the
      actual deprecation message never reached the driver, so the breakage
      looks like a hardware or environment problem.
    mitigation: >
      pin ray as well as vectormesh/mltrainer per cohort; run notebooktester
      over **every** lesson before a cohort starts, not only over the lessons
      being edited — the 5 known failures in lessons 0, 4 and 7 sat unexplained
      for two weeks and one of them was this; and when a worker dies without a
      message, reproduce the trial in pure python before debugging the
      environment.
    severity: medium

