    no_exceptions: >
      REVISED — an earlier draft kept `flower_photos.tgz` in L1/03_dataloader
      so its hand-rolled directory walker would still have a directory to walk.
      That was backwards, and D8 kills it. No flower_photos anywhere, no second
      download mechanism, no tgz.
    date: 2026-07-30

  - id: D5
    answers: >
      "should BaseDatastreamer / datatools.window move into vectormesh or
      mltrainer, or do we just use the HF/torch dataloaders?"
    decision: >
      Split the answer — they are not the same kind of thing.

      `BaseDatastreamer`: do not move it. A torch `DataLoader` over an HF
      dataset does the same job with multi-worker prefetch and pinning, so
      keeping a hand-written single-threaded generator in a library would be
      maintaining a slower copy. It is *deleted*, and the concept it taught
      keeps a home in L1/03_dataloader, which hand-rolls the pattern from
      scratch anyway (that notebook is an iterator lesson, not a data-loading
      lesson).

      `datatools.window`: move to vectormesh. Windowing a series into
      overlapping chunks is exactly the (C, D)-producing operation vectormesh
      is built around — it belongs next to `Vectorizer`'s chunking, and VM.1
      (TimeSeriesVectorizer) needs it regardless. Keep a hand-rolled version in
      the L3 notebook as the lesson, then import the library one, the same
      build-it-then-meet-the-library shape 03_dataloader already uses.
    blocked_by: P0.6 — see below. "The HF dataloaders will perform better" is
      only true after mltrainer stops rebuilding its iterator every step.
    date: 2026-07-30

  - id: D6
    answers: lesson1.yml learning_goals_delta 1.5
    decision: >
      Goal 1.5 is **retained**. Students must still understand why big datasets
      need lazy/streamed loading rather than being read into memory — that is a
      real and permanent idea, not an artefact of the old library. Only the
      *implementation* changes: `BaseDatastreamer` → an HF iterator /
      `streaming=True` dataset, plus the cache as the other half of the answer
      (embed once, then stream small vectors instead of big raw data).
    reword_as: >
      "understands why large datasets are loaded lazily/streamed rather than
      into memory, and can name the trade-offs" — implementation-agnostic, so
      the next library change does not invalidate it again.
    note: >
      this is NOT a cut and does not make room for anything. L1's make_room
      accounting rests on the FileTypes tour, the mads_datasets-as-study-material
      section, and (expendably) 1.15.
    date: 2026-07-30

  - id: D7
    answers: >
      "is the torch DataLoader the best option, or does HF have its own
      dataloaders/streamers with better streaming performance?"
    finding: >
      HF `datasets` does not ship a loader at all — there is no alternative to
      choose. It ships two *dataset* types, both designed to be fed to a torch
      DataLoader: `Dataset` (Arrow, memory-mapped, zero-copy) and
      `IterableDataset` (streaming). What HF adds on top of torch is
      streaming-specific: `n_shards` so `num_workers>0` streams shards in
      parallel, `state_dict()/load_state_dict()` for resumable mid-epoch
      checkpointing, `split_dataset_by_node` for multi-node, `.batch()`,
      `with_format`.
    measured: >
      On the real 25k-row IMDB regex cache (43-dim), batch_size=32, M-series
      CPU, 200 batches:
        DataLoader num_workers=0 .............. 0.31 ms/batch
        DataLoader num_workers=2 .............. 0.27 ms/batch
        DataLoader num_workers=4 .............. 0.18 ms/batch
        with_format("torch"), num_workers=0 ... 0.41 ms/batch  (SLOWER)
        next(iter(dl)) per step [mltrainer] ... 0.52 ms/batch  (1.7x slower)
    decision: >
      Plain torch DataLoader over a memory-mapped `Dataset`, with
      **num_workers=2 and persistent_workers=True** as the course default.
      Do not call `with_format("torch")` when a `Collate` already stacks — it
      converts on every access and measured *slower* here.
    why_2_not_4: >
      the 4-worker number was measured on an M-series with *nothing else
      running*. Students on a 4-core VM train on CPU, so workers compete with
      the training compute and with torch's own intra-op threads; 4 workers on
      4 cores leaves nothing for the main process. 2 is the safe default that
      still gets most of the gain, and `persistent_workers=True` matters more
      than the count — without it the pool is rebuilt every epoch.
    keep_it_in_proportion: >
      0.31 -> 0.18 ms/batch is a 40% gain on something that is a fraction of a
      percent of a training run: about 0.1 second saved over 782 batches. Real,
      but invisible. Worth setting as a default, not worth a paragraph in a
      notebook.
    blocked_by: >
      P0.6. With num_workers>0 and mltrainer's current per-step
      `next(iter(loader))`, the worker pool is respawned *every batch* — the
      default would make things dramatically worse, not better. Land the fix
      first, then set the default.
    gotcha_worth_teaching: >
      with num_workers>0, a .py script needs its entry point under
      `if __name__ == "__main__":` or the workers crash on spawn (macOS,
      Windows). Hit this while benchmarking. Belongs in the scripts/ material,
      not in a notebook — notebooks are unaffected.
      Reach for `IterableDataset` (`streaming=True`) only where streaming is the
      actual point: L1/03_dataloader (goal 1.5) and one-time embedding passes
      over data too big for disk. There the bottleneck is the encoder or the
      network, not the loader.
    do_not_teach: >
      dataloader micro-optimisation. The measured spread is 0.13 ms. Spending
      lesson time on it would buy nothing and violates make_room.
    aside: >
      `torchdata.StatefulDataLoader` + `IterableDataset.state_dict()` is the
      right tool for resumable long GPU runs — belongs in `scripts/`, if
      anywhere, never in a laptop notebook. torchdata is not currently installed.
    date: 2026-07-30

  - id: D8
    answers: >
      "L1/03 keeping a separate flowers download just to get a folder structure
      is clumsy — can we find a folder-structured image dataset, or hand-roll
      labels over a normal one?"
    finding: >
      Option (a) is a dead end. The Hub standardised on parquet, and
      folder-structured image datasets have essentially disappeared from it.
      Checked: sasha/dog-food, Javtor/rock-paper-scissors, blanchon/EuroSAT_RGB,
      nkirschi/oxford-flowers, microsoft/cats_vs_dogs, Bingsu/Cat_and_Dog —
      all parquet, zero loose image files. `frgfm/imagenette` looked promising
      but is a *script* that downloads the original fast.ai tgz, i.e. the same
      external-download problem plus the datasets-5.0 script problem (R9).
    decision: >
      **Drop the folder structure entirely — do not preserve it, and do not
      recreate it.** An earlier draft proposed writing images out to class
      subfolders so the hand-rolled walker would still have something to walk.
      That is staging a scenario to justify code that no longer reflects
      practice, which is exactly backwards: the manual code exists to teach how
      the current tools work, not to keep an outdated solution alive.

      If the ecosystem has moved to parquet-backed, memory-mapped datasets,
      the course follows. `walk_dir`, `iter_valid_paths`, `load_image`,
      `FileTypes` and the PIL timing cells are **cut**.
    what_replaces_it: >
      Start from a simple HF dataset, then teach the iterator mechanics that
      are still true and still worth knowing: `yield`, a shuffled index list,
      and the pointer that walks it and wraps around (the "double index"
      pattern 02_datagenerators already builds). Then show that `DataLoader`
      is that, with workers. The lesson is about iterators, not about
      directories.
    what_survives: >
      the does-not-fit-in-RAM motivation, which is pure arithmetic (cell 4
      needs no data at all) — and it gets *better*, because the honest modern
      answer is that Arrow memory-maps the file, so the dataset is not in RAM
      whether or not you wrote an iterator. That is a stronger version of the
      same point.
    counts_as: a cut, under make_room. See the cuts register.
    date: 2026-07-30

  - id: D9
    answers: "should L2 merge with L4's transfer-learning material?"
    decision: >
      Yes, but as a re-split along a better axis rather than a merge into one
      lesson. Transfer learning moves *up* into L2, and L4 becomes the search
      lesson that only becomes teachable once runs are cheap.
        - **L2 = representations.** losses -> hand-rolled convolutions -> what a
          frozen pretrained encoder gives you for free (ImageVectorizer +
          cache) -> tracked comparison. The economics land at the moment of
          maximum contrast: the student has just built a CNN by hand.
        - **L4 = search.** hypertuner + ray over head architecture, aggregator
          and augmentation on a cache, where a run takes seconds; and
          fine-tune-vs-frozen becomes a *budget* question rather than a
          separate topic.
    supporting_facts:
      - >
        L4/03_minimal_transfer_learning already teaches both modes in one
        notebook — cells 20-21 fine-tune everything, cells 25-27 freeze and
        train only `fc`. L4/04 is the frozen case again on flowers. The two
        notebooks are ~74 cells with heavy overlap; collapsing them to one is a
        win independent of the merge.
      - >
        that collapse is the make_room payment for what L2 gains.
    risk: >
      L2 becomes four topics (losses, convolutions, pretrained encoders,
      tracking). Mitigation is already available: les1.md **already** maps goal
      1.9 ("what is a loss function?") to `2_convolutions/01_losses.ipynb`, so
      the losses notebook is being taught against lesson 1's goals from lesson
      2's folder. Moving it to L1 fixes an existing inconsistency and frees L2
      in the same stroke.
    date: 2026-07-30

  - id: D10
    answers: lesson2.yml L2.Q2 — three tracking mechanisms is two too many
    decision: >
      Consolidate on **MLflow** as the single tracker. Cheaper than it looks:
      `mltrainer.ReportTypes` already has `MLFLOW` alongside TOML, TENSORBOARD
      and RAY, and `Trainer` already logs loss, every metric and the learning
      rate to it. So this is a settings change in the notebooks, not a build.
    what_happens_to_the_others: >
      TENSORBOARD stays available and is worth keeping as the zero-setup local
      option — it is one line and needs no server — but it stops being the
      thing notebooks teach. TOML rides on backlog B1 and can go with it.
      Pick one per notebook; never demonstrate two.
    aimlflow: deferred to backlog B2 — no priority.
    open: >
      where the MLflow store lives for students (the current notebook uses
      `sqlite:///mlflow.db` in the working dir) and whether runs are expected to
      be shareable. Settle in conventions.md.
    date: 2026-07-30

  - id: D11
    answers: >
      "are there pretrained timeseries models? Is that even a thing? Ideally
      something we can download like resnet, that shows the interaction between
      neural and fft — and I do not want to add GluonTS."
    finding: >
      Yes, emphatically — and no new dependency is needed, because the
      `transformers` already installed (5.12.1) ships timeseries models
      natively: **autoformer, informer, patchtsmixer, patchtst,
      time_series_transformer, timesfm, timesfm2_5**.
      Pretrained checkpoints on the hub, by downloads:
        autogluon/chronos-bolt-small ............ 13.5M
        autogluon/chronos-bolt-tiny .............  2.8M
        google/timesfm-2.5-200m-transformers ....  100k  (transformers-native build)
        ibm-granite/granite-timeseries-patchtst ..  67k
      A single Chronos checkpoint outdownloads most vision backbones. Timeseries
      foundation models are not a niche — they are the same wave that produced
      the text and image encoders this course is built on.
    the_fft_model_you_asked_for: >
      **Autoformer**, and it is already installed. Its Auto-Correlation
      mechanism is literally FFT-based — verified in
      `transformers/models/autoformer/modeling_autoformer.py:509-512`:
        query_states_fft = torch.fft.rfft(query_states, ...)
        key_states_fft   = torch.fft.rfft(key_states, ...)
        attn_weights     = query_states_fft * torch.conj(key_states_fft)
        attn_weights     = torch.fft.irfft(attn_weights, ...)  # Autocorrelation(Q,K)
      Four lines of `torch.fft` sitting where the attention scores would
      normally be. That is the neural-meets-spectral interaction, readable in
      one screen, in a library the course already depends on.
    decision: >
      **No GluonTS.** The phase_3 story runs on transformers alone:
        - TimesFM 2.5 / Chronos-Bolt as *frozen encoders*, downloaded like
          resnet, cached, small head on top — the exact same shape as the
          image and text lanes.
        - Autoformer as the read-the-source model for the FFT interaction.
        - N-BEATS' interpretable seasonality block **hand-rolled** — it is a
          linear projection onto a Fourier basis, small enough to write in a
          cell, and it is the "improve where needed" half of the north star.
          A dependency would hide exactly the thing worth seeing.
      Revisit GluonTS only if phase_3 needs its probabilistic-loss machinery
      and hand-rolling it proves worse — decide with code, not in advance.
    date: 2026-07-30

  - id: D12
    answers: Q8
    decision: >
      Course caches are published under the **`pttrn-io` organisation**
      (https://huggingface.co/pttrn-io), created 2026-07-31. Not the personal
      `pttrnio` account. Every hardcoded repo id in the course points here.
    why_an_org: >
      co-teachers must be able to re-upload a cache, and the caches should
      outlive any one personal account. The deciding constraint is that the Hub
      has **no convert-user-to-organisation path** — unlike GitHub, you create a
      new org and transfer repos into it, and a transfer changes the URL. So the
      choice was only free before the first publish. It was made there.
    why_the_hyphen: >
      users and organisations share one global namespace on the Hub, so
      `pttrnio` was unavailable — it is held by the personal account. `pttrn-io`
      is the org. The near-identical names are a footgun: check the hyphen when
      a `snapshot_download` 404s.
    state_at_decision: >
      the org is empty. Creating it publishes nothing; the pilot upload is
      P0.3's remaining work and has not happened yet.
    already_applied:
      - docs/publishing-caches-to-huggingface.md — §2 rewritten from an open
        question into the settled location; all 9 example repo ids re-pointed
      - notebooks/1_pytorch_intro/07_vectors.ipynb — CACHE_REPO
      - notebooks/2_convolutions/02_pretrained.ipynb — CACHE_REPO
    date: 2026-07-31

# -----------------------------------------------------------------------------
# What each addition displaces. Enforced by the make_room principle: a phase
# that adds material without a row here is not ready to start.
