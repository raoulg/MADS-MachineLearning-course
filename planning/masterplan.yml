# =============================================================================
# MADS-MachineLearning-course x VectorMesh — masterplan
#
# Purpose: high-over overview of the refactor from "handroll every architecture
# with mads_datasets + pytorch" to "compose pretrained vectorizers, cache them,
# and do the interesting work at the vector level".
#
# This file is the agreement on *direction and ordering*. Per-lesson refactor
# plans (planning/lesson1.yml, lesson2.yml, ...) are only written after this
# masterplan is approved.
# =============================================================================

