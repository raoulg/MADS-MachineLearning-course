# -----------------------------------------------------------------------------
# The pedagogical stance we are moving to. Every task below should be
# justifiable from one of these; if it isn't, it is scope creep.
# -----------------------------------------------------------------------------
principles:
  - id: north_star
    text: >
      **Use pretrained models where you can, improve where you must.** The
      skill being taught is combining and creating *with* foundation models, at
      the vector level. That is the state of the art the students are walking
      into, and it is what the course exists to teach — not a survey of
      architectures they will never write from scratch again.
    implication: >
      This is the criterion that settles make_room arguments. Hand-rolled
      implementations earn their place only when they (a) explain what is
      inside a frozen model, or (b) serve the "improve where needed" half —
      i.e. the heads, fusions and gates the student actually builds. Anything
      that is neither is a candidate cut.
  - id: handroll_once_then_reuse
    text: >
      Keep exactly one hand-rolled implementation per architecture family
      (dense, conv, recurrent, attention, autoencoder) — understanding what is
      inside a frozen encoder is a learning goal. Immediately after it, show
      the same task solved on cached vectors, so the student *feels* the cost
      difference instead of being told about it.
  - id: embed_once_reuse_many
    text: >
      Expensive encoding happens once, by whoever has the hardware, and is
      published as an artefact. Everything the student iterates on is a small
      head on frozen vectors, minutes on a laptop CPU. (vectormesh docs 1.1)
  - id: tensor_ladder_is_the_spine
    text: >
      (D) -> (C,D) -> (B,D) -> (B,C,D) -> (B,K) becomes shared course notation,
      introduced in 0-baseline/1_pytorch_intro and reused verbatim in every
      later lesson. Shape errors (jaxtyping/beartype) are teaching material,
      not noise. (vectormesh docs 1.3, 2)
  - id: cache_is_a_contract
    text: >
      metadata.json is the public API of a dataset. Students learn to read a
      cache's metadata *before* writing model code, and learn to publish one.
      (vectormesh docs 1.7)
  - id: designed_vs_learned
    text: >
      The core intellectual move of the course: shift a decision across the
      designed/learned line and measure it. regex features vs embeddings,
      MeanAggregator vs AttentionAggregator, fourier features vs learned
      patch embeddings. (vectormesh docs 8, cross-cutting thread 2)
  - id: composition_over_configuration
    text: >
      Architecture design = combining small shape-checked blocks. "What if I
      fuse these two streams here?" must be a three-line change and a
      one-minute run. Ablation, not narrative, settles design questions.
  - id: make_room
    text: >
      This refactor is a shift in abstraction, not an addition to the syllabus.
      The lesson count and the hours per lesson are fixed, so anything new
      displaces something old. Every phase that adds material must name what it
      cuts — tracked in the `cuts` register below. "We will also cover X" is not
      an acceptable plan item.
  - id: laptop_feasible
    text: >
      Every notebook must run on a CPU laptop within a lesson's time budget,
      given a downloadable cache. GPU is optional and only for building caches.

