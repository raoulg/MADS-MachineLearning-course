          and run one candidate through windowing + a GRU baseline before
          committing. Start with the monster-monash org (PAMAP2 verified) and
          OpenWatch. Affects three notebooks (L3 exercise, L4 hypertuner, L5
          attention-on-gestures), so decide once and change all three together.
        touches: [L3, L4, L5]
        deliverable: a shortlist with measured sizes + one tested baseline
      - id: P2.3
        title: EEG exercise dataset — mirror or inline the download
        status: >
          RESOLVED to **inline**, 2026-08-01. Both URLs verified live today
          (HTTP 200): the original
          `archive.ics.uci.edu/ml/machine-learning-databases/00264/EEG%20Eye%20State.arff`
          and the newer `.../static/public/264/eeg+eye+state.zip`. So this is
          three lines of `urllib.request.urlretrieve` and no new artefact —
          no mirror to pttrn-io needed.
        detail: source identified as UCI dataset 264 (CC BY 4.0). Either mirror
          the .arff to pttrn-io or replace `datatools.get_file` with urllib.
        touches: [notebooks/5_attention/08_excercise.ipynb]
        effort: S
      - id: P2.4
        title: L2 — add the frozen-encoder counterpart to the hand-rolled CNN
        detail: same fashion/flowers task, ImageVectorizer + Serial head; make
          the wall-clock and parameter-count comparison explicit. This is the
          embed_once_reuse_many lesson, and it lands right after the student
          has hand-rolled convolutions, which is the strongest possible moment.
      - id: P2.5
        title: L4 — hypertune heads on a cache instead of models on raw data
        status: >
          PLANNED 2026-08-01 in planning/lesson4.yml, cell by cell, with the
          economics measured rather than assumed. The task's premise holds and
          then some: a 5-epoch trial costs **1.2 s** on the flowers cache
          against **159 s** for the same trial on pixels and **135 s per epoch**
          to fine-tune resnet18 (CPU). A 24-trial ray search over the head is
          85 s wall clock.
          Two things the task did not anticipate. **Ray's own per-trial process
          overhead (~2-3 s) is larger than the trial it schedules**, which turns
          goal 4.3 ("what is ray for?") into a measurement with a boundary
          instead of a slogan — new material, and the best thing in the lesson.
          And the notebook does not run at all right now (P0.7).
          Blocked on P0.7 and on three owner decisions (lesson4.yml D19-D21).
        detail: ray/hypertuner search over head architecture + aggregator +
          GaussianNoise sigma on a fixed cache; recast 03/04 transfer-learning
          notebooks as fine-tune vs frozen-features (cost, data efficiency).
        correction: >
          "aggregator" does not apply here — an image is one vector, so there is
          no chunk axis to aggregate over (lesson2.yml vectormesh_usage). The
          searchable dimensions are head width and depth, GaussianNoise sigma,
          learning rate, and — the interesting one — the *encoder*, which is the
          only dimension that costs a caching pass to sample rather than a
          second (lesson4.yml E2).
      - id: P2.6
        title: L5 — the context window is a budget
        status: >
          REWRITTEN by D18 (2026-08-01). The original text — "chunked
          Vectorizer -> FixedPadding/DynamicPadding -> aggregator ablation on
          cached IMDB" — turned out to describe L1/07_vectors, which shipped on
          07-31. Planned cell by cell in planning/lesson5.yml.
        detail: >
          Keep the hand-rolled attention (02_reweighing, 03_transformer). Then,
          on a **long-document** cache (D17 — IMDB does not chunk; 86% of its
          reviews are one chunk), walk the ladder that only exists once
          documents are long: first-chunk-only (= truncation) -> mean over
          chunks -> AttentionAggregator -> the student's own TransformerBlock
          over the chunk axis. Report score, parameters, seconds and *how much
          of the document each rung reads*.
          05_imdb_preprocessing + 06_imdb_attention collapse into this one
          notebook; 07_metric moves onto the same corpus and loses its
          Fashion-MNIST scaffolding.
        touches: [L5]
        superseded_text: >
          "...aggregator ablation (mean / masked mean / attention / RNN) on
          cached IMDB. Merges 05/06 into the vector-level story and directly
          reuses vectormesh's notebook-1 question about 3D tensors with varying
          chunk counts." The 3D-tensor question is still asked — on chunk
          counts that vary from 1 to 237 instead of from 1 to 2.
    exit_criteria:
      - >
        zero mads_datasets imports in the repo, every replacement run at least
        once, and only then the dependency is dropped from pyproject.toml (D2)
      - >
        each of L1..L5 has at least one notebook that trains on a VectorCache —
        **needs rewording**, see lesson3.yml L3.Q3: L3 has no expensive encoding
        in phase_2, so a cache there is ceremony. Proposed: "every lesson loads
        from the hub, and trains on a cache wherever encoding is expensive
        enough to be worth caching".
      - every cache a student needs is on the hub with a filled-in dataset card
      - "[x] one aggregator ablation exists as a graded exercise — MET by
         L1/07_vectors E1 (mean vs masked mean), 2026-07-31. See D18: this was
         written expecting L5 to supply it, and L1 got there first."

  - id: phase_3
    name: New datasets unlock new architectures
    goal: the timeseries lane gets the same "pretrained encoder + small head"
      treatment as text and images — which is where the genuinely new content
      is (probabilistic forecasting, fourier features, patch embeddings).
    effort: L
    depends_on: [phase_2]
    rationale: >
      Once L3 loads from Monash TSF, forecasting stops being a single toy
      series and becomes a modality. The designed/learned line reappears in a
      new place: fourier/statistical features (designed, transparent) vs patch
      or TSFM embeddings (learned, opaque) — structurally the same lesson as
      regex-vs-embeddings in L1, which makes it cheap to teach and satisfying
      to recognise.
    tasks:
      - id: P3.1
        title: Probabilistic forecasting notebook
        detail: >
          point forecasts -> distributions. Quantile/pinball loss, Gaussian
          NLL (DeepAR-style), and calibration. vectormesh already ships MAE
          and MASE metrics, so the metric side is half-built.
        new_notebook: notebooks/3_recurrent_networks/05_probabilistic.ipynb
      - id: P3.2
        title: Fourier / spectral features as a designed vectorizer
        detail: FFT magnitudes, seasonal-harmonic features, wavelets as a
          hand-designed feature stream — the timeseries analogue of
          RegexVectorizer, fused with a learned stream via Parallel +
          Concatenate2D (exactly vectormesh's notebook-2 pattern).
        needs: vectormesh extension VM.2
        resolved_by: D11 — transformers ships it; no GluonTS
        check_in_L3:
          question: "does a model already combine low-level Fourier with a
            higher-level neural approach?"
          answer: >
            Yes — **N-BEATS** (Oreshkin et al., 2019) is exactly that. Its
            *interpretable* variant constrains blocks to explicit basis
            functions: a polynomial basis for trend and a **Fourier basis** for
            seasonality. Its *generic* variant learns the basis instead. That
            pair is the designed-vs-learned move of this course, inside a single
            architecture — which makes it an unusually good teaching model: run
            both variants, compare, and the ablation is built into the paper.
          successors_and_relatives: >
            N-HiTS (multi-rate sampling, N-BEATS successor); Autoformer
            (auto-correlation computed via FFT); FEDformer (frequency-enhanced,
            Fourier/wavelet basis); TimesNet (FFT to find dominant periods, then
            2D convolutions); FiLM (Legendre/Fourier projections). All variations
            on "put a spectral prior in front of a neural model".
          gluonts_is_not_a_model: >
            GluonTS is Amazon's probabilistic-forecasting **library**, not an
            architecture. The `start` / `target` / `feat_static_cat` /
            `feat_dynamic_real` / `item_id` schema we found in the Monash
            parquet *is* its data convention — which is why Monash is the right
            catalog for this phase, and why the convention is worth knowing even
            though we are not taking the dependency (D11). "GluonTS or N-BEATS?"
            is a category error students will hit; clear it up in one sentence.
          how_we_teach_it: >
            hand-roll the interpretable seasonality block (D11) — a linear
            projection onto a Fourier basis, one cell — and read Autoformer's
            four lines of torch.fft next to it. Designed basis vs learned basis,
            in code the student can see all of.
          verify_before_teaching: >
            whether the hand-rolled block trains on CPU at 73k daily points, and
            whether TimesFM 2.5 / Chronos-Bolt embedding of the windowed series
            fits the compute budget (Q5).
      - id: P3.3
        title: Timeseries foundation models as frozen vectorizers
        status: >
          PILOTED 2026-08-01, and it changed shape — see D15/D16 and
          planning/lesson3.yml C9-C11. Three things are now measured rather
          than assumed:
          (1) `google/timesfm-2.5-200m-transformers` loads on the **installed**
              transformers 5.12.1 with no new dependency, 199M params, 925 MB,
              **162 windows/s on CPU**; `TimesFm2_5Model` returns
              `last_hidden_state` (B, 16, 1280) plus loc/scale — a `(C, D)`
              vectorizer that is also natively probabilistic.
          (2) zero-shot **wins outright** (0.140 vs 0.216 for the best trained
              model) — the north star, demonstrated.
          (3) the frozen-embedding + head route **loses** (0.499), and the
              storage ratio predicts it: a 40x expansion rather than the ~100x
              compression images give. So the notebook's middle point is a
              failure to diagnose, not a win to admire — which is better
              material, and it needs saying in the plan so nobody "fixes" it.
          Also: `ibm-granite/granite-timeseries-patchtst` hardcodes 7 input
          channels and raises on univariate input; `autogluon/chronos-bolt-small`
          loads via AutoModel as a bare T5Model, which is a trap — its patching
          and quantile head live in the `chronos-forecasting` package.
          Add D16's contamination check as the fourth beat of the notebook, and
          take the honest zero-shot number on a GiftEval series.
        detail: >
          The timeseries lane gets the *same* treatment as text and images:
          download a pretrained encoder like a resnet, run it once, cache the
          vectors, train a small head. Teaching point: zero-shot forecast vs
          frozen-embedding + trained head vs hand-rolled GRU — three points on
          one cost/quality curve.
        models: >
          `google/timesfm-2.5-200m-transformers` (transformers-native, no new
          dependency) and `autogluon/chronos-bolt-small` / `-tiny` (13.5M and
          2.8M downloads). `ibm-granite/granite-timeseries-patchtst` for the
          patch-embedding variant. All verified present on the hub 2026-07-30.
        confidence: >
          existence and availability verified; which is laptop-feasible for the
          one-time *caching* pass must be measured before committing (Q5).
        needs: vectormesh extension VM.1
        note: >
          this is the notebook that answers "is a pretrained timeseries model
          even a thing" — and the download counts answer it before any code
          runs. Put them on a slide.
      - id: P3.4
        title: (optional) audio as a fourth modality
        detail: wav2vec2 / AST embeddings; same Collate + Serial path. Only if
          there is room — flag as an optional extension, not core.
        priority: low

  - id: phase_4
    name: VectorMesh library extensions (upstream work, other repo)
    goal: the course should not carry glue code that belongs in the library.
    effort: M-L
    depends_on: [phase_3 design decisions]
    note: these are tasks in /Users/rgrouls/code/courses/vectormesh, listed
      here because the course lessons block on them.
    tasks:
      - id: VM.1
        title: TimeSeriesVectorizer
        detail: >
          window/patch a series -> (C, D) per item, mirroring the text
          Vectorizer's chunking (context_size/stride/overlap, chunk_sizes in
          metadata). Backends: patch-embedding of raw windows, or a frozen
          TSFM encoder. This single class makes the whole timeseries lane
          reuse the existing Collate/padding/aggregation stack unchanged.
      - id: VM.2
        title: FourierVectorizer (designed features for series)
        detail: same two-function protocol style as RegexVectorizer, and
          chunk-aligned like ChunkedRegexVectorizer so the designed and
          learned streams stay row-aligned.
      - id: VM.3
        title: Forecasting losses/heads
        detail: QuantileLoss and a Gaussian/Student-t NLL head; MASE already
          exists in components/metrics.py.
      - id: VM.4
        title: SSL training utilities
        detail: InfoNCE loss, momentum/EMA encoder wrapper, feature-space
          augmentation beyond GaussianNoise, and a "wrap your trained encoder
          as a BaseVectorizer" adapter so a student-trained encoder can fill a
          VectorCache like any pretrained one. Needed by phase_5.
      - id: VM.5
        title: Cache publish/fetch helpers
        detail: push_to_hub / from_hub for a VectorCache folder, so P0.3 is a
          one-liner instead of a course-specific script.

  - id: phase_5
    name: New lessons — self-supervised learning and building your own vectorizer
    goal: close the loop. The course spends 5 lessons consuming frozen
      encoders; this is where students make one.
    effort: L
    depends_on: [phase_4 VM.4, phase_2]
    rationale: >
      L6 (autoencoders/VAE) already trains an encoder, inspects a latent space
      and queries embeddings — it is 70% of an SSL lesson already. Extending it
      is cheaper than a greenfield lesson and it makes the whole course
      self-consistent: reconstruction -> contrastive -> predictive-in-
      representation-space is one ladder of "what signal do we learn from?".
    tasks:
      - id: P5.1
        title: Extend L6 with contrastive SSL (SimCLR/MoCo)
        detail: >
          augmentation as the definition of invariance, InfoNCE, negatives,
          momentum encoder and why it exists. Evaluate with a *linear probe on
          a cache* — the same evaluation protocol the course has used since L1,
          which is the punchline: linear probing was never a toy, it is how
          representation quality is actually measured (vectormesh docs 1.1).
        placement_options: [extend notebooks/6_unsupervised, new notebooks/9_selfsupervised]
        depends_on: [Q4]
      - id: P5.2
        title: Predictive SSL — I-JEPA / JEPA-style
        detail: predict *in representation space* instead of pixel space;
          contrast with the autoencoder's pixel reconstruction loss and with
          contrastive negatives. Masking strategy as the design choice.
        priority: optional extension (flagged as such in the lesson, per the
          original request)
      - id: P5.3
        title: Capstone — publish your own cache
        detail: >
          train an encoder with SSL -> wrap it as a BaseVectorizer -> build a
          VectorCache with honest metadata -> hand it to another student who
          trains a head on it and reports a linear-probe score. Graded on the
          artefact and its metadata, not only on the accuracy.
        note: strongest candidate for the end-of-course assignment; see Q6.
      - id: P5.4
        title: Reconcile the assignment arc / rubric
        detail: vectormesh docs 8 has a 5-stage assignment arc (reproduce ->
          ablate -> add a stream -> justify a gate from the paper -> build
          something new and defend it with an ablation). Map it onto the
          existing rubrik-ml.pdf and exam.
        depends_on: [Q6]

  - id: phase_6
    name: Course-level consistency pass
    goal: the supporting material says the same thing the notebooks do.
    effort: M
    depends_on: [phase_1, phase_2, phase_5]
    tasks:
      - id: P6.1
        title: Rewrite references/leerdoelen/les1..les8.md
        detail: >
          learning goals currently name mads_datasets/datastreamers and
          hand-rolled architectures. Add: reading a cache's metadata, choosing
          where to aggregate, designed-vs-learned features, shape contracts.
      - id: P6.2
        title: Presentations deep_learning_1..8.pdf
        detail: slides will lag the notebooks; list which decks need which
          change (probably 1, 3, 4, 5, 6).
      - id: P6.3
        title: Exam and rubric alignment
        detail: >
          exam-2026-06-06 tests the old arc. Draft new question types: read a
          metadata.json and predict the tensor shapes; given a pipeline,
          say where information is destroyed.
      - id: P6.4
        title: README + project organisation
        detail: artefacts/cache section, HF hub usage, compute expectations,
          Intel-Mac note still valid.
      - id: P6.5
        title: (optional) L7 graphs — kNN graph over cached vectors
        priority: low

# -----------------------------------------------------------------------------
# Nice to have. Nothing depends on these; do them if a phase finishes early,
# and drop them without ceremony if not.
# -----------------------------------------------------------------------------
backlog:
  - id: B1
    title: tomlserializer — record component class names, or drop it entirely
    priority: lowest
    detail: >
      It already works on vectormesh pipelines (verified: the 2026-07-30 run
      wrote a sensible model.toml with hidden_size/out_size and nested
      fc1/fc2). Its one blind spot is that argument-less components —
      MaskedMeanAggregator, MeanAggregator, AttentionAggregator — serialise to
      `training = true` and nothing else, because it records __init__ args, not
      class names. So model.toml cannot tell you which aggregator a run used.
      Either add class names, or drop the package and goal 1.15 with it —
      nothing in the course genuinely depends on it. Not worth blocking on
      either way.
    note: mltrainer requires tomlserializer>=0.3.0, so removal touches mltrainer.
  - id: B2
    title: aimlflow — Aim's UI on top of the MLflow store
    priority: lowest — nice to have, no priority now
    detail: >
      aimhubio/aimlflow reads an existing MLflow store and serves it in Aim's
      UI. Additive and reversible: nothing changes about what the notebooks
      log, and there is nothing to migrate if it disappoints. It is a *viewer*
      choice, not a tracking choice, so it gates nothing.
    when: after D10 has actually landed and MLflow is the single store. Not before.

