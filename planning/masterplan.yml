  - id: D4
    answers: masterplan dataset_migration.FLOWERS / lesson1.yml C1
    decision: >
      Moving the flowers notebooks to `nkirschi/oxford-flowers` (102 classes) is
      approved. It is harder than the current 5-class flower_photos, and
      transfer learning will handle it — the point of L4 is precisely that a
      frozen encoder makes a hard fine-grained task tractable, so a harder set
