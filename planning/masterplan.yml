    measured_when_deciding: >
      73.924 raw points, of which **3.240 are NaN and every one of them is
      before 1848-12-22** — leaving 62.617 clean daily points to 2020-05-31.
      Load 1.8s warm, windowing 0.01s, 30 MB windowed, ~50k training windows.
      See lesson3.yml C1-C4 for the two traps this dataset carries (its three
      "splits" are nested prefixes of one series; the NaN head) and for the
      measured spectrum that replaces the "annual and ~11-year cycles" guess
      in dataset_migration.SUNSPOTS below.
    consequences_accepted: >
      window/horizon are renumbered — 26/3 months becomes 120/30 days, with
      the horizon read off Monash's own split offsets rather than invented —
      and every score in 03_basemodels changes.
    made_by: owner, 2026-07-31
    date: 2026-07-31

  - id: D14
    supersedes: D13's choice of *series* — not its catalog, loader or licence work
    answers: >
      "maybe sunspots isn't the best dataset — if the pattern isn't there we
      can't learn it. Switch to something that better showcases probabilistic
      deep learning with autoformers?"
    decision: >
      **`pedestrian_counts` is the taught series for L3; sunspot is demoted to
      a three-cell aside.** Same Monash catalog, same parquet-branch loader —
      a config string, not a mechanism change.
    the_diagnosis: >
      sunspot is not noise: 53.7% of its variance is in the 8-14 year band. The
      problem is that this band has a period of ~3.900 days while the window is
      120, so the model is *structurally blind* to what dominates the series.
      What remains in reach is short-range autocorrelation, which a linear map
      captures optimally — so "linear ties the GRU" meant "the pattern in reach
      is linear", not "there is no pattern".
    why_pedestrian: >
      the periodicity is **inside the window** (median 59% of variance at 24h,
      24 steps inside a 168-step window), the values are **counts** so a
      probabilistic head is visibly needed, there are **66 series** so
      cross-series learning and `item_id` mean something, and a zero-parameter
      **seasonal naive scores 0.271** — which gives goal 3.11 real teeth.
    not_a_reason: >
      "a dataset where the GRU finally beats a linear model." Four were tested
      (sunspot, pedestrian, traffic_hourly, us_births) and the ranking never
      moved — see D15. That was not the goal of the switch.
    made_by: owner, 2026-08-01
    date: 2026-08-01
    planned_in: planning/lesson3.yml (C7-C11, D14)

  - id: D15
    title: What L3 actually teaches about architectures — three measured results
    status: >
      not a choice so much as a finding, recorded as a decision because it
      changes what several lessons claim. All measured 2026-07-31/08-01 on CPU;
      full protocol and caveats in planning/lesson3.yml C7, C10, C11.
    result_1_linear_beats_the_gru: >
      on all four candidate series, at ~100x less compute. On pedestrian at 15
      epochs: linear 0.199, GRU 0.242 (MAE ratios vs naive); on us_births a
      zero-parameter seasonal naive beats every trained model by 3x. This is
      the LTSF-Linear result reproduced, and today's 03_basemodels arc implies
      the opposite.
    result_2_the_downloaded_model_wins: >
      **TimesFM 2.5 zero-shot scores 0.140 against the best trained model's
      0.216**, with no training and no new dependency — `TimesFm2_5Model` and
      `TimesFm2_5ModelForPrediction` are in the installed transformers 5.12.1.
      This is the north star demonstrated rather than asserted, and it arrives
      right after the student's GRU has lost to a linear layer.
    result_3_the_frozen_feature_pattern_has_a_boundary: >
      the course's central pattern — freeze an encoder, cache the vectors,
      train a head — **loses here**: 0.499 against 0.216 for a linear layer on
      raw values. Two hypotheses were tested and both falsified (the aggregator;
      instance normalisation). Handing the head the embedding *in addition to*
      the raw window is still worse than the raw window alone.
      Rule of thumb it yields, and it is checkable before building anything:
      **if the encoder expands the data it is re-encoding, not extracting.**
      Images compress ~100x and the pattern works; a 512-step window expands
      **40x** into 16x1280 and it does not.
    consequences:
      - "R2 (the course becomes API-calling) gains its best counterexample:
         here the API call wins and the student still has to explain why, and
         when the pattern that carries L1/L2 stops working."
      - "phase_2 exit criterion 'each of L1..L5 trains on a VectorCache' should
         be reworded rather than satisfied literally — see lesson3.yml L3.Q3."
      - "P3.3 survives and improves: the middle point of its three-point curve
         losing is better teaching than all three lining up."
    date: 2026-08-01

  - id: D16
    title: Check the pretraining corpus before quoting a zero-shot number
    finding: >
      `pedestrian_counts`, `sunspot_with_missing`, `traffic_hourly` and
      `us_births` are all configs of **`Salesforce/lotsa_data`** (Moirai's
      pretraining corpus, apache-2.0, 170 configs), and
      `monash_pedestrian_counts` is a config of **`autogluon/chronos_datasets`**.
      TimesFM 2.5's model card documents no corpus at all.
    consequence: >
      the zero-shot number in D15 may be partly memorisation, and for the model
      actually measured we cannot tell. Report it with the caveat attached; do
      not quietly drop it, and do not quote it bare.
    the_teaching_point: >
      before quoting any foundation model's zero-shot score, check whether the
      test set is in its pretraining corpus — one `list_repo_files` call, and
      the answer is often yes. This is the same habit as cache_is_a_contract
      (read the metadata before writing model code), and it transfers to every
      foundation model the students will meet, in every modality.
    where_to_get_a_clean_number: >
      **`Salesforce/GiftEval`** — apache-2.0, parquet-native (no R9 problem),
      1.6 GB, 28 configs including ett1, ett2, electricity, solar, jena_weather,
      m4_*, LOOP_SEATTLE, SZ_TAXI. Built for foundation-model evaluation with
      probabilistic metrics (CRPS), which is exactly what P3.1 needs. This is
      the answer to "are there better timeseries benchmarks" — there are, and
      this is the current one.
    date: 2026-08-01

  - id: D17
    title: L5 drops IMDB for a long-document corpus
    answers: >
      "we already use imdb in lesson 1 as a demo, so maybe something more
      challenging?" (owner, 2026-08-01) — and, independently, the measurement
      that says the same thing.
    decision: >
      **IMDB leaves lesson 5.** L1/07_vectors keeps it; L5's text corpus becomes
      a long-document one, recommended `coastalcph/lex_glue` config **`scotus`**
      (US Supreme Court opinions, 13 issue areas, CC-BY-4.0, parquet-native).
      IMDB survives in L5 only as a *string literal* — the `<br />`-ridden
      review that motivates a normaliser (goal 5.11).
    the_measurement_that_forces_it: >
      **IMDB does not chunk.** Read straight out of the published cache: 86.0%
      of reviews are a single 512-token chunk, 11.5% are two. Confirmed by
      tokenising 2.000 fresh reviews — median 227 tokens, p90 584, mean 1.15
      chunks. So the `(B, C, D)` axis L5 was assigned to teach is `(B, 1, D)`
      for six documents in seven. SCOTUS measured on the same tokenizer: median
      **6.496** tokens, mean **18.3 chunks/document**, 96% multi-chunk.
    do_not: >
      shrink the encoder's context window to make IMDB chunk (measured: 88.5%
      multi-chunk at max_length=128). That is staging a scenario to keep a demo
      alive — the D8 mistake — and it costs a fresh 2h/split cache to produce
      worse data than a real long-document corpus gives for free.
    made_by: >
      owner, 2026-08-01 — direction and dataset both. **`scotus` confirmed**
      (lesson5.yml L5.Q1): the LexGLUE family carries short *and* long tasks,
      long documents are worth having in their own right, and the labels are
      imbalanced. `ecthr_a` stays measured in the plan as the multi-label
      alternative, not as a pending decision.
    date: 2026-08-01
    planned_in: planning/lesson5.yml (C2, D17)

  - id: D18
    title: P2.6 is rewritten — L1 already built it
    finding: >
      P2.6 ("L5 — chunking as the answer to the context window ... aggregator
      ablation on cached IMDB") **describes `1_pytorch_intro/07_vectors.ipynb`**,
      which shipped 2026-07-31. That notebook reads `chunk_sizes` from the
      metadata, collates with `FixedPadding`, names `(B, C, D)`, aggregates with
      `MaskedMeanAggregator` and ships the aggregator ablation as its exercise
      E1. Executing P2.6 as written would re-teach lesson 1 with a new dataset.
    decision: >
      **L1 owns chunking-as-mechanics; L5 owns chunking-as-a-decision.** P2.6
      becomes: *the context window is a budget — measure what truncation costs
      you.* The ladder is first-chunk-only (= truncation) -> mean -> attention
      -> the student's own TransformerBlock, over the same cache with one
      component swapped.
      Consequence for phase_2's exit criteria: "one aggregator ablation exists
      as a graded exercise" is **already satisfied**, by L1, and is ticked
      there.
    measured_before_deciding: >
      on a 600/300-document SCOTUS subset over three seeds: truncation 0.546
      accuracy / 0.343 macro-F1 versus 0.582-0.596 / 0.376-0.417 for every
      multi-chunk configuration — a stable gap. But the curve flattens by C=4,
      and **the learned aggregators do not beat a plain mean** (attention ties
      it; the RNN aggregator loses with 7x the parameters). Same shape as D9's
      L2 result and D15's L3 result: the expensive component has to earn its
      place, and here it does not. Full table in lesson5.yml C9.
    date: 2026-08-01
    planned_in: planning/lesson5.yml (C1, C9, D18)

  - id: D23
    title: L5 gains a composition notebook — assemble, then ablate
    answers: >
      "create new notebooks that more fully embrace the capabilities of
      vectormesh (eg with the MoE or pretrained models that vectorize the
      texts and combine that with regex)" (owner, 2026-08-01).
    decision: >
      **L5 gets `06_composition.ipynb`** and stays at 8 notebooks instead of
      shrinking to 7. It teaches the composition half of vectormesh that no
      course notebook touches — `Parallel`, `Concatenate2D/3D`,
      `CollateParallel`, `Gate -> Highway -> MoE` — on two representations of
      the same SCOTUS opinion: the frozen granite embedding and a designed,
      chunk-aligned US-legal regex stream (`legal_patterns.py`, written for
      this; vectormesh only ships the Dutch one). This is the distributable
      twin of vectormesh's own notebooks 2-3, which run on the
      non-distributable `aktes` cache.
    measured_before_deciding: >
      the fusion pipeline that first appeared to win (0.609 vs 0.584 accuracy
      at a fifth of the parameters) turned out to owe its win to a Projection
      bottleneck, not to the regex stream or the MoE — the one-variable
      ablation (same shape, embed only) scores 0.624. And accuracy vs macro-F1
      rank the wide head and the bottleneck **in opposite orders**. The
      notebook is therefore built around the ablation discipline, with the
      negative result as its centrepiece — the fourth consecutive "the
      expensive component did not earn its place" (D9, D15, D18). Full tables
      in lesson5.yml C10.
    cost: L5 breaks even on cells instead of paying a surplus; the shrink
      lever, if ever needed, is lesson5.yml L5.Q6.
    made_by: owner, 2026-08-01
    date: 2026-08-01
    planned_in: planning/lesson5.yml (C10, D23)

  - id: D22
    answers: P2.2, and lesson3.yml L3.Q1
    note_on_the_id: >
      D19-D21 are reserved by lesson4.yml's three *proposed* decisions, which
      are still open. This one is made, so it takes the next free id.
    decision: >
      **`monster-monash/WISDM` replaces the FBK smartwatch gestures dataset.**
      17.166 x 3 x 100 (five seconds at 20 Hz), 6 classes, 36 participants,
      20.6 MB, fetched with two `hf_hub_download` calls — so R9's script
      problem does not apply. This closes the last dataset gap in the plan.
    why_a_replacement_was_needed: >
      D1/licence_audit: FBK states research-and-academic use only and is silent
      on redistribution, so the existing data could not be republished. The
      course was never attached to that specific dataset; the criterion was
      pedagogical.
    verified: >
      download + load 1.8s; GRU(3->64) 2.7s/epoch on CPU; **0.902** after 3
      epochs on a random split and **0.761** on the dataset's own fold 0. The
      card states "WISDM is split based on subjects" and the repo ships
      `test_indices_fold_0..4.txt`, so that 14-point gap is a genuine subject
      leak — which turns goal 3.3 (data leakage) from an assertion into a
      measurement the student runs themselves.
    why_it_won: >
      3 channels keeps `input_size=3` unchanged, confining the edit to the
      loading cells in both lessons; smallest credible download; and it is the
      only candidate shipping the folds that make the leakage lesson free.
      Runner-up `UCIActivity` (9 channels, 47.5 MB, 0.932) has no fold indices;
      `Skoda` is the only true gesture set but is 339 MB and single-subject, so
      it has no subject split at all; PAMAP2 and Opportunity are 1.6-2.8 GB.
    accepted_costs: >
      6 classes instead of 20, so it is an easier problem; fixed-length windows, so the variable-length
      padding lesson leaves L3 (it lands in L5 on chunk counts, where
      raggedness is intrinsic — lesson3.yml L3.Q2, lesson5.yml); and a stated
      licence of "other", which is fine for students to download and use but
      means **no derived cache gets published from it** without checking (R7).
    scope: >
      L3/04 and L5/03. **Not** L4/01 — lesson4.yml moved that search onto an
      image cache, so L4 left the blocked group before this was decided.
    made_by: owner, 2026-08-01
    date: 2026-08-01
    planned_in: planning/lesson3.yml (D22, L3.5, datasets.GESTURES)

