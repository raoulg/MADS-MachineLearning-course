            snapshot_download loader from P0.3 instead.
      - id: P1.2
        status: L1 DONE 2026-07-30 (fashion_mnist in 05_classification and
          08_exercises; oxford-flowers in 03_dataloader). L2/L4/L5 open.
        title: FASHION and FLOWERS -> HF ids across L1, L2, L4, L5
        detail: >
          swap DatasetFactoryProvider for load_dataset + DatasetSchema.infer.
          Not as mechanical as it looks: mads_datasets ships preprocessed
