          Per D2 each swap is only "done" once that notebook has been run.
        touches: [L1, L2, L4, L5]
      - id: P1.3
        status: L1 DONE 2026-07-30 — 01_tensors §1.8. L0 (00_Vectorisation and
          Broadcasting) not touched yet.
        title: Introduce the tensor ladder + one shape contract in L0/L1
        detail: extend 00_Vectorisation and Broadcasting and 01_tensors with the
          ladder notation and one deliberate beartype violation to read.
      - id: P1.4
        status: DONE 2026-07-30, but per D8 rather than per this task's own text —
          the notebook was rebuilt as an iterator lesson, 52 -> 30 cells.
        title: Re-point 03_dataloader's "library version" section at HF datasets
        detail: >
          REVISED per lesson1.yml correction C2. Do NOT rewrite this notebook
          around load_dataset: it hand-builds walk_dir / load_image /
          BaseDataset against a *directory of jpgs*, and its premise is that
          the images do not fit in RAM. Keep the from-scratch build; replace
