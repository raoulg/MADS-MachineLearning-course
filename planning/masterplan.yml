cuts:
  - phase: phase_1
    adds: tensor ladder notation; the cache/metadata workflow; designed-vs-learned
    cuts:
      - >
        mads_datasets as "extra material to study" — replaced by vectormesh's
        BaseVectorizer/VectorCache, not added alongside it
      - the FileTypes enum tour in 03_dataloader (mads_datasets trivia)
      - >
        03_dataloader's whole image-folder machinery — walk_dir,
        iter_valid_paths, load_image, the PIL timing cells, BaseDataset over a
        path list (D8). Roughly cells 3-38. The single biggest cut in phase_1,
        and it pays for the ladder, the cache workflow and goals 1.16-1.18.
      - >
        the hand-rolled `BaseDatastreamer` walkthrough shrinks to the generator
        pattern it teaches; the library-specific half goes
      - >
        1.15 (toml config) is expendable if more room is needed — see backlog B1
    not_cut:
      - >
        goal 1.5 — RETAINED, reworded (D6). The advantages of streaming for big
        data is a permanent idea; only the implementation changes.
    status: agreed
  - phase: phase_2
    adds: a frozen-encoder counterpart in L2; hypertuning on caches in L4;
      chunking + aggregator ablation in L5
    cuts:
      - >
        L4/03 + L4/04 stop being two transfer-learning notebooks and become one
        fine-tune-vs-frozen comparison
      - >
        L5/05_imdb_preprocessing's hand-rolled tokenisation shrinks — the
        Vectorizer does it, and tokenisation is taught once in L5/04
      - TBD, per lesson plan
    status: draft — each lesson plan must fill its own row
    l2_accounting:
      status: >
        **L2 does not yet satisfy make_room, and this is the honest ledger.**
        Implemented 2026-07-30; the payment is still outstanding.
      added:
        - "03_pretrained.ipynb — 31 cells, entirely new"
      cut_so_far:
        - >
          03_mlflow's inline `CNN` class — ~40 lines that were a verbatim copy of
          02_convolutions' model, redefined only to be trained once
        - >
          03_mlflow's opening movement: the "let's use the mads_datasets package"
          pitch, the `for dataset in DatasetType` tour, and the paragraph
          explaining which datasets it offers (4 cells)
        - >
          03_mlflow's MLflow-versus-TensorBoard-versus-gin-config sales pitch,
          trimmed to a sentence — D10 settled that argument, so the notebook no
          longer needs to have it
        - 02_convolutions' commented-out FLOWERS variant, and its second report type
      still_owed: >
        Roughly a notebook's worth. The intended payment was L2.1 — moving
        `01_losses.ipynb` (40 cells) out to L1, where les1.md already maps goal
        1.9 to it. That did not happen (see lesson2.yml L2.1), so **until Q3 is
        answered and the move is made, L2 is one notebook heavier than it was.**
        Do not treat L2 as closed on this criterion.
      note: >
        the other half of the intended payment is the L4 collapse (D9), which
        is L2.5 and also still open. Both are cheap; neither is done.
  - phase: phase_3
    adds: probabilistic forecasting; fourier features; TSFM encoders
    cuts:
      - >
        TBD — this is the phase most at risk of violating make_room. Candidates
        are folding L3/02_1d_convolutions into the windowing notebook, and
        trimming L3/03_basemodels' model zoo.
    status: open — blocks phase_3 approval
  - phase: phase_5
    adds: SSL (contrastive, then predictive); publish-your-own-cache capstone
    cuts:
      - TBD — depends on Q4 (extend L6 vs new lesson) and Q6 (still 8 lessons)
    status: open — blocks phase_5 approval

non_goals:
  - Rewriting the course into a vectormesh tutorial; the course keeps its own
    arc, book (Understanding Deep Learning) and learning goals.
  - Removing hand-rolled pytorch entirely.
  - Making students build their own caches for large datasets by default.
  - Refactoring 0-baseline (python/classes/pydantic) or 8_extras (swarms).

