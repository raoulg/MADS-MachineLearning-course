  - id: L1
    dir: notebooks/1_pytorch_intro
    topic: tensors, datagenerators, dataloader, neuralnets, classification,
      image classification, exercises, autograd
    dataset_source: [mads_datasets FASHION, mads_datasets FLOWERS, HF stanfordnlp/imdb]
    current_state: >
      05_classfication.ipynb is mid-refactor: it already loads IMDB from HF and
      runs RegexVectorizer -> VectorCache -> Serial(NeuralNet) -> mltrainer,
      but still imports mads_datasets FASHION at the top and mixes two stories
      in one notebook.
    vectormesh_touch: heavy — this is the entry point for cache + tensor ladder.
    phase: 1

  - id: L2
    dir: notebooks/2_convolutions
    topic: losses, convolutions, mlflow
    dataset_source: [mads_datasets FASHION, mads_datasets FLOWERS (commented)]
    vectormesh_touch: medium — hand-rolled CNN stays; add the "frozen vision
      encoder + linear head" counterpart (ImageVectorizer) as the economics
      lesson, and hook mlflow/tensorboard runs to a cache tag.
    phase: 2

  - id: L3
    dir: notebooks/3_recurrent_networks
    topic: windowing, 1d convolutions, base models, exercise
    dataset_source: [mads_datasets SUNSPOTS, mads_datasets GESTURES]
    vectormesh_touch: heavy — biggest dataset gap AND the biggest opportunity
      (timeseries vectorizers, fourier features, probabilistic forecasting).
    phase: 2 (datasets) + 3 (architectures)

  - id: L4
    dir: notebooks/4_tuning_networks
    topic: hypertuner, ray, minimal transfer learning, transfer learning resnet
    dataset_source: [mads_datasets GESTURES, hymenoptera (raw dir), mads_datasets FLOWERS]
    vectormesh_touch: heavy — hypertuning on cached vectors is where
      embed_once_reuse_many pays off most visibly (search space of heads, not
      of encoders). The two transfer-learning notebooks are partly superseded
      by ImageVectorizer and should become an explicit
      fine-tune-vs-frozen-features comparison.
    phase: 2

  - id: L5
    dir: notebooks/5_attention
    topic: reweighing, transformer, attention on gestures, tokenization,
      imdb preprocessing, imdb attention, metrics, exercise
    dataset_source: [mads_datasets GESTURES, mads_datasets IMDB, mads_datasets FASHION, "local egg (EEG) dir"]
    vectormesh_touch: heavy — 04_tokenization/05_imdb_preprocessing/
      06_imdb_attention overlap directly with vectormesh's Vectorizer +
      chunking story. Keep the hand-rolled attention (02_transformer), then
      run TransformerBlock over cached chunk vectors and compare aggregators.
    phase: 2

  - id: L6
    dir: notebooks/6_unsupervised
    topic: autoencoder, VAE, latent space, embedding query/retrieval (MNIST)
    dataset_source: torchvision MNIST (local data/ dir)
    vectormesh_touch: heavy — this lesson already *builds a vectorizer* (an
      encoder producing a latent space) and already queries embeddings. It is
      the natural bridge to self-supervised learning and to "publish your own
      cache", closing the loop with vectormesh docs 1.1 ("nothing locks you
      out of step 1").
    phase: 5

  - id: L7
    dir: notebooks/7_graphs
    topic: graph intro, clusters in graphs, GNN
    dataset_source: torch-geometric builtins
    vectormesh_touch: >
      light — optional. Build a kNN graph over cached vectors, or use frozen
      text embeddings as node features. Low priority.
    phase: 6

  - id: L8
    dir: notebooks/8_extras
    topic: swarms / cellular automata
    dataset_source: none
    vectormesh_touch: none
    phase: out of scope

# -----------------------------------------------------------------------------
# mads_datasets -> huggingface datasets. `confidence` says how much to trust
# the candidate id: verified = the id is confirmed to exist (or is already used
# in a working notebook), candidate = plausible but must be loaded and checked.
# -----------------------------------------------------------------------------
dataset_migration:

  # Can we legally re-publish it under pttrn-io? Checked 2026-07-30 against the
  # source URLs in mads_datasets/settings.py.
  # Run this before a dataset enters any plan. Two of the four candidates I
  # first proposed failed one of these checks (see R9 and the SUNSPOTS row).
  selection_checklist:
    - "list_repo_files: any .py? then it is script-based and needs the parquet
      branch or a direct file download (R9)"
    - "load one row: is the schema what you assumed? frequency, units, and
      whether one row is one timestep or a whole series"
    - "licence: stated, and does it permit the redistribution you are planning
      (licence_audit below)"
    - "size: does the one-time cache build fit the compute budget (Q5)"

  licence_audit:
    - name: GESTURES
      origin: https://tev.fbk.eu/resources/smartwatch (FBK TeV), currently
        redistributed via github.com/raoulg/gestures with no licence file
      terms: >
        FBK states the data is "provided for research or academic purposes
        only" and asks for a citation (Costante et al., EUSIPCO 2014; Porzi et
        al., IMMPD 2013). Redistribution is not addressed either way, and there
        is no licence file — so hub publication is not clearly permitted.
      verdict: DO NOT self-publish without asking FBK.
      note: >
        The existing GitHub zip is already a redistribution under the same
        unclear terms; that predates this refactor but is worth knowing about.
        The same data is on TFDS as `smartwatch_gestures`, which is weak
        evidence that FBK tolerates mirroring, not permission.
      action: >
        Either mail FBK for written permission (cheap, and a good outcome
        either way), or switch to a hub-native dataset with a real licence.
        Given you are not attached to this dataset, the switch is the default.
    - name: SUNSPOTS
      origin: SIDC/SILSO (https://www.sidc.be/SILSO/DATA/SN_m_tot_V2.0.txt)
      verdict: no need to self-publish — Monash TSF already carries the same
        series under CC-BY-4.0. Use theirs and cite SILSO.
    - name: EEG eye state (L5 exercise)
      origin: UCI ML repository, dataset 264 (Rösler & Suendermann)
      verdict: safe to mirror with attribution — UCI datasets are CC BY 4.0.
        Low value though; the notebook downloads one .arff file directly, so
        the only thing lost with mads_datasets is `datatools.get_file`.
    - name: FASHION
      origin: currently a .pt in github.com/raoulg/data_assets
      verdict: no need — zalando-datasets/fashion_mnist is the official hub
        copy (MIT).
    - name: IMDB
      verdict: no need — stanfordnlp/imdb is on the hub already.

  drop_in_available:
    - name: FASHION
      used_by: [L1, L2, L5]
      candidate: zalando-datasets/fashion_mnist
      confidence: verified
      notes: 28x28 grayscale, 10 classes, same data as mads_datasets. Column
        names image/label — DatasetSchema.infer handles it.
    - name: FLOWERS
      used_by: [L1, L4]
      candidate: nkirschi/oxford-flowers (L2, L4) — see D4
      confidence: verified, parquet-native
      notes: >
        CORRECTED 2026-07-30: the course's FLOWERS was TF flower_photos, **5**
        classes, not Oxford Flowers 102. So this is a deliberate move to a
        harder dataset (D4), not a drop-in id swap — every accuracy number in
        the transfer-learning notebooks changes, and that is fine, because a
        fine-grained 102-class task is where a frozen encoder has something to
        show.
        L1/03_dataloader does not use flowers at all any more: its
        directory-walking half is cut (D8) and it runs on whatever simple HF
        dataset the lesson already has open.
    - name: IMDB
      used_by: [L1, L5]
      candidate: stanfordnlp/imdb
      confidence: verified
      notes: already migrated in 05_classfication.ipynb.
    - name: hymenoptera (ants/bees)
      used_by: [L4]
      candidate: sasha/dog-food or Javtor/rock-paper-scissors
      confidence: verified (as substitutes, not as hymenoptera)
      notes: >
        the point of the notebook is small-data transfer learning, not ants.
        Either find a hymenoptera mirror on the hub or substitute a small
        2-3 class set from vectormesh's catalog. Decide in lesson4.yml.

  gaps_needing_a_decision:
    - name: SUNSPOTS
      used_by: [L3]
      candidate: >
        two datasets, not one — SILSO monthly direct from sidc.be for the taught
        notebook, Monash TSF for the exercises and phase_3. See notes.
      confidence: tested 2026-07-30, both findings verified by loading
      notes: >
        CORRECTED. Two things I got wrong when I first wrote this row:

        1. `load_dataset("Monash-University/monash_tsf", "sunspot")` **fails on
           datasets 5.0** — the repo is script-based (monash_tsf.py + zipped raw
           data) and `trust_remote_code` no longer exists in the load_dataset
           signature. It loads only via the auto-converted parquet branch:
           `refs/convert/parquet/sunspot/{train,validation,test}/0000.parquet`,
           verified working.

        2. Monash `sunspot` is the **daily** series: 73.864 points starting
           1818-01-08, one row holding a `target` list (GluonTS convention, with
           feat_static_cat / feat_dynamic_real / item_id). The course currently
           uses SILSO **monthly** — 3240 points from 1749, with window_size=26
           and horizon=3. Those numbers mean something entirely different on
           daily data, so this is not a substitution, it is a different dataset.
      plan: >
        REVISED — go to Monash daily as the primary series. 73.864 points beats
        3.240: it is enough data for the probabilistic and spectral models that
        phase_3 wants, it arrives in the GluonTS convention those models expect,
        and it opens the other ~29 Monash series for exercises. Refactoring the
        window/horizon numbers is accepted as part of the deal, and is an
        improvement rather than a cost — daily data has structure (annual and
        ~11-year solar cycles) that monthly aggregation smooths away, which is
        exactly what a Fourier basis is for.
        Keep monthly SILSO as the fallback if the daily series turns out too
        slow on CPU; it is one urllib call and needs no mads_datasets either.
      opens_up: [probabilistic forecasting, TSFM encoders, fourier features]
      licence_note: SILSO is CC BY-NC 4.0 — redistribution for non-commercial
        use with attribution, so a course mirror is likely fine; Monash is CC-BY-4.0.
    - name: GESTURES
      used_by: [L3, L4, L5]
      candidates:
        - id: monster-monash/PAMAP2
          confidence: verified to exist; script-based (see R9)
          notes: >
            IMU (wrist/chest/ankle) activity recognition, 100Hz, 9 subjects. The
            `monster-monash` org publishes a family of these — check it for a
            closer gesture/HAR match before settling. Ships `PAMAP2.py` plus
            `PAMAP2.npy` / `PAMAP2_X.npy`, so `load_dataset` will fail on
            datasets 5.0; the .npy files are trivially fetchable with
            hf_hub_download + np.load, which is arguably nicer for a windowing
            lesson anyway (you get the raw array, not a pre-chopped schema).
        - id: OpenWatch (arXiv 2605.04791, states HF availability)
          confidence: candidate
          notes: 6-axis IMU + PPG, 59 gesture classes, 50 participants. Richer
            than the current dataset; possibly too big for a laptop lesson
            unless we distribute a cache.
        - id: publish the existing gestures data ourselves
          confidence: blocked
          notes: >
            ruled out for now by licence_audit — FBK says research/academic use
            only and is silent on redistribution. Revisit only if FBK gives
            written permission. Since the course is not attached to this
            specific dataset, prefer a hub-native replacement with a real
            licence; the selection criterion is pedagogical (multivariate
            sensor series, enough classes to be interesting, small enough to
            cache on a laptop), not fidelity to the old data.
    - name: EEG / "egg" (L5 exercise)
      used_by: [L5]
      candidate: UCI "EEG Eye State" (dataset 264), self-mirrored to pttrn-io
      confidence: verified (source identified; hub mirror is our own action)
      notes: >
        the notebook downloads one .arff straight from UCI with
        `datatools.get_file`, so the only mads_datasets dependency here is that
        one helper. Cheapest migration in the whole plan: mirror the file to a
        pttrn-io dataset repo (UCI is CC BY 4.0) or just use urllib.
    - name: FAVORITA, SECURE, IRIS, PENGUINS
      used_by: [none of the current notebooks]
      candidate: n/a
      notes: only referenced through mads_datasets' own catalog. IRIS/PENGUINS
        have obvious hub mirrors if ever needed; FAVORITA/SECURE can be dropped.

  collateral_damage:
    - item: mads_datasets.base.BaseDatastreamer
      used_by: [L1/03_dataloader, L3/03_basemodels, L5]
      replacement: >
        deleted, not relocated (D5). HF datasets + torch DataLoader +
        vectormesh Collate/OneHot, with `streaming=True` where the
        does-not-fit-in-memory point needs making. Requires P0.6 first.
    - item: mads_datasets.datatools (windowing, splits)
      used_by: [L3, L5]
      replacement: >
        `window` moves into vectormesh (D5) — it is the (C, D)-producing
        operation the library is built around, and VM.1 needs it anyway. The
        L3 notebook still hand-rolls it first, then imports the library
        version, because turning a series into rank-2 tensors *is* the lesson.
    - item: mads_datasets DatasetProtocol / factory pattern as *code to study*
      note: >
        the README currently sells mads_datasets as extra material for
        experienced students. If we drop the dependency, replace that pointer
        with vectormesh's BaseVectorizer/VectorCache as the code to study —
        arguably a better example (shape contracts, metadata, artefacts).

# -----------------------------------------------------------------------------
# PHASES — ordered so each one is shippable on its own.
# effort: S (<half day) / M (1-2 days) / L (a week+)
# -----------------------------------------------------------------------------
phases:

  - id: phase_0
    name: Conventions and scaffolding
    goal: agree the shared vocabulary and file layout before touching lessons,
      so 8 lessons do not drift into 8 dialects.
    effort: S
    tasks:
      - id: P0.1
        status: DONE 2026-07-30 — planning/conventions.md. `artefacts/**` was
          already in .gitignore.
        title: Fix the artefact/cache layout for the whole course
        detail: >
          One documented location for caches (currently a mix of
          notebooks/*/tmp/artefacts, ../../artefacts and assets/). Decide:
          repo-root artefacts/ (gitignored) + a documented download step.
          Include a naming convention: {date}_{dataset}_{modality}_{model_tag}.
        deliverable: planning/conventions.md + .gitignore update
      - id: P0.2
        status: >
          DONE 2026-07-30, and restructured on review. It lives at
          notebooks/1_pytorch_intro/tensor-ladder.md, not references/, so a
          student reading 01_tensors does not have to go looking for it.
          More importantly it is now built around the **formal/semantic split**
          rather than around the four rungs: formally a 2D tensor is a 2D
          tensor, and (C,D) vs (B,D) is a semantic distinction, not a formal
          one. The worked example is "can a CNN eat a timeseries?" — a formal
          question with a yes, which students answer semantically ("a CNN is an
          image model") and get wrong. Same permissiveness that lets Conv1d take
          a series also lets Linear silently eat (B,C,D); the difference is
          whether you meant it.
        title: Write the tensor-ladder cheatsheet used by every lesson
        detail: adapt vectormesh docs 1.3 table + mermaid into a course asset;
          reference it from each lesson README instead of re-explaining.
        deliverable: notebooks/1_pytorch_intro/tensor-ladder.md [done]
      - id: P0.3
        title: Cache distribution via the hub
        status: documented, not yet exercised
        detail: >
          Decided in D3: hub, under the pttrn-io org, one dataset repo per
          (dataset x encoder). The how-to is written
          (docs/publishing-caches-to-huggingface.md); what remains is to
          actually publish the first cache and prove the round trip.
        deliverable: docs/publishing-caches-to-huggingface.md [done]
        remaining:
          - "[x] account vs organisation — DONE 2026-07-31, D12: the pttrn-io
             org exists and is empty"
          - "[ ] publish the IMDB granite cache as the pilot — needs `hf auth
             login` first; the CLI is currently not logged in on this machine"
          - "[ ] load it from a clean machine / fresh HF cache and time the
             download"
          - "[ ] standardise the loader snippet that every notebook copies"
        depends_on: [Q5]
        blocks: >
          phase_1's last exit criterion, and the default download path in
          L1/07_vectors + L2/02_pretrained — both currently fall back to
          building a cache locally (~2h/split on CPU), which no student will do.
      - id: P0.4
        status: >
          DONE 2026-07-30 — `datasets>=4.0` and `huggingface-hub>=0.30` are now
          explicit in pyproject.toml, and the mltrainer floor is raised to
          >=0.3.2 (P0.6), which resolves now that 0.3.2 is on PyPI.
          mads-datasets stays per D2. README dependency story rewritten (this also closes P1.5).
        title: Dependency plan
        detail: >
          add `datasets` and `huggingface_hub` explicitly to pyproject.toml
          (currently both arrive transitively via vectormesh). Per D2,
          mads-datasets stays until its last use site is migrated and tested.
          Check laptop-CPU install size.
        deliverable: pyproject.toml change + note in README
      - id: P0.5
        title: Track mads_datasets use sites with a kill list
        detail: >
          one row per import site (notebook + cell), its replacement, and
          whether the replacement has been *run*. D2 makes this the gate for
          dropping the dependency, so it needs to exist somewhere concrete.
          Sites at 2026-07-30: L1/03_dataloader (FLOWERS + BaseDatastreamer),
          L1/05_image_classfication, L1/06_exercises, L2/02_convolutions,
          L2/03_mlflow, L3/03_basemodels (SUNSPOTS + datatools +
          BaseDatastreamer), L3/04_excercise (GESTURES + datatools),
          L4/01_hypertuner (GESTURES), L4/04_transfer_learning (FLOWERS),
          L5/03_Attention_gestures, L5/05_imdb_preprocessing,
          L5/06_imdb_attention, L5/07_metric (FASHION), L5/08_excercise
          (datatools). Done: L1/05_classfication.
        deliverable: planning/mads_datasets_killlist.md [done]
      - id: P0.6
        title: Fix mltrainer's per-step iterator rebuild
        status: >
          FIXED 2026-07-30 in /Users/rgrouls/code/courses/mltrainer. `Trainer`
          holds its iterator and re-`iter`s only on StopIteration
          (`Trainer._next_batch`); annotations widened Iterator -> Iterable.
          Four regression tests in tests/test_trainer_iteration.py; 51 tests
          pass, ruff + ty clean. Verified against the old behaviour: a
          shuffle=False loader gave batch [0, 0, 0, 0] before and
          [0, 16, 32, 48] after. Version bumped to 0.3.2.
          PUBLISHED 2026-07-30 as mltrainer 0.3.2 (commit fd330b6 on
          raoulg/mltrainer main). The course pins `mltrainer[tune]>=0.3.2`,
          `uv lock` resolves, and L1 was re-run against the PyPI build rather
          than an editable install. P0.6 is closed.
        severity: blocker for trusting any phase_1 number
        effort: S
        repo: raoulg/mltrainer
        detail: >
          `Trainer.trainbatches` and `Trainer.evalbatches` both call
          `next(iter(self.traindataloader))` *inside* the step loop. On an
          iterator (what `BaseDatastreamer.stream()` returns — note the
          `traindataloader: Iterator` annotation) that advances correctly. On an
          **iterable** like a torch `DataLoader` it builds a fresh iterator every
          step, so:
            - train (`shuffle=True`): a reshuffled first batch each step. Trains
              by luck, and re-permutes the whole index every step.
            - valid (`shuffle=False`): the *same first batch*, `valid_steps`
              times. Validation metrics describe one batch, not the split.
          Every DataLoader-based notebook is affected — which is all the new
          vectormesh ones. In L1/05_classfication, `valid_steps=len(testloader)`
          = 782 steps over the same 32 rows.
        fix: >
          hold the iterator on the Trainer and refresh it on StopIteration:
          `self._it = iter(loader)` once, `next(self._it)` per step, re-`iter`
          when exhausted. Backwards compatible — `iter()` on an iterator returns
          itself, so the old streamer path keeps working.
        why_it_blocks_everything: >
          this is also the answer to "will the HF/torch dataloaders perform
          better?" (D5). They will — but not while a new iterator (and, with
          num_workers>0, a new worker pool) is spun up per batch. Fix this
          first, then measure.
        verify: >
          same cache, same head: current code vs fixed, and check that the
          validation F1 changes. If it does not, valid_steps was 1.

  - id: phase_1
    name: Use VectorCache consistently where it already works
    goal: the "simplest" phase — HF datasets for drop-in cases, and the
      cache/vector-level workflow told once, properly, in lesson 1.
    effort: M
    depends_on: [phase_0]
    tasks:
      - id: P1.1
        status: DONE 2026-07-30 — now 06_vectors.ipynb
        title: Renumber and clean up 05_classfication.ipynb
        detail: >
          REVISED per lesson1.yml correction C3 — there is no split to do. The
          hand-rolled fashion story already exists complete in
          05_image_classfication.ipynb; 05_classfication was a copy of it that
          became the IMDB/vectormesh notebook. So: rename it to 06_vectors.ipynb
          (two notebooks currently share the number 05), open it with the cache
          metadata instead of the model, fix the broken cache-loading fallback,
          and cut the duplicated cells.
        touches: [notebooks/1_pytorch_intro/05_classfication.ipynb]
        deliverable: planning/lesson1.yml [done]
        known_issues:
          - >
            cell-24 wraps `next(artefacts.glob("*imdb_train_embed"))` in a
            `try/except VectorMeshError`, but an empty glob raises
            StopIteration, so the CREATED=False fallback never triggers for a
            student who has no cache yet — which is every student. Fix as part
