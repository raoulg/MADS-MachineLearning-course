# =============================================================================
# Lesson 4 (notebooks/4_tuning_networks) — refactor plan
#
# Parent: planning/masterplan.yml (phase_2 P2.5, decisions D9/D10, L2.5)
# Kill list rows: planning/mads_datasets_killlist.md § "Lesson 4"
#
# D9 made L4 "the search lesson that only becomes teachable once runs are
# cheap". This plan checks that claim by measuring it, and it turns out to be
# both truer and more complicated than D9 assumed: a trial on a cache costs
# **1.2 seconds** against **159 seconds** for the same trial on pixels, but
# ray's own per-trial process overhead is ~2-3s, i.e. larger than the trial it
# is scheduling. That inversion is the most interesting thing in the lesson and
# it is new material, not a footnote.
#
# It also found that **L4 does not run today**: `ray.train.report` now raises
# inside a Tune function, so every trial in 01_hypertuner errors, and so does
# every trial in hypertune.py via mltrainer's `ReportTypes.RAY`. See C1.
# =============================================================================

