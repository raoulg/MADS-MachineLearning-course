decisions:

  - id: D19
    to_be_added_to: masterplan.yml decisions
    proposed: not yet made — this is the L4 handover call D9/L2.5 left open
    answers: "what does L4 keep, now that L2 owns the frozen-encoder story?"
    decision: >
      **L4 becomes the lesson about the cost of an experiment.** The search
      moves onto cached vectors, where a trial is 1.2 s (C3), and the
      transfer-learning material collapses from two notebooks into one
      *fine-tune vs frozen* comparison framed as a budget question — which is
      what D9 said, now with the numbers to size it.
      The expensive search does not disappear; it moves into `hypertune.py`,
      where it becomes the demonstration of *why* a long search belongs in a
      script and not in a notebook. So the lesson holds both regimes and the
      contrast between them is the content.
    what_that_costs: >
      L4/03_minimal_transfer_learning + L4/04_transfer_learning_with_resnet
      (74 cells, one idea) become one notebook of ~30. That is the payment
      masterplan `cuts.phase_2.l2_accounting.still_owed` has been waiting for
      since 2026-07-31.

  - id: D20
    to_be_added_to: masterplan.yml decisions
    proposed: not yet made
    answers: >
      dataset_migration.hymenoptera — "find a hymenoptera mirror on the hub or
      substitute a small 2-3 class set. Decide in lesson4.yml."
    decision: >
      **Neither. Hymenoptera dies without a replacement.** The small-data axis
      is carried by *subsetting the flowers cache* — 10 images per class is one
      `.select()` on a cache that is already published and already used by L2.
    why: >
      the notebook's point is small-data transfer learning, not ants. A second
      dataset costs a download, a second normalisation convention and a second
      set of numbers that cannot be compared with L2's, and it buys nothing the
      subset does not. Subsetting is also the honest version of the experiment:
      same data, same encoder, same head, one axis moved — which is what the
      course means by an ablation.
    it_also_kills: >
      `get_hymenoptera()` (a bespoke requests+zipfile downloader writing into
      `~/.cache/mads_datasets/`, a directory owned by a package the notebook
      does not import — the kill list calls it "a dependency in disguise") and
      `torchvision.datasets.ImageFolder`, which is the last folder-walking
      loader in the course after D8 removed the others.

  - id: D21
    to_be_added_to: masterplan.yml decisions
    proposed: not yet made
    answers: "`tune.run` or `tune.Tuner`?"
    decision: >
      **`tune.Tuner` + `tune.report`.** Both are verified working today (C1,
      C4); `tune.run` is legacy, and its own signature already carries seven
      deprecated parameters. Since C1 forces every trial function to be edited
      anyway, migrating the driver at the same time costs one pass and stops
      the course teaching an API on its way out.
    caveat: >
      `ExperimentAnalysis` (02_ray, reading a finished run off disk) still
      exists in 2.55 and still works — but the Tuner-native path is
      `tune.Tuner.restore(...).get_results()`. Pick one per notebook and say
      which; do not show both.

