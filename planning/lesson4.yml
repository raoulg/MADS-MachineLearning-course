corrections:

  - id: C1
    severity: >
      blocker, and it is not caused by this refactor — **L4 is broken on the
      current dependency set**, today, before anything is touched.
    finding: >
      `ray.train.report` **raises** when called inside a function passed to Ray
      Tune. Verified on ray 2.55.1 with a trial that contains nothing but a
      report call:
        DeprecationWarning: `ray.train.report` is deprecated when running in a
        function passed to Ray Tune. Please use the equivalent `ray.tune` API
        instead. (ray-project/ray#49454)
      Two sites are hit:
        - `01_hypertuner.ipynb` cell 16 — `ray.train.report({...})` at the end
          of every epoch of `tune_model`. Every trial errors, so `tune.run`
          ends in `TuneError: Trials did not complete` and every cell after it
          (contour plots, parallel plots, best_config) fails on empty results.
        - `mltrainer.trainer.RayReporter.report` (trainer.py:73) calls the same
          function, so **`ReportTypes.RAY` is broken**, which takes out
          `hypertune.py` — the reference implementation the graded exercise
          tells students to copy.
    the_reason_nobody_noticed_the_message: >
      when torch is loaded in the worker, the raise is followed by a SIGSEGV in
      torch's thread-local teardown (`ConcretePyInterpreterVTable::decref` at
      `_pthread_exit`), so ray reports "Worker exit type: SYSTEM_ERROR ...
      worker crashed unexpectedly" and the actual DeprecationWarning never
      reaches the driver. The pure-python reproduction is what shows the cause;
      that is worth knowing before anyone spends an afternoon on the segfault.
      It is also almost certainly the L4 half of the "5 pre-existing
      notebooktester failures in lessons 0, 4 and 7" recorded in lesson2.yml
      L2.6.
    fix:
      notebook: "`tune.report({...})` — verified working, one word changed."
      mltrainer: >
        `RayReporter.report` must call `ray.tune.report`. One line, plus a
        release, plus a floor bump in pyproject.toml. **This is a P0.6-class
        upstream blocker**: it lives in another repo, it gates the graded
        exercise, and until it ships a student cannot run `hypertune.py` at
        all. See L4.Q4 for the alternative (drop `ReportTypes.RAY` and report
        by hand), which is cheaper but loses the mltrainer integration the
        lesson currently sells.
    verified: 2026-08-01, ray 2.55.1 / mltrainer 0.3.4 / torch 2.12.1 / py3.13

  - id: C2
    severity: the lesson currently asserts things its own output cannot support
    finding: >
      `01_hypertuner.ipynb` runs at **MAX_EPOCHS=1, N_EXPERIMENTS=2** (cell 3),
      and cell 2 apologises for it: *"The reason I am setting this low is
      because i automated the testing of the notebook"*. At those settings:
        - the random-search contour plot is drawn from **2 points**
        - the bayes contour plot is drawn from **2 points**, of which the
          searcher spends its first 5 on random exploration — so nothing
          bayesian has happened yet
        - hyperband cannot abort anything, because `max_t=MAX_EPOCHS=1` means
          every trial is already at its grace period
        - only grid search gets 18 trials, because its count comes from the
          grid (6 x 3) and not from `N_EXPERIMENTS`
      The markdown then reads results off those plots: "bayes really focuses on
      the promising areas", "the search space is sort of randomly sampled",
      "note how the mean scores are sort of randomly distributed", "if you
      study the iter column, you will see that some runs have been stopped
      early". None of that can be true at n=2.
    consequence: >
      the student is asked to believe a claim the notebook demonstrably does
      not demonstrate, and the *only* honest fix available today is "set it to
      18 and wait" — which on the gestures GRU is tens of minutes.
    why_it_belongs_in_this_plan: >
      it is the exact failure D9 predicted: hypertuning is unteachable while a
      trial is expensive. On the cache a 24-trial search finishes in **85
      seconds** (measured, C3), so the honest defaults become the *cheap*
      ones and the apology cell is deleted rather than reworded.

  - id: C3
    date: 2026-08-01
    severity: this is the measurement the lesson gets rebuilt around
    finding: >
      Three cost regimes, all on oxford-flowers (4000 train / 1000 test, 102
      classes), CPU, identical trainer, 5 epochs:

        regime                              per trial   what you tune
        ----------------------------------  ----------  -----------------------
        head on cached vectors (1 thread)       1.2 s   units, layers, sigma, lr
        CNN on pixels 64x64 (1 thread)        159   s   filters, units, lr
        fine-tune resnet18 224px (8 threads)  675   s   (135 s/epoch)

      i.e. **133x** between the two ends of the same lesson, and the frozen
      head is the one that reaches 0.838 accuracy while the from-scratch CNN
      is still under 0.2 at that budget (lesson2.yml runtime_budget).
      A full 24-trial random search over the head, run through ray on 8 CPUs:
      **85 seconds wall clock**, accuracy spread 0.010 to 0.838.
    what_it_means_for_the_lesson: >
      every claim in the search-algorithm tour becomes checkable inside a
      notebook run, and the *comparison between regimes* becomes the spine of
      the lesson rather than an aside. "Which search algorithm?" is a smaller
      question than "which regime are you searching in?", and the second one is
      the one that moves the wall clock by two orders of magnitude.
    the_landscape_is_real_now: >
      from the 24-trial run: every `layers=3` trial with `lr>4e-3` collapsed to
      chance (0.010-0.111), while `layers=1` with `lr<1e-3` gave 0.774-0.838.
      That is a legible interaction between depth and learning rate on an
      honest contour, and it is the plot C2 says the notebook cannot currently
      draw.

  - id: C4
    date: 2026-08-01
    finding: >
      **Ray's per-trial overhead is bigger than the trial.** Measured:
        - the head trains in 1.2 s in-process (1 thread, 5 epochs)
        - 8 *trivial* trials (a linear layer on random noise) through
          `tune.Tuner` on 4 CPUs: 27.4 s
        - 24 real head trials on 8 CPUs: 85.0 s
      Each trial runs in a fresh worker process that re-imports torch,
      datasets and vectormesh; that fixed cost is ~2-3 s and it dominates.
    do_not_hide_it: >
      it answers goal **4.3 ("what are the advantages of ray")** with a
      measurement instead of a slogan, and the answer has a shape:
      ray buys *parallelism across trials* and *scheduling* (hyperband,
      searchers, fault tolerance, a cluster). It costs a process per trial. So
      it wins when a trial is long or numerous, and it loses to an in-process
      loop — or to the `hyperopt` search L2 already ran in `03_mlflow` — when a
      trial is a second. Have the student measure both and pick.
    a_second_measurement_worth_taking: >
      `torch.set_num_threads(1)` was *faster* than 8 threads for the head
      (1.2 s vs 1.6 s). Small models do not use wide intra-op parallelism, so
      one core per trial is not a compromise — it is the better setting, and it
      is why N cores means N trials at full speed here. On the pixel CNN the
      arithmetic goes the other way; that contrast is worth one cell.

  - id: C5
    date: 2026-08-01
    severity: small, real, and it fires only under parallel trials
    finding: >
      `mltrainer.settings.TrainerSettings.check_path` is a check-then-create:
        if not logdir.resolve().exists(): logdir.mkdir(parents=True)
      Two ray workers constructing `TrainerSettings` with the same fresh
      `logdir` at the same moment race, and the loser dies with
      `FileExistsError: [Errno 17] File exists`. Hit while measuring today, on
      the second trial of a 2-trial run.
    why_the_current_code_dodges_it: >
      `hypertune.py` passes `logdir=Path(".")`, which always exists. Any
      student who follows the exercise and points `logdir` at a new folder
      inside the trainable hits it immediately, and the traceback blames their
      own path handling.
    fix: "`mkdir(parents=True, exist_ok=True)` — bundle it with the C1 release."

  - id: C6
    date: 2026-08-01
    answers: "how much cheaper is frozen than fine-tuning, really?"
    finding: >
      **It depends on the encoder, by an order of magnitude.** Batch of 32 at
      224x224, 8 CPU threads:
        model         frozen forward   fine-tune step   ratio
        resnet18          0.47 s/batch     1.08 s/batch    2.3x
        mobilenet_v2      0.85 s/batch    21.18 s/batch   24.9x
      Extrapolated over 4000 images: encode-once 59 s vs one fine-tune epoch
      135 s for resnet18; 106 s vs **44 minutes** for mobilenet_v2. The
      depthwise-separable convolutions that make mobilenet cheap to *run* have
      a pathologically slow CPU backward pass.
    consequence_for_the_plan: >
      the comparison notebook must fine-tune **resnet18** (the textbook 2.3x,
      and what L4/03 already uses) and may mention mobilenet as the surprise.
      Quoting the 25x as the general case would be teaching an artefact.
    consequence_for_the_argument: >
      it is also the honest version of the frozen-vs-fine-tune claim: frozen is
      not "10x cheaper", it is "cheaper by a factor you have to look up, times
      the number of trials you intend to run". The multiplier is the part that
      always holds.

  - id: C7
    date: 2026-08-01
    finding: >
      Ray 2.55 ships a **uv runtime-env hook**. Launching a tune run with
      `uv run` from a directory that does not contain the project's
      `pyproject.toml` fails before a single trial starts:
        RuntimeError: Your /path/to/course is not in the working_dir /private/tmp,
        so the workers will not have access to the file.
      Ray then packages the working dir (including `.venv`) and ships it to the
      workers, which is why the tracebacks show two different site-packages
      paths for the same module.
    consequence: >
      one sentence in the notebook and in `05_hypertuning_exercise.md`: run ray
      from the project root. It is a new class of "you can't blindly copy
      paths" gotcha and the exercise file already has a section for exactly
      that.

  - id: C8
    date: 2026-08-01
    finding: >
      If 01_hypertuner searches a head on an image cache (the P2.5 shape), then
      **L4 stops using GESTURES entirely** — and drops out of the kill list's
      "blocked group" (L3/04, L4/01, L5/03 all falling out of one dataset
      decision). The group shrinks to two notebooks, both in lessons that are
      not built yet.
    consequence: >
      L4 becomes buildable *before* L3.Q1 is answered, which is the reason this
      plan can be written today at all. It also means the P2.2 pick no longer
      has to be applied to three notebooks in one pass — the ordering rule in
      the kill list § 3.6 can be relaxed to L3 + L5.
    cost: >
      the GRU that L3 hands over stops being the thing L4 tunes, so the
      lesson-to-lesson continuity of "the model you just built, now tuned"
      breaks. See L4.Q1 — this is the one place where the cheap-trial argument
      costs something real.

