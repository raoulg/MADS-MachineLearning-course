open_questions:

  - id: L4.Q1
    blocking: L4.1 only
    question: >
      Does 01_hypertuner abandon sequence models and search a head on the image
      cache, or does it keep tuning a GRU on the L3 dataset?
    recommendation: >
      **the cache.** It is what P2.5 asks for, it is what makes C2's problem go
      away, and it takes L4 out of the P2.2 blocked group (C8) — which is why
      this plan could be written before the gestures pick.
    the_cost_of_that: >
      the "tune the model you built last lesson" continuity breaks, and L4 no
      longer has a recurrent model in it at all. A middle option: 01 searches
      the head, and **E1/the exercise** invites the student to bring their own
      expensive model — which is what the graded assignment asks for anyway.
    do_not: >
      keep the GRU *and* raise the sample counts. At ~27 s per trial (WISDM,
      10 epochs) a 32-sample search is 15 minutes per algorithm, five
      algorithms deep. That is the notebook C2 describes.

  - id: L4.Q2
    blocking: no
    question: Does L4 gain a schedulers notebook (goals 4.5/4.6)?
    context: >
      those two goals are the only ones in les4.md mapped to "lecture" with no
      notebook, and the collapse in L4.3 leaves room for one. But make_room is
      about the *lesson's hours*, not only its cells, and Q6 is unanswered.
    recommendation: >
      write it only if the L4.3 collapse lands first and the measured lesson
      runtime stays under Q5's budget. Otherwise fold two scheduler cells into
      03, where a `StepLR` is already being passed without comment.

  - id: L4.Q3
    blocking: no
    question: >
      Does 02_ray survive as its own notebook, or does the script-and-logs
      story fold into 01?
    argument_for_keeping: >
      "run it outside the notebook, in tmux, and analyse the logs afterwards"
      is a real practitioner skill, it is half of goal 4.10, and it is the only
      place the course teaches reading someone else's finished run.
    argument_for_folding: >
      21 cells of which 10 are plotting variations of the same dataframe, and
      the contrast it would carry can be three cells at the end of 01.

  - id: L4.Q4
    blocking: L4.0
    question: >
      Does the course keep `ReportTypes.RAY` (which needs an mltrainer release
      for C1 + C5), or do ray trials report by hand with `tune.report`?
    trade_off: >
      keeping it preserves "the same Trainer everywhere", which is a real
      consistency win and is what `hypertune.py` demonstrates. Dropping it
      makes L4 independent of an upstream release — but then the trainable
      cannot use mltrainer at all, and the hand-rolled loop this plan just cut
      comes back.
    recommendation: >
      fix mltrainer. It is one line plus C5's `exist_ok`, it is the same shape
      as P0.6, and `ReportTypes.RAY` is broken for every user of the library
      right now, not just for this course.

  - id: L4.Q5
    blocking: no, but it is a contradiction in a published learning goal
    question: >
      Goal 4.12 asks students to weigh "gin, tensorboard, mlflow, ray" as
      monitoring options. D10 settled that argument (MLflow), `gin` is not used
      anywhere in the course, and ray is not an alternative to the others — a
      tuned run reports *within* the trial to ray and *across* trials to
      MLflow. Reword or drop?
    recommendation: >
      reword to "can explain the difference between reporting inside a trial
      and tracking across runs, and can wire both". That is a better goal and
      it is what the notebook will actually show.

  - id: L4.Q6
    blocking: L4.2
    question: >
      What does `hypertune.py` search once it is migrated — the pixel CNN, the
      fine-tuned resnet, or a big-budget head search?
    recommendation: >
      **the pixel CNN** (importing `2_convolutions/cnn.py`, which lesson2.yml
      C10 put there precisely so it could be reused). It reuses code the
      student has read, it is the regime the notebook cannot afford, and it
      makes 02_ray a direct continuation of L2's crossover exercise. A
      fine-tuning search would be more dramatic and roughly 5x slower again.

  - id: L4.Q7
    blocking: L4.3
    question: >
      Small-data transfer learning on a flowers subset (D20), or a genuinely
      small second dataset?
    recommendation: >
      the subset. But note what is lost: hymenoptera is 244 training images
      *in total*, which is a different regime from 10-per-class of a
      102-class set, and "a tiny dataset someone handed you" is the situation
      transfer learning is actually for. If the subset feels artificial when
      built, revisit — the masterplan's shortlist (sasha/dog-food,
      Javtor/rock-paper-scissors) is still there and both are parquet-native.
