exercises:
  keep:
    - >
      05_hypertuning_exercise.md's core assignment (hypothesis -> experiment ->
      iterate -> 2-3 page report) and its "don't use hyperband when making a
      heatmap" warning, which is a genuinely subtle point and is now
      *demonstrable* — at 1.2 s per trial the student can run the same search
      with and without the scheduler and see the distortion.
  add:
    - id: E1
      type: ablation (the required one)
      where: 01_hypertuner.ipynb
      title: How many trials do you actually need?
      detail: >
        Run the same random search at n = 4, 8, 16, 32, 64 and plot the best
        accuracy found against wall clock. Where does the curve flatten? Then
        answer the question that matters: given the measured cost per trial in
        the *other* two regimes (C3), what would each of those n cost on pixels
        and on a fine-tuned encoder? This is the curse of dimensionality (4.2,
        4.11) as arithmetic the student does rather than a slogan.
    - id: E2
      type: designed vs learned / cheap vs expensive dimensions
      where: 01_hypertuner.ipynb
      title: Put the encoder in the search space
      detail: >
        Add `encoder` as a `tune.choice(["mobilenet_v2", "dinov2_small"])` — two
        caches, both published (P0.3). Every other dimension costs 1.2 s to
        sample; this one cost someone a caching pass (measured 46-74 img/s on
        CPU, lesson2.yml). Does it move the score more than everything else
        combined? Then: how would you search over *ten* encoders, and what
        would you have to build first?
      why: >
        it is the L4 form of the course's central move — the biggest lever is
        usually the representation, not the head — and it makes "some
        dimensions are not sampleable at notebook cost" concrete.
    - id: E3
      type: cost accounting
      where: 03_finetune_vs_frozen.ipynb
      title: Find the crossover, again
      detail: >
        L2's `03_mlflow` E3 found that caching pays for itself after ~1.4
        trials against a from-scratch CNN. Do the same arithmetic against
        *fine-tuning*: one encoding pass vs one fine-tune epoch per trial. At
        what trial count does frozen win, and what does that number do when you
        swap resnet18 for mobilenet_v2 (C6)?
    - id: E4
      type: honesty check
      where: 02_ray.ipynb
      title: When is ray the wrong tool?
      detail: >
        Run the same 24-trial search twice: once through ray, once as an
        in-process loop over the same sampled configs. Report both wall clocks
        and explain the difference. Then find the trial duration at which they
        cross. (Measured today: ray 85 s for 24 trials on 8 cpus; the trials
        themselves are 1.2 s each, so ~29 s of the 85 is work.)

