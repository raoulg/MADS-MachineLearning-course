       and data efficiency on a 10-per-class subset. 74 cells -> ~30."
    - "04_schedulers.ipynb  — OPTIONAL, see L4.Q2. Goals 4.5/4.6 have no
       notebook today; cheap trials make them a 2-minute experiment."
    - "05_hypertuning_exercise.md — reworded, not rewritten."
  scripts:
    - "hypertune.py  — migrated (C1), and re-pointed at the expensive regime."
    - "visualize.py  — `plot_grid` and `plot_categories` are dead in L4; drop."
  why_this_split: >
    Today the lesson is two unrelated halves that happen to share a folder:
    two notebooks about ray, then two notebooks about transfer learning, with
    no argument connecting them. The connection D9 was reaching for is
    **cost** — transfer learning is what makes a trial cheap, and a cheap trial
    is what makes search teachable. Ordering it as cheap-search (01) ->
    expensive-search (02) -> where-the-cheapness-came-from (03) makes that one
    argument instead of two topics.

