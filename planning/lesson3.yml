        **BLOCKED.** D5 moves `datatools.window` into vectormesh, and VM.1
        needs it anyway. Verified today: vectormesh **0.4.1** exports
        BaseVectorizer, ChunkedRegexVectorizer, ImageVectorizer, LabelEncoder,
        RegexVectorizer, VectorCache, Vectorizer — no `window`. So the
        build-it-then-meet-the-library beat that 01_windowing is designed for
        has no library to meet yet.
      options:
        - "land the one-function move in vectormesh first (it is small), then
           01_windowing ends on the import — the shape D5 asked for"
        - "ship L3 with the hand-rolled version only, and add the import beat
           when VM.1 lands. Costs nothing now and nothing later."
      recommendation: the second. Do not block a lesson on a one-function move.
    - component: metrics.MASE / metrics.MAE
      status: >
        exist in **both** `mltrainer.metrics` and
        `vectormesh.components.metrics` (verified). L3 uses mltrainer's today
        and it works with a DataLoader (C6). Two implementations of the same
        metric in two course dependencies is a conventions question, not an L3
        question — L3.Q4.
    - component: Collate / TensorDataset
      status: >
        not needed. The windowed series is already a dense float32 tensor;
        `TensorDataset` + the D7 DataLoader defaults is two lines. vectormesh's
        Collate earns its place where rows are ragged, which here they are not.
  the_honest_summary: >
    **L3 does not train on a VectorCache in phase_2, and should not pretend
    to.** A cache is for expensive encoding you want to do once; windowing
    62k floats takes 0.01s (measured). Forcing a cache in here would teach the
    machinery and hide the reason for it. This contradicts the phase_2 exit
    criterion "each of L1..L5 has at least one notebook that trains on a
    VectorCache"; see L3.Q3.

  phase_3_changes_this_but_not_the_way_expected:
    measured: see C9 and C10
    the_encoder_exists: >
      `TimesFm2_5Model` is a working frozen vectorizer today, on the installed
      transformers — 512 steps -> `(16, 1280)`, 162 windows/s on CPU. So the
      *mechanism* the course already teaches transfers to timeseries with no
      new dependency and no new library code.
    but_the_economics_invert: >
      a raw 512-step window is 2.0 KB; its full embedding is 80 KB (**40x**),
      mean-pooled 5.0 KB (still 2.5x). Images go the other way — 224x224x3 to
      1280 dims is ~100x compression. So `embed_once_reuse_many` keeps its
      *speed* argument here (50k windows in ~5 min of CPU) and loses its
      *artefact* argument: publishing a timeseries cache means publishing
      something larger than the data it came from.
    and_the_quality_inverts_too: >
      the frozen-embedding head lost to a linear layer on raw values (C10),
      while the model's own zero-shot forecast won by a distance. For this
      modality the useful frozen model is the **whole** model, not its encoder
      states — which is a genuinely different answer from the one text and
      images gave, and phase_3 should say so plainly instead of forcing the
      pattern through.
    what_this_does_to_P3.3: >
      it survives, reframed. The three-point curve (zero-shot vs frozen+head vs
      from-scratch) is *better* material now that the middle point loses,
      because the student has to explain why. Add the contamination check as
      the fourth beat.
  shapes_taught:
    - "one series `(T,)` -> window -> `(B, T_w)` -> unsqueeze -> `(B, T_w, F)`"
    - >
      name the rung: `(B, C, D)` from tensor-ladder.md is `(B, T, F)` here, and
      Conv1d wants `(B, F, T)` — the same axes, permuted. This is the
      formal/semantic split in its most confusing incarnation and 02's cell 1
      already half-explains it.

