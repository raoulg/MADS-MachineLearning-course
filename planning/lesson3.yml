# =============================================================================
# Lesson 3 (notebooks/3_recurrent_networks) — refactor plan
#
# Parent: planning/masterplan.yml (phase_2 P2.1/P2.2, phase_3 P3.1-P3.3, D5/D11)
# Kill list rows: planning/mads_datasets_killlist.md § "Lesson 3"
#
# L3 is the lesson with the biggest dataset gap: both its datasets come from
# mads_datasets, one of them cannot legally be republished, and the taught
# series is 3.240 points of monthly aggregate. This plan replaces both, and
# uses the replacement to pay for the phase_3 material that follows.
# =============================================================================

meta:
  lesson: L3
  dir: notebooks/3_recurrent_networks
  status: >
    PLAN — nothing implemented. Written 2026-07-31 after L1 and L2 shipped,
    **revised 2026-08-01** after measuring four candidate series: the taught
    dataset moved from sunspot to **pedestrian_counts** (D14), and the
    forecasting half of the lesson was reframed around what those measurements
    actually showed. Every number marked `measured` was produced by running it
    on this machine (M-series, CPU, warm HF cache); everything else is a
    proposal. The gestures half (L3.5) is a decision that belongs to three
    lessons at once and is flagged as such.
  created: 2026-07-31
  updated: 2026-08-01
  phase: 2 (datasets) + the on-ramp to 3 (spectral / probabilistic / TSFM)
  goal: >
    L3 answers two questions. **How do you turn a long series into a supervised
    dataset without lying to yourself?** (windowing, horizon, seasonality,
    leakage) and **does the expensive model earn its keep?** — which is the
    north star pointed at architectures instead of at encoders.
    The second question has a measured answer, across four datasets, and it is
    not the one the current notebook implies: for point forecasting at a laptop
    budget, **a linear layer beats a GRU**. Recurrence earns its keep in this
    lesson on the *classification* task, not the forecasting one. See C7.
  sequencing_note: >
    Written ahead of lesson4.yml at the owner's instruction (2026-07-31),
    reversing the order in masterplan `next_deliverables`. The L4 handover
    (D9 / L2.5) therefore stays open, and the L2/L4 transfer-learning
    duplication stays deliberate. Nothing in this plan touches L4 — except
    that L3.5 (gestures) *decides for* L4/01_hypertuner, which is unavoidable:
    it is one dataset used by three lessons.

# -----------------------------------------------------------------------------
# Corrections to the masterplan, found by running things today. Per the working
# agreement in planning/README.md: when reality contradicts the plan, reality
# wins and the plan gets updated. C1-C4 all concern the same dataset.
# -----------------------------------------------------------------------------
corrections:

  - id: C1
    supersedes: >
      mads_datasets_killlist.md § L3 cell 4 — "fetch the SILSO monthly txt
      directly. **Not** Monash", and masterplan P2.1's title.
    finding: >
      Superseded by the owner's decision of 2026-07-31 (see decisions.D13
      below, to be carried into the masterplan): **Monash daily is the primary
      series.** The masterplan already contradicted itself here —
      `dataset_migration.SUNSPOTS.plan` said go daily, P2.1 said stay monthly.
      One of them had to go; P2.1 does.
    also_corrects: >
      "`load_dataset` fails on datasets 5.0" is true but too strong as written.
      The parquet branch loads fine on `datasets` 5.0 — but *only* with
      explicit `data_files`. Passing the config name fails:
        load_dataset("Monash-University/monash_tsf", "sunspot",
                     revision="refs/convert/parquet")
        -> ValueError: BuilderConfig 'sunspot' not found. Available: ['default']
      because the converted branch has no configs, only folders. The form that
      works, verified today, 1.8s warm:
        load_dataset(
            "Monash-University/monash_tsf",
            revision="refs/convert/parquet",
            data_files={"train": "sunspot/train/0000.parquet",
                        "validation": "sunspot/validation/0000.parquet",
                        "test": "sunspot/test/0000.parquet"})
      This snippet is the one thing in the notebook that must be copy-pasted,
      not improvised. Same class of trap as the `save_to_disk`/`load_dataset`
      one in D3.

  - id: C2
    severity: this one changes the lesson, not just the loader
    finding: >
      **The three Monash splits are nested prefixes of one series, not three
      disjoint splits.** Measured: train 73.864 points, validation 73.894,
      test 73.924 — each is the previous one plus exactly 30. Verified
      elementwise: `validation[:len(train)] == train` and
      `test[:len(validation)] == validation`, both True.
    consequence: >
      A student who writes `ds["train"]` / `ds["test"]` and trains on them has
      100% overlap and a validation score that means nothing. This is the
      single most likely mistake in the whole notebook, and it is *invited* by
      the split names.
    but_this_is_a_gift: >
      les3.md goal **3.3 is literally "what matters in data preparation to
      prevent leakage"**, and today it is taught as an assertion. Now it has a
      trap the student can fall into and measure. The notebook loads the
      **test** split (the longest, i.e. the full series), ignores the split
      names, and cuts its own boundary in time — and says why, out loud.
    it_also_fixes_the_horizon: >
      the 30-point offset is Monash's own forecast horizon for this series. So
      `horizon=30` is not a number the notebook invents; it is read off the
      dataset. `window` stays a free parameter, which is what E1 ablates.

  - id: C3
    finding: >
      The series has **3.240 NaNs** — and they are not scattered. Every one is
      before index 11.307 (1848-12-22); 27% of the first 12.000 points are
      missing and 0% after. Daily sunspot counts were simply not recorded
      reliably before ~1849.
    consequence: >
      `torch.from_numpy(target)` produces a tensor with NaNs, `MSELoss` gives
      NaN, gradients go NaN, and the model trains to NaN in silence. The plan
      is to *drop the head*: `series[11307:]`, giving **62.617 clean daily
      points, 1848-12-23 to 2020-05-31, zero NaNs** (measured).
    teaching_value: >
      one cell — `np.isnan(x).sum()`, then plot where they are — and the
      student learns that a real dataset arrives with a history, that the
      missingness is structured rather than random, and that "drop the first
      30 years" is a defensible modelling choice you have to make and record.
      mads_datasets handed over a clean tensor and this conversation never
      happened.

  - id: C4
    supersedes: >
      masterplan dataset_migration.SUNSPOTS.plan — "daily data has structure
      (annual and ~11-year solar cycles) that monthly aggregation smooths away"
    finding: >
      Half right, and the wrong half is the interesting one. Measured power
      spectrum of the clean series (share of total variance, mean removed):
        period  8-14 years ....... 53.7%   the solar cycle
        period 20-40 days ........ 11.4%   solar *rotation*, ~27 days
        period 300-430 days ...... 1.3%    i.e. nothing
        period  2-30 days ........ 16.4%
      There is **no annual seasonality** — the sun does not care about Earth's
      orbit. What monthly aggregation destroys is the ~27-day rotation band,
      which is a ninth of the variance and is exactly the scale a 120-day
      window can see.
    consequence: >
      The argument for daily data gets *better* and more specific: it is not
      "more structure", it is "one identifiable physical period that monthly
      averaging removes and that our window is long enough to capture". That
      sentence is worth more than the vague one, and it sets up P3.2's Fourier
      block with a real target frequency instead of a decorative one.

  - id: C7
    date: 2026-08-01
    severity: this is the finding the lesson gets rebuilt around
    supersedes: >
      the implicit arc of today's 03_basemodels — "start with a linear
      baseline, then get serious with an RNN".
    finding: >
      **A linear layer beats a GRU at point forecasting, on every dataset
      tested.** Identical protocol throughout (window -> 80/20 time split ->
      per-series max-scaling -> Adam 1e-3, MSE, batch 64, last hidden state
      for the GRU). Ratios are MAE relative to the naive model; lower is better.

        dataset            epochs  seas.naive  linear   GRU-64   GRU cost
        sunspot (daily)         3       -       0.802   0.800    100x
        pedestrian_counts       3     0.271     0.206   0.375     68s vs 1s
        pedestrian_counts      15     0.271     0.199   0.242    192s vs 2s
        traffic_hourly          3     0.353     0.300   0.408     38s vs 0s
        us_births               3     0.266     0.839   1.022     -

      Training longer helps the GRU a great deal (0.375 -> 0.242) and still
      does not overtake a linear model that trained in 2 seconds. On us_births
      a **zero-parameter seasonal naive beats every trained model by 3x**.
    this_is_not_a_bug: >
      it is the LTSF-Linear / DLinear result (Zeng et al., 2023), reproduced.
      For point forecasting at these budgets, linear baselines are genuinely
      hard to beat, and the field spent several years not noticing.
    what_it_means_for_the_lesson: >
      Do not go looking for a dataset where the GRU wins — four were tried and
      the ranking never moved. Teach the result instead. It is the north star
      applied to architectures: **the expensive thing has to earn its place,
      and here it does not.** L3 then shows where recurrence *does* earn it —
      sequence classification, where the same GRU reaches 0.90 (L3.5) — so the
      student leaves with a rule about when to reach for memory, rather than
      with a ritual.
    the_honest_caveat: >
      the protocol is somewhat unkind to the GRU: last hidden state only, no
      per-window normalisation, no seasonal covariates, one seed, no scheduler.
      A "give the GRU a fair fight" exercise belongs in the notebook, exactly
      as L2's E2b does for the CNN (see E5). But at 100x the cost, the burden
      of proof sits with the GRU, and that asymmetry is itself the lesson.

  - id: C8
    date: 2026-08-01
    corrects: a claim made in this plan's own first draft, and one made in chat
    finding: >
      pedestrian_counts, measured across all 66 series rather than the first
      one: **zero NaNs**, all values integer, lengths 576 to 96.424 (median
      45.870), zeros a median 0.2% of a series (max 12.6%).
      The 24-hour band holds a median **59%** of each series' variance
      (range 0.17-0.85, n=63 long enough to measure) — an earlier note said
      "80%", which was series T1 alone and is the top of the range, not the
      middle. The weekly band is spectrally weak: median 2.3%, max 10%.
    consequences:
      - >
        the daily cycle is overwhelming and, at 24 steps inside a 168-step
        window, **within reach** — which is the whole reason for the switch.
        The weekly cycle is not a clean spectral line, so do not promise one.
      - >
        no NaNs means pedestrian does *not* carry the missing-data lesson. That
        is fine: the sunspot aside keeps it (C3), and the two datasets end up
        with a clean division of labour.
      - >
        wildly varying series lengths are a real modelling decision the
        notebook must make out loud (which series do you keep, and does a
        576-point series belong in the same pool as a 96k one?).

  - id: C9
    date: 2026-08-01
    answers: "are there pretrained vectorizers for timeseries, or only FFT?"
    finding: >
      There are, and one of them needs **no new dependency**. Verified by
      loading, not by reading model cards:
        - `google/timesfm-2.5-200m-transformers` loads on the installed
          transformers 5.12.1 (`model_type: timesfm2_5`, class
          `TimesFm2_5Model`). On a 512-step context it returns
          `last_hidden_state` **(B, 16, 1280)** — 16 patch embeddings of 1280
          dims — plus `loc`, `scale`, `context_mu`, `context_sigma`. It is a
          `(C, D)` vectorizer *and* it is natively probabilistic.
          199M params, 925 MB, **157 windows/s on CPU** at batch 32.
        - `ibm-granite/granite-timeseries-patchtst` also loads (0.6M params,
          `(B, 7, 43, 128)`) but **hardcodes 7 input channels** and raises on
          univariate input. Trap; note it before anyone tries.
        - `autogluon/chronos-bolt-small` (13.2M downloads) loads via AutoModel
          as a bare `T5Model` (44M params) — a **trap, not a win**. The
          patching, scaling and quantile head live in the
          `chronos-forecasting` package, so the bare load gives a transformer
          with no correct way to feed it. Either take that dependency for the
          most-downloaded TSFM, or use TimesFM and stay dependency-free.
    the_part_that_changes_the_caching_story: >
      **A TSFM embedding is bigger than the raw series.** A 512-step float32
      window is 2 KB; its TimesFM embedding is 16 x 1280 = 80 KB — a **40x
      expansion**. An image goes the other way: 224x224x3 -> 1280 dims is ~100x
      *compression*. So `embed_once_reuse_many` has inverted storage economics
      in this modality: cache-as-speedup still works (50k windows in ~5 min on
      CPU), cache-as-distributable-artefact is a much weaker sell than it is
      for text and images.
      This is a better teaching point than the one it replaces. It gives the
      student a reason *why* the course caches images and text, instead of a
      rule that caching is simply good. Feeds L3.Q3 and P3.3.

  - id: C10
    date: 2026-08-01
    severity: >
      the strongest single result in the lesson, and it arrives with a failure
      attached that is worth as much as the success.
    what_was_run: >
      TimesFM 2.5 on pedestrian_counts, W=512 H=24, 8000 train / 2000 valid
      windows pooled from 12 series, per-series max scaling, CPU. Three points
      on one cost/quality curve, plus the two baselines. Ratios are MAE
      relative to the naive model.

        naive ......................... 0.1211   1.000    -
        seasonal naive (lag 24) ....... 0.0310   0.256    no training
        **TimesFM 2.5 zero-shot** ..... 0.0161   0.140    9s / 512 windows, NO TRAINING
        linear on raw ................. 0.0272   0.225    0s train
        GRU-64 on raw ................. 0.0416   0.344    97s train
        frozen TSFM + mean-pooled head  0.0604   0.499    62s encode + 0s train

    the_headline: >
      **a model that never saw your task beats everything you can train, by 40%
      over the best trained model, with no training at all.** That is the north
      star demonstrated rather than asserted — and it lands immediately after
      the student has watched their GRU lose to a linear layer (C7). The two
      results together are the lesson: the expensive architecture you build
      loses to a cheap one, and both lose to the one you download.
    the_failure_that_teaches_more: >
      **the frozen-embedding route lost.** 0.499 is worse than a linear layer
      on raw values (0.225) — the one place in the whole course where the
      cache-and-head pattern the course is built on *does not work*.
      First hypothesis was the aggregator: mean-pooling 16 patch embeddings
      destroys temporal order, and forecasting is where recency dominates.
      **Tested, and wrong** — the ablation moves almost nothing:
        mean 0.499 | attention 0.502 | last patch 0.576 | flatten 4.112
      So it is not the pooling. (Flatten is 491k parameters at lr 1e-3 for 15
      epochs and simply diverges — worth keeping in the notebook as its own
      small lesson about capacity.)
      Second hypothesis — TimesFM instance-normalises and hands `loc`/`scale`
      back separately, so the level might be scrubbed out of the hidden states
      — **also wrong**. See C11, which settles it.
    why_this_is_good_teaching: >
      the course has so far shown caching working. Here is a modality where the
      naive application of the same pattern loses to a linear layer, and the
      student has to find out why. That is R6 ("caches hide preprocessing")
      made concrete, and it is the difference between teaching a technique and
      teaching judgement.
    caveats:
      - >
        the zero-shot number is **contaminated or unverifiable** — see
        datasets.BENCHMARKS.the_contamination_finding. Do not quote 0.140
        without the caveat attached.
      - >
        one seed, 15 epochs, no tuning, and the scaled units are per-series max
        rather than the instance normalisation TimesFM does internally.

  - id: C11
    date: 2026-08-01
    settles: why the frozen-embedding head lost (C10)
    two_hypotheses_falsified:
      aggregator: "mean 0.499 | attention 0.502 | last 0.576 | flatten 4.112 —
        swapping the pooling changes nothing that matters"
      instance_normalisation: >
        feeding TimesFM's own `loc` and `scale` back in as extra features moves
        0.499 -> 0.486. Adding the last raw value: 0.471. So the missing level
        was not the problem either.
    the_decisive_measurement: |
      emb only ....................... 0.499
      emb + loc/scale ................ 0.486
      emb + last value ............... 0.471
      emb + last 24 values ........... 0.343
      MLP head on emb ................ 0.364   (head capacity helps a little)
      **emb + full raw window ........ 0.265**
      **raw window alone ............. 0.216**
      last 24 raw values alone ....... 0.294

      Handing the head the embedding **in addition to** the raw window makes it
      *worse* than the raw window alone. An extra 1280 features that cannot be
      ignored cheaply is a cost, not a free option.
    conclusion: >
      the mean-pooled encoder states of TimesFM carry **less usable signal for
      this task than the 512 raw numbers do**. TimesFM's forecasting ability
      lives in the decoder machinery that the zero-shot path uses, not in a
      poolable summary of its encoder. This is a boundary of the course's
      central pattern, and it is worth naming as one.
    the_rule_of_thumb_it_yields: >
      **if your encoder expands the data, it is re-encoding rather than
      extracting.** Images: 224x224x3 -> 1280 dims, ~100x compression, and the
      frozen-features pattern works beautifully (L2: 0.166 -> 0.905). Text:
      variable-length tokens -> 384 dims, big compression, works (L1).
      A 512-step window -> 16x1280, a **40x expansion** (C9) — and it does not
      work. The storage measurement predicted the quality result, which is a
      satisfying thing for a student to discover, and it gives them a cheap
      test to run *before* spending an afternoon building a cache.
    honest_limits: >
      this is linear (and one MLP) probing at 8000 windows, on a task where the
      raw window is close to a sufficient statistic (strong 24h periodicity,
      24h horizon). A fine-tuned encoder, a different pooling over all
      16 x 1280 with proper regularisation, or a task with less obvious
      structure could all move this. The claim is about *this* task at *this*
      budget — the same discipline C7 and L2's CNN comparison use.

  - id: C5
    finding: >
      `02_1d_convolutions.ipynb` is **8 cells** (5 code) on a synthetic sine —
      it is a section, not a notebook. `03_basemodels.ipynb` is **83 cells**,
      of which roughly half are data plumbing that this refactor deletes.
    consequence: see make_room below; the lesson is unbalanced today and the
      refactor is a chance to rebalance rather than just re-point.

  - id: C6
    finding: >
      `mltrainer.metrics.MASE` already handles a `DataLoader` correctly —
      0.3.4 has an explicit `_batches` branch and a docstring naming the
      `next(iter(train))` bug fixed in `Trainer._next_batch` (P0.6). Verified
      today: `MASE(dataloader, horizon=30)` builds in 0.1s over 1561 batches.
    consequence: >
      no mltrainer work is needed for L3. Note the definition, though:
      `_naive_predict` is `x[..., -horizon:, :]` — the last `horizon` *observed*
      values used as the forecast, not last-value-repeated. Both are defensible
      naive models; the notebook must say which one it is scoring against,
      because the two give different scales (measured: 0.077 vs 0.060 on the
      same data).

