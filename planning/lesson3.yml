proposed_arc:
  notebooks:
    - "01_windowing.ipynb    — hand-roll `window`, then apply it to 66 real
       series: load, choose which series to keep, split in time, window, pool.
       Absorbs the data half of today's 03_basemodels."
    - "02_1d_convolutions.ipynb — Conv1d on a series, now on the real one, plus
       the spectrum: what periods are in this data, and how many stacked layers
       before a kernel-3 filter can see a day? Sets up P3.2."
    - "03_basemodels.ipynb  — seasonal naive -> MASE -> linear -> RNN -> GRU,
       with the comparison table that shows the linear model winning (C7).
       Loses all its plumbing."
    - "04_exercise.ipynb    — sequence *classification* on the gestures
       replacement, where recurrence finally wins, plus the subject-split
       artefact (L3.5)."
