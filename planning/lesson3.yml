premise: >
  main_principles.md §1.2. L3 is deliberately the counterweight to L1. There is no
  general-purpose frozen encoder for an arbitrary time series, so windowing and
  end-to-end training are correct here. Its pedagogical job in round 2 is to stop
  students from over-applying the cache idea.

