decisions:
  - id: D13
    to_be_added_to: masterplan.yml decisions
    answers: the P2.1 / dataset_migration.SUNSPOTS contradiction
    decision: >
      **Monash daily is the primary sunspot series**, loaded from the
      `refs/convert/parquet` branch with explicit `data_files` (C1). SILSO
      monthly is kept only as a named fallback if the daily series ever proves
      too slow — it is one urllib call and needs no mads_datasets either way.
      P2.1's title and body are rewritten to match; the kill list row for
      `03_basemodels` cell 4 is rewritten with it.
    made_by: owner, 2026-07-31
    partially_superseded_by: D14 — Monash stays, the *series* changes
    consequences_accepted:
      - "window/horizon are renumbered: 26/3 months -> 120/30 days (E1 ablates
         the window)"
      - "every accuracy and MASE number in 03_basemodels changes"
      - "the notebook gains a NaN-handling cell and a leakage cell (C2, C3)"
      - "the GluonTS row convention (start/target/feat_static_cat/item_id) has
         to be read, which is a prerequisite for phase_3 anyway"

  - id: D14
    to_be_added_to: masterplan.yml decisions
    supersedes: D13's choice of *series* (not its choice of catalog or loader)
    answers: >
      "maybe sunspots isn't the best dataset — if the pattern isn't there we
      can't learn it. Switch to something that better showcases probabilistic
      deep learning with autoformers?"
    decision: >
      **`pedestrian_counts` becomes the taught series; sunspot is demoted to a
      short aside/exercise.** Both are Monash TSF via the same parquet-branch
      loader, so D13's loader finding (C1) and the GluonTS-row goal are
      unaffected — this is a change of config string, not of mechanism.
    the_diagnosis_that_drove_it: >
      Sunspot is **not** noise — 53.7% of its variance is in the 8-14 year
      band. The problem is that this band has a period of ~3.900 days and the
      window is 120, so the model is *structurally blind* to the structure that
      dominates the series. What is left in reach is short-range
      autocorrelation, and a linear map is the optimal thing for that.
      "Linear ties the GRU" therefore did not mean "no pattern"; it meant "the
      pattern in reach is linear", which is a much less useful lesson.
    why_pedestrian:
      - >
        **the periodicity is inside the window.** Median 59% of variance at
        24 hours (C8), 24 steps inside a 168-step window. Autoformer's
        FFT auto-correlation has something to find; on sunspot it would be
        hunting a cycle 32x longer than its own input.
      - >
        **counts.** Integer-valued, heteroscedastic across the day, some series
        up to 12.6% zeros. A Gaussian NLL head is visibly the wrong
        distribution, which is what makes P3.1 a lesson instead of a formality.
      - >
        **66 series**, so `item_id` means something, cross-series learning is
        available, split-by-series-vs-split-by-time becomes a real question,
        and TSFM zero-shot has a proper benchmark.
      - >
        **a seasonal naive that scores 0.271** — a zero-parameter model 3.7x
        better than the plain naive one. Goal 3.11 gains real teeth: the
        question stops being "what is MASE" and becomes "against *which*
        baseline", where the answer moves the number by 4x.
    what_sunspot_keeps: >
      the missing-data lesson (C3 — pedestrian has zero NaNs), the nested-split
      trap (C2), and a genuinely good three-cell aside: *here is a series whose
      dominant cycle your window cannot see, and here is how you would know
      that before training anything.* Demoting it turns an accident into a
      deliberate point. See E4.
    not_a_reason: >
      "a dataset where the GRU finally beats the linear model." Four were
      tested and the ranking never moved (C7). That was not the goal of the
      switch and should not be presented as one.
    made_by: owner, 2026-08-01

  - id: D22
    to_be_added_to: masterplan.yml decisions
    answers: L3.Q1, and masterplan P2.2
    note_on_the_id: >
      D19-D21 are reserved by lesson4.yml's three proposed decisions, which are
      still the owner's to make. This one is made, so it takes the next free id.
    decision: >
      **`monster-monash/WISDM` replaces the FBK smartwatch gestures dataset.**
      17.166 x 3 x 100 (five seconds at 20 Hz), 6 classes, 36 participants,
      20.6 MB, fetched with two `hf_hub_download` calls — no `load_dataset`, so
      R9's script problem does not apply.
    verified:
      loads: "download + load 1.8s"
      trains: "GRU(3->64, 1 layer) 2.7s/epoch on CPU, accuracy 0.902 after 3
        epochs on a random split"
      subject_split: >
        the card states **'WISDM is split based on subjects'**, and the repo
        ships `test_indices_fold_0..4.txt`. Measured on fold 0 with the same
        model and epochs: **0.761**. The 14-point gap against the random split
        is the leakage artefact E3 is built on.
    why_it_won: >
      3 channels keeps `input_size=3` unchanged, so the notebook edits are
      confined to the loading cells — which matters when one decision lands in
      two lessons. It is the smallest credible download. And it is the only
      candidate that ships the folds that make the leakage lesson free.
    accepted_costs:
      - >
        6 classes instead of 20 — an easier task. Note the closing line of
        04_excercise ("you should be able to get above 90% accuracy") is an
        **observation about the old dataset**, not a target the exercise sets.
        It simply becomes untrue: WISDM reaches 0.902 in 3 epochs on a random
        split and 0.761 on the subject fold. Replace it with the honest pair of
        numbers, or drop the sentence.
      - "fixed-length windows, so the variable-length/padding question dies in
         L3 (L3.Q2). lesson5.yml has already picked it up on chunk counts,
         where raggedness is intrinsic rather than a segmentation artefact."
      - "licence stated as 'other', i.e. unspecified. Fine for students to
         download and use; do **not** publish a derived cache from it without
         checking (R7)."
    scope: >
      L3/04 and L5/03 only. L4/01_hypertuner left the blocked group when
      lesson4.yml moved its search onto an image cache.
    made_by: owner, 2026-08-01

