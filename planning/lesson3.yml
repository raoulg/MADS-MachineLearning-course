    the two halves now answer the same question and disagree, which is the
    point. Forecasting: your GRU loses to a linear layer, and both lose to a
    downloaded model (C7, C10). Classification: the GRU earns its keep (0.90).
    The student leaves with a rule about *when* to reach for memory, instead of
    a habit of always reaching for it.
  why_this_split: >
    Today 03_basemodels does everything: loads, splits, windows, defines a
    Dataset, builds streamers, defines a naive baseline, defines MASE, and
    trains three models across 83 cells. Moving the data half into 01_windowing
    puts the windowing *lesson* next to the windowing *application*, which is
