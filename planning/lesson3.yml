# -----------------------------------------------------------------------------
exercises:
  - id: E1
    type: ablation (the required one)
    title: How far back should you look?
    detail: >
      Fix horizon=24 and sweep window ∈ {24, 48, 168, 512} for the linear model
      and the GRU. Predict first, from the spectrum in 02: which windows can see
      one daily cycle? Which can see a week? Then measure score *and*
      seconds/epoch and explain the curve's shape. Expected and worth checking:
      the longer window helps the linear model more than the GRU, because a
      512-step RNN has a 512-step gradient path and a linear map does not care.
      Measured anchor: at W=512 the linear model reaches 0.216 and
      "last 24 values only" reaches 0.294 — so most, but not all, of the signal
      is in the last day.
  - id: E2
    type: designed vs learned (principle designed_vs_learned)
    title: Hand the model the period it already has
    detail: >
      Add two channels: sin and cos of the hour index at a 24-hour period.
      Same model, same budget. Does the designed feature beat the learned one,
      on a series where 59% of the variance sits at exactly that period?
      The timeseries twin of regex-vs-embeddings in L1, and the seed of P3.2's
      FourierVectorizer — three lines.
  - id: E3
    type: leakage
    title: Measure your own leak
    detail: >
      Re-run the gestures baseline twice: once with a random split over
      pre-segmented windows, once with the dataset's own subject fold. Report
      both numbers and explain the gap. Measured on WISDM: 0.902 vs 0.761.
      Then answer: which number would you put in a paper, and which one does
      your model actually deserve?
  - id: E4
    type: aside (the demoted sunspot material, D14)
    title: The signal your window cannot see
    detail: >
      Load the daily sunspot series, plot it, and find the NaNs (3.240 of them,
      all before 1849 — decide what to do and record the decision). Then take
      its spectrum: 53.7% of the variance sits at a period of ~3.900 days.
      Answer without training anything: what window would you need? What happens
      to a model given 120 days? Finally check the Monash split lengths
      (73.864 / 73.894 / 73.924) and say what those three "splits" actually are.
      Three cells, and it inoculates against the most expensive mistake in
      forecasting — training for a day on structure the model cannot reach.
  - id: E5
    type: fair fight (the C7 counterweight, modelled on L2's E2b)
    title: Give the GRU its best shot
    detail: >
      The lesson's headline is that a linear layer beat the GRU on every dataset
      tried. The protocol was not generous: last hidden state only, no per-window
      normalisation, no seasonal features, one seed, no scheduler. Fix as many of
      those as your budget allows and report whether the ranking changes — and
      what it cost you to find out. Honest outcomes include "it still loses".
  - id: E6
    type: the phase_3 seed — foundation models
    title: Three ways to forecast, one cost axis
    detail: >
      Reproduce the C10 table: seasonal naive, a trained linear model, and
      TimesFM 2.5 **zero-shot** (`TimesFm2_5ModelForPrediction`, no training,
      no new dependency). Measured: 0.256 / 0.225 / **0.140**.
      Then the twist — build the frozen-embedding version (`TimesFm2_5Model`,
      mean-pool, linear head) and find that it scores 0.499, worse than the
      linear model on raw values. Diagnose it. The plan's own two hypotheses
      were both wrong (C11); the answer is in the storage numbers.
    then_ask: >
      is `pedestrian_counts` in this model's pretraining corpus? Check
      `Salesforce/lotsa_data` and `autogluon/chronos_datasets` with
      `list_repo_files`. (It is in both. TimesFM's card says nothing.) What does
      that do to the 0.140?
  - id: E7
    type: carried over
    title: improve the RNN (the existing 04 exercise list)
    detail: >
      keep it — GRU vs LSTM, Conv1D in front, hidden size and layers, report
      with MLflow (goal 3.15). Its closing "above 90%" line was an observation
      about the old dataset — replace it with WISDM's own numbers. This is
      where recurrence *does* win, and the exercise should say so.

# -----------------------------------------------------------------------------
runtime_budget:
  status: >
    MEASURED 2026-07-31 and 2026-08-01 on an M-series mac, CPU, warm HF cache,
    from scratch scripts — **not** from the notebooks, which do not exist yet.
    Adam lr=1e-3, MSELoss, untuned.

  pedestrian_counts_the_taught_series:
    setup: >
      W=512 H=24, 8000 train / 2000 valid windows pooled from 12 series,
      per-series max scaling, 15 epochs, batch 64
    results:  # MAE, and the ratio to the naive model
      naive:              {mae: 0.1211, ratio: 1.000, cost: "-"}
      seasonal_naive_24:  {mae: 0.0310, ratio: 0.256, cost: "no training"}
      timesfm_zero_shot:  {mae: 0.0161, ratio: 0.140, cost: "9s / 512 windows, no training"}
      linear_raw:         {mae: 0.0262, ratio: 0.216, cost: "0s train, 12.312 params"}
      gru_64:             {mae: 0.0416, ratio: 0.344, cost: "97s train, 14.424 params"}
      frozen_tsfm_head:   {mae: 0.0604, ratio: 0.499, cost: "62s encode + 0s train"}
    at_W_168:  # the earlier sweep, 40k windows, for the window ablation E1
      seasonal_naive: 0.271
      linear:  {ratio_3ep: 0.206, ratio_15ep: 0.199, cost: "2s for 15 epochs"}
      gru_64:  {ratio_3ep: 0.375, ratio_15ep: 0.242, cost: "192s for 15 epochs"}
    encoder_throughput:
      timesfm_2_5_cpu: "162 windows/s (batch 32); 199M params; 925 MB download"
      zero_shot_cpu: "60 windows/s — the decoder path is ~2.7x slower than
        encoding alone"
    storage_per_window:
      raw_512_float32: 2.0 KB
      full_embedding_16x1280: "80.0 KB (40x expansion)"
      mean_pooled_1280: "5.0 KB (2.5x expansion)"
    whole_notebook_estimate: >
      3-6 minutes for 03_basemodels at 15 epochs; +2 minutes for the E6 TSFM
      section if the embeddings are computed rather than downloaded.

  the_other_candidates_tested:
    protocol: W=168 H=24 (or 56/7 for daily), 3 epochs, ratios vs naive
    traffic_hourly: {seasonal: 0.353, linear: 0.300, gru: 0.408}
    us_births:      {seasonal: 0.266, linear: 0.839, gru: 1.022}
    sunspot_daily:  {linear: 0.802, gru_10x1: 0.800, gru_64x2: 0.793}

  sunspots:
    load: 1.8s
    window: 0.01s -> (49944, 150, 1) train, (12375, 150, 1) valid, 30 MB
    batches: 1561 train / 387 valid
    naive_mae: 0.0601 (normalised units; last-value-repeated)
    models:
      linear_120_to_30: {mase: 0.802, params: 3630, per_epoch: 0.2s}
      gru_10x1:         {mase: 0.800, params: 720, per_epoch: 7.3s}
      gru_64x2:         {mase: 0.793, params: 39774, per_epoch: 21.7s}
    whole_notebook_estimate: 3-5 minutes at 3-10 epochs per model
  gestures_wisdm:
    download_and_load: 1.8s (20.6 MB)
    gru_64x1: 2.7s/epoch, accuracy 0.902 after 3 epochs (random split)
    same_model_subject_split: 0.761 after 3 epochs
  the_two_results_the_lesson_is_built_on: >
    **(1) A linear layer beats the GRU** — on all four datasets tried, at a
    hundredth of the cost (C7). Not a bug in the measurement: it is the
    LTSF-Linear result, and the current lesson's arc ("start with a linear
    baseline, then get serious") quietly implies the opposite.
    **(2) A model that never saw the task beats everything trained** — TimesFM
    zero-shot at 0.140 against the best trained model's 0.216, in seconds, with
    no new dependency (C10).
    Together they are the north star pointed at architectures: the expensive
    thing you build must earn its place against the cheap thing, and both must
    earn their place against the thing you can download. The claim is about
    **budget**, not capability — the same framing L2 used for the flowers CNN —
    and E5 is where the student tests whether it holds up.
  and_the_boundary_it_also_teaches: >
    the frozen-embedding pattern that carries L1 and L2 **loses here** (0.499 vs
    0.216), and it is not the aggregator and not the normalisation (C11). The
    course gets to show its own central technique failing, with a rule of thumb
    that predicts when: if the encoder expands the data rather than compressing
    it, it is re-encoding, not extracting.
  caveats: >
    15 epochs (3 for the earlier sweep), no tuning, no scheduler, one seed;
    per-series max scaling; MAE ratios against last-value-repeated on the
    validation split. The zero-shot number carries a contamination caveat (see
    datasets.BENCHMARKS). These sized the lesson; they are not for quoting
    without their conditions.

