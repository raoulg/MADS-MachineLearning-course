[project]
name = "mads-deeplearning"
version = "0.2.0"
description = ""

authors = [
    {name = "R.Grouls", email = "Raoul.Grouls@han.nl"},
]

requires-python = ">=3.12,<3.15"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "datasets>=4.0",
    "huggingface-hub>=0.30",
    "hyperopt>=0.2.7",
    "jupyter>=1.1.1",
    "loguru>=0.7.0",
    "matplotlib>=3.7.1",
    "mlflow>=3.5.1",
    "plotly>=5.17.0",
    "pydantic>=1.10.9",
    "ray[tune]>=2.58.0",
    "seaborn>=0.12.2",
    "tokenizers>=0.21.0",
    "tensorboard>=2.20",
    "torch>=2.6.0",
    "torchinfo>=1.8.0",
    "torch-geometric>=2.6.1",
    "torch-tb-profiler>=0.4.3",
    "torchvision>=0.21.0",
    "tomlserializer>=0.2.0",
    "vectormesh>=0.13.0",
    "scikit-learn>=1.9.0",
    "beartype>=0.22.9",
    "jaxtyping>=0.3.11",
    "numpy>=2.5",
    "pandas>=2.3",
    "scipy>=1.18",
    "requests>=2.34",
    "transformers>=5.22",
    "tqdm>=4.70",
    "pillow>=13.0",
    "filelock>=3.32",
]

[dependency-groups]
dev = [
    "isort>=5.13.2",
    "mypy>=1.14.1",
    "notebooktester>=0.3.8",
    "pyright>=1.1.392",
    "pytest>=9.2.0",
    "ruff>=0.15.16",
    "ty>=0.0.65",
]

[tool.uv.sources]

[tool.pyright]
executionEnvironments = [
  { root = "notebooks/8_extras/swarms" }
]

[tool.ruff]
# Scouting scripts kept as evidence for how a research number was produced. They import
# packages this project does not declare (sentence-transformers, nltk) and are deleted
# once the lesson built on them has run.
extend-exclude = ["planning/research"]
force-exclude = true

[tool.ty.src]
exclude = ["planning/research"]

[tool.ty.environment]
extra-paths = ["notebooks/0-baseline", "notebooks/2_timeseries", "notebooks/3_scaling_and_search", "notebooks/4_language", "notebooks/6_uncertainty", "notebooks/7_generalists_and_memory"]

